  /* numbers over every square and picture; the touch marks over all */
  let top = "";
  const halo = order.some(l => l.kind === "frame"), numInk = night ? "#a6a6a6" : "#4a4a4a";
  const hc = night ? "rgba(53,53,53,0.9)" : "rgba(255,255,255,0.9)";
  for(const [x, y, txt, lk] of labels)
    top += '<g data-k="' + lk + '" transform="translate(' + x + ',' + y + ') scale(1,-1)"><text x="0" y="0" style="font-size:' + (12*u) + 'px" fill="' + numInk + '"' +
           (halo ? ' stroke="' + hc + '" stroke-width="' + (3.2*u) + '" stroke-linejoin="round" paint-order="stroke"' : '') + '>' + txt + '</text></g>';
  for(const l of order){
    if(!l.touch) continue;
    const c = smInk(l.color), [x, y] = l.touch;
    top += '<g data-k="' + l.key + '"><circle cx="' + x + '" cy="' + y + '" r="' + (12*u) + '" fill="#ffffff" fill-opacity="0.6"/>' +
           '<circle cx="' + x + '" cy="' + y + '" r="' + (12*u) + '" fill="' + c + '" fill-opacity="0.22"/>' +
           '<circle cx="' + x + '" cy="' + y + '" r="' + (3.85*u) + '" fill="#ffffff"/>' +
           '<circle cx="' + x + '" cy="' + y + '" r="' + (2.6*u) + '" fill="' + c + '"/></g>';
  }
  if(SM.tap){
    const tc = night ? "#7fb2ec" : "#194c79", [x, y] = SM.tap.xy;
    top += '<circle cx="' + x + '" cy="' + y + '" r="' + (7*u) + '" fill="none" stroke="' + tc + '" stroke-width="' + (2*u) + '"/>' +
           '<circle cx="' + x + '" cy="' + y + '" r="' + (1.6*u) + '" fill="' + tc + '"/>';
  }
  $("#smtop").innerHTML = top;
  /* the picked layer's glow, under it (its opacity is the breath) */
  const s = order.find(l => l.key === SM.sel);
  let gl = "";
  if(s){
    const c = smInk(s.color);
    if(s.kind === "frame") gl = '<polygon points="' + smCorners(s).map(p => p.join(",")).join(" ") + '" fill="none" stroke="' + c + '" stroke-width="' + (6*u) + '" stroke-linejoin="round"/>';
    else if(s.kind === "line") gl = '<line x1="' + s.p0[0] + '" y1="' + s.p0[1] + '" x2="' + s.p1[0] + '" y2="' + s.p1[1] + '" stroke="' + c + '" stroke-width="' + (6*u) + '" stroke-linecap="round"/>';
    else gl = smPoints(s).map(p => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (20*u) + '" fill="' + c + '"/>').join("");
  }
  $("#smglowg").innerHTML = gl;
}
/* the value under a tap: the top shown frame that holds the point */
function smValueAt(x, y){
  for(const l of smDrawOrder().reverse()){
    if(l.kind !== "frame" || !SM.pics[l.img]) continue;
    const p = SM.pics[l.img], th = l.angle * Math.PI / 180, dx = x - l.cx, dy = y - l.cy;
    const lx = dx*Math.cos(th) - dy*Math.sin(th), ly = dx*Math.sin(th) + dy*Math.cos(th);
    const col = Math.floor((lx + l.w/2) / l.w * p.cols), row = Math.floor((l.h/2 - ly) / l.h * p.rows);
    if(col < 0 || row < 0 || col >= p.cols || row >= p.rows) continue;
    const q = p.q[row*p.cols + col];
    if(q === 255) return null;
    return {v: l.lo + q / 254 * (l.hi - l.lo), unit: l.unit};
  }
  return null;
}
/* move: a frame of a drag, the bubble only follows its point (its words
   and its width are the full draw's) */
function smReadout(move){
  const box = $("#smread");
  if(!SM.tap || !SM.view){ box.classList.add("hidden"); return; }
  const v = SM.view, [x, y] = SM.tap.xy;
  if(x < v.x0 || x > v.x0 + v.span || y < v.y0 || y > v.y0 + v.span){ box.classList.add("hidden"); return; }
  if(move && SM.readBw && !box.classList.contains("hidden")) return smReadPlace(box, x, y, SM.readBw);
  /* to the map's own resolution, one more figure than a screen pixel holds
     (a tap at the origin read "x -1.99e-7 nm") */
  const nm = v.span < 2000, k = nm ? 1 : 1e-3, S = smGeo().S;
  const dec = Math.max(0, Math.min(6, Math.ceil(-Math.log10(v.span * k / S)) + 1));
  const f = n => { const t = (n*k).toFixed(dec); return /^-0\.?0*$/.test(t) ? t.slice(1) : t; };
  const at = smValueAt(x, y);
  box.innerHTML = '<span class="m">x ' + f(x) + ' · y ' + f(y) + ' ' + (nm ? "nm" : "μm") + '</span>' +
                  (at ? '<br><b>' + esc(si3(at.v, at.unit)) + '</b>' : '');
  box.classList.remove("hidden");
  smReadPlace(box, x, y, SM.readBw = box.offsetWidth || 150);
}
function smReadPlace(box, x, y, bw){
  const v = SM.view, {W, S} = smGeo();
  const px = SM_L + (x - v.x0) / v.span * S, py = SM_T + (v.y0 + v.span - y) / v.span * S;
  box.style.left = Math.max(0, px + 16 + bw <= W ? px + 16 : px - 16 - bw) + "px";
  box.style.top = Math.max(0, py - 60) + "px";
}
/* one finger drags, two pinch, a wheel zooms; a short still touch reads */
function smGestures(svg){
  const pts = new Map();
  let start = null, wheelT = 0;
  const toData = (cx, cy) => {
    const r = svg.getBoundingClientRect(), v = SM.view, S = smGeo().S;
    return [v.x0 + (cx - r.left - SM_L) / S * v.span, v.y0 + v.span - (cy - r.top - SM_T) / S * v.span];
  };
  const clamp = () => {
    const half = (SM.data && SM.data.half_nm) || 10000, v = SM.view;
    v.span = Math.min(Math.max(v.span, 0.05), half * 2.6);
    const cx = Math.min(Math.max(v.x0 + v.span/2, -half*1.3), half*1.3);
    const cy = Math.min(Math.max(v.y0 + v.span/2, -half*1.3), half*1.3);
    v.x0 = cx - v.span/2; v.y0 = cy - v.span/2;
  };
  const again = () => { if(!SM.raf) SM.raf = requestAnimationFrame(() => { SM.raf = 0; smFrame(); }); };
  const settle = () => { if(SM.raf){ cancelAnimationFrame(SM.raf); SM.raf = 0; } smRender(); };
  const begin = () => {
    const P = [...pts.values()].map(q => ({x: q.x, y: q.y}));    // a copy: the live points move on
    start = {view: Object.assign({}, SM.view), P, t: performance.now(), moved: start ? start.moved : false,
             r: svg.getBoundingClientRect(),      // once per touch, not per move
             anchor: P.length === 2 ? toData((P[0].x + P[1].x)/2, (P[0].y + P[1].y)/2) : null,
             d: P.length === 2 ? Math.hypot(P[0].x - P[1].x, P[0].y - P[1].y) : 0};
  };
  svg.addEventListener("pointerdown", e => {
    if(!SM.view) return;
    if(SM.flyRaf){ cancelAnimationFrame(SM.flyRaf); SM.flyRaf = 0; }
    try { svg.setPointerCapture(e.pointerId); } catch(err){}   // a capture refused must not lose the finger
    pts.set(e.pointerId, {x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY});
    SM.touching = true; SM.touchT = performance.now();
    if(pts.size === 1) start = null;
    begin();
  });
  svg.addEventListener("pointermove", e => {
    const p = pts.get(e.pointerId); if(!p || !start) return;
    p.x = e.clientX; p.y = e.clientY;
    if(Math.hypot(p.x - p.x0, p.y - p.y0) > 6) start.moved = true;
    const r = start.r, P = [...pts.values()], S = smGeo().S;
    if(P.length === 1){
      const s0 = start.view, k = s0.span / S;
      SM.view = {x0: s0.x0 - (p.x - start.P[0].x) * k, y0: s0.y0 + (p.y - start.P[0].y) * k, span: s0.span};
    } else if(P.length === 2 && start.d){
      const d = Math.hypot(P[0].x - P[1].x, P[0].y - P[1].y) || 1;
      const span = start.view.span * start.d / d;
      const mx = (P[0].x + P[1].x)/2 - r.left, my = (P[0].y + P[1].y)/2 - r.top, [ax, ay] = start.anchor;
      SM.view = {span, x0: ax - (mx - SM_L) / S * span, y0: ay + (my - SM_T) / S * span - span};
    }
    clamp();
    if(SM.mode){ SM.mode = ""; smSeg(); }
    again();
  });
  const end = e => {
    if(!pts.has(e.pointerId)) return;
    const wasTap = start && !start.moved && pts.size === 1 && performance.now() - start.t < 400;
    const moved = start && start.moved;
    pts.delete(e.pointerId);
    if(wasTap) SM.tap = {xy: toData(e.clientX, e.clientY)};
    if(pts.size) begin();
    else {
      start = null; SM.touching = false;
      if(wasTap || moved) settle();                          // drawn sharp once the fingers lift
    }
  };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  svg.addEventListener("wheel", e => {
    if(!SM.view) return;
    e.preventDefault();
    const [ax, ay] = toData(e.clientX, e.clientY), f = Math.pow(1.15, e.deltaY > 0 ? 1 : -1), v = SM.view;
    SM.view = {span: v.span * f, x0: ax - (ax - v.x0) * f, y0: ay - (ay - v.y0) * f};
    clamp();
    if(SM.mode){ SM.mode = ""; smSeg(); }
    again();
    clearTimeout(wheelT); wheelT = setTimeout(settle, 160);
  }, {passive: false});
}
function renderScanMap(sm){
  const host = $("#scanmap"); if(!host) return;
  if(!sm || !sm.layers || !sm.layers.length){
    SM.data = null; SM.sig = "";
    if(SM.built || !host.firstChild){ SM.built = false; host.innerHTML = '<div class="dim">No display layers</div>'; }
    return;
  }
  if(!SM.built) smBuild(host);
  const sig = JSON.stringify(sm);
  if(sig === SM.sig) return;
  const first = !SM.data;
  SM.sig = sig; SM.data = sm;
  if(first || !SM.view){ SM.view = SM.mode === "scanner" ? smScanner() : smFit(); SM.mode = SM.mode || "layers"; smSeg(); }
  smImages(); smList(); smRender();
  smPictures().then(() => { smImages(); smRender(); });
}
/* The square window the panel's aspect-locked view shows: the rotated
   frame's bounding box, widened on its short side to a square. */
function frameView(g){
  const t = g.angle * Math.PI / 180, c = Math.abs(Math.cos(t)), s = Math.abs(Math.sin(t));
  const bw = g.w*c + g.h*s, bh = g.w*s + g.h*c, span = Math.max(bw, bh);
  return {x0: g.cx - span/2, x1: g.cx + span/2, y0: g.cy - span/2, y1: g.cy + span/2};
}
function renderFrames(m){
  LUT = lutOf(m.cmap);
  const host = $("#plots");
  const pp = perPage(host.clientWidth || document.body.clientWidth);
  const pages = Math.max(1, Math.ceil(m.channels.length / pp));
  page = Math.min(Math.max(0, page), pages - 1);
  const shown = m.channels.slice(page*pp, page*pp + pp);
  $("#pager").classList.toggle("hidden", pages < 2);
  $("#ppage").textContent = (page + 1) + " / " + pages;
  $("#pprev").disabled = page === 0;
  $("#pnext").disabled = page >= pages - 1;

  const have = {};
  for(const fr of m.frames || []) have[fr.s + "," + fr.f] = fr.id;
  const doneS = new Set((m.frames || []).map(fr => fr.s));
  const doneF = new Set((m.frames || []).map(fr => fr.f));

  /* The picker: built once per run, its greyed values brought up to date on
     every refresh. */
  const fp = $("#fpick");
  fp.classList.remove("hidden");
  const pickKey = JSON.stringify([m.slow.values, m.fast.values, m.slow.label, m.fast.label]);
  if(fp.dataset.k !== pickKey){
    fp.dataset.k = pickKey;
    const opts = vals => '<option value="" selected disabled hidden></option>' +
      vals.map((v, i) => '<option value="' + i + '">' + esc(String(v)) + '</option>').join("");
    fp.innerHTML = '<label>Slow</label><select data-w="s">' + opts(m.slow.values) +
      '</select><label>Fast</label><select data-w="f">' + opts(m.fast.values) + '</select>';
    fp.querySelectorAll("select").forEach(sel => {
      const cur = selFrame[sel.dataset.w];
      if(cur !== undefined) sel.value = String(cur);
      sel.addEventListener("change", () => {
        selFrame[sel.dataset.w] = +sel.value;
        if(lastMap) renderFrames(lastMap);
      });
    });
  }
  /* A value with no finished frame yet is listed but cannot be picked, so
     the reader sees where the run is going (_populate_history_combos). */
  fp.querySelectorAll("select").forEach(sel => {
    const done = sel.dataset.w === "s" ? doneS : doneF;
    [...sel.options].forEach((o, j) => { if(j > 0) o.disabled = !done.has(j - 1); });
  });

  const key_ = "frames@" + pp + "@" + page + ":" + shown.map(c => c.name).join(",");
  if(key_ !== plotKey){
    plotKey = key_;
    let html = shown.map((c, k) =>
      '<div class="chan" data-ch="' + esc(c.name) + '"><div class="chead">' +
      '<span class="cap">Display channel ' + (page*pp + k + 1) + '</span>' +
      '<span>' + c.label + '</span>' +
      (c.unit ? '<span class="u">(' + esc(c.unit) + ')</span>' : '') +
      segHTML(c, m, true) + '</div>' +
      '<canvas class="map"></canvas></div>').join("");
    for(let k = shown.length; k < pp; k++) html += '<div class="chan empty"></div>';
    host.innerHTML = html;
  }
  wireDirs(host);
  host.querySelectorAll(".seg").forEach(s => placeSegThumb(s, false));
  host.querySelectorAll(".chan[data-ch]").forEach((el, i) => {
    const c = shown[i];
    const cv = el.querySelector("canvas.map");
    const cw = cv.clientWidth;
    const inner = Math.max(60, cw - MARG.l - MARG.r);
    cv.style.height = Math.round(inner + MARG.t + MARG.b) + "px";
    const pick = selFrame;
    const id = have[pick.s + "," + pick.f];
    const v = frameView(m.geom);
    const view = {geom: m.geom, missing: 255,
                  fast: {start: v.x0, end: v.x1, label: "X", unit: "m"},
                  slow: {start: v.y0, end: v.y1, label: "Y", unit: "m"}};
    /* A DIFFERENT PICTURE DISSOLVES IN: when this column is about to show
       something other than what it last drew (another frame, the other
       pass, a word instead of a map), the old one fades out over it. The same
       picture drawn again on a refresh is simply drawn. The frame may arrive
       from the network some time after the pick, so this is decided when it
       is drawn, not when it was asked for. */
    const paint = (shown, fn) => {
      if(cv.dataset.drawn && cv.dataset.drawn !== shown) dissolve([cv], fn); else fn();
      cv.dataset.drawn = shown;
    };
    const blank = note => paint("blank:" + note, () => drawFrameBlank(cv, c, view, note));
    if(!id){
      blank(pick.s === undefined || pick.f === undefined ? "pick Slow and Fast"
                                                         : "that frame is not finished yet");
      return;
    }
    const want = id + (dirOf[c.name] || "fwd");
    cv.dataset.want = want;
    fetchFrame(id).then(fr => {
      if(cv.dataset.want !== want) return;        // picked something else since
      const d = (fr.channels || []).find(x => x.name === c.name);
      if(!d){ blank("not recorded in that frame"); return; }
      const pass = passOf(Object.assign({}, c, d));
      Object.assign(view, {rows: fr.rows, cols: fr.cols, missing: fr.missing});
      paint(want, () => drawMap(cv, pass, view));
    }).catch(() => { if(cv.dataset.want === want) blank("could not fetch that frame"); });

function renderPlots(m){
  LUT = lutOf(m.cmap);
  const host = $("#plots");
  const pp = perPage(host.clientWidth || document.body.clientWidth);
  const pages = Math.max(1, Math.ceil(m.channels.length / pp));
  page = Math.min(Math.max(0, page), pages - 1);
  const shown = m.channels.slice(page*pp, page*pp + pp);

  $("#pager").classList.toggle("hidden", pages < 2);
  $("#ppage").textContent = (page + 1) + " / " + pages;
  $("#pprev").disabled = page === 0;
  $("#pnext").disabled = page >= pages - 1;

  /* The pass shown is NOT part of the key: a click updates the toggle in
     place, so its pill can slide instead of the markup being rebuilt under
     it; every rebuild reads dirOf anyway. */
  const key = pp + "@" + page + (m.maponly ? "@map" : "") + ":" +
              shown.map(c => c.name + "|" + c.unit).join(",");
  if(key !== plotKey){
    plotKey = key;
    let html = shown.map((c, k) =>
      '<div class="chan"><div class="chead">' +
      '<span class="cap">Display channel ' + (page*pp + k + 1) + '</span>' +
      '<span>' + c.label + '</span>' +
      (c.unit ? '<span class="u">(' + esc(c.unit) + ')</span>' : '') +
      /* The direction toggle stays: the Frame 2D panel has one too, and its
         sub-files carry "<ch> Fwd" and "<ch> Bwd" columns. What a frame has
         no room for is a line plot under the image, which its panel does not
         have either. */
      (function(){
        /* Switchable only if THIS channel recorded a backward pass. */
        const two = c.z_b !== undefined;
        const bwd = two && dirOf[c.name] === "bwd";
        /* The words are the run's: an I-V map sweeps its bias Up then Down. */
        const [wf, wb] = m.dirs || ["Fwd", "Bwd"];
        return '<span class="seg' + (two ? '' : ' off') + '" data-ch="' +
          esc(c.name) + '" title="' +
          (two ? esc(wf + ' / ' + wb) :
                 'this channel has no backward pass') + '">' +
          '<span class="thumb"></span>' +
          '<span class="' + (bwd ? '' : 'on') + '" data-d="fwd" data-w="' + esc(wf) + '">' +
            esc(wf) + '</span>' +
          '<span class="' + (bwd ? 'on' : '') + '" data-d="bwd" data-w="' + esc(wb) + '">' +
            esc(wb) + '</span></span>';
      })() + '</div>' +
      '<canvas class="map"></canvas>' +
      (m.maponly || c.maponly ? '' : '<canvas class="lp"></canvas>') + '</div>').join("");
    for(let k = shown.length; k < pp; k++) html += '<div class="chan empty"></div>';
    host.innerHTML = html;
  }
  /* Clicking a segment redraws that column from the other pass. Bound on
     the host so it survives the markup being rebuilt by the pager. */
  wireDirs(host);
  host.querySelectorAll(".seg").forEach(s => placeSegThumb(s, false));
  host.querySelectorAll(".chan").forEach((el, i) => {
    const c = shown[i];
    const cmap = el.querySelector("canvas.map"), lp = el.querySelector("canvas.lp");
    if(!cmap) return;
    /* A SQUARE DATA AREA. At the panel's own column width this is within a
       few px of its 640 x 576 map; on a phone, where the margins are a much
       bigger share of a narrow column, keeping the panel's ratio made the map
       far taller than it is wide. The line plot stays two thirds of it, which
       is the panel's 3:2. */
    /* MEASURED TWICE ON PURPOSE. Giving these a height can make the page
       long enough for a scrollbar to appear, which narrows the column by
       the width of the bar AFTER the height was computed from the old
       width; the map then came out ten pixels taller than it is wide. If
       setting the height changed the width, do it again with the width
       that is now true. */
    const fit = () => {
      const cw = cmap.clientWidth;
      const inner = Math.max(60, cw - MARG.l - MARG.r);
      cmap.style.height = Math.round(inner + MARG.t + MARG.b) + "px";
      if(lp) lp.style.height = Math.round(inner*2/3 + MARG.t + MARG.b) + "px";
      return cw;
    };
    const first = fit();
    if(cmap.clientWidth !== first) fit();
    if(!c) return;
    const shownPass = passOf(c);
    /* The panel titles each plot with the pass it shows ("FB Mon - Up"). */
    if(m.dirs && m.dir_titles) shownPass.title = plainText(c.label) + " - " +
      m.dirs[dirOf[c.name] === "bwd" ? 1 : 0];
    drawMap(cmap, shownPass, m);
    if(lp) drawLine(lp, shownPass, m, page*pp + i);
  });
}

/* One timer, re-armed after each answer at the rate the answer deserves: a
   fixed interval would either poll a finished run every two seconds or make a
   running one wait twenty. */
function rearm(live){
  clearTimeout(timer);

     every second and a half, a whole snapshot each time: forty megabytes an
     hour for a page nobody was reading. Coming back asks at once

  if(document.hidden){ timer = null; return; }
  timer = setTimeout(tick, live ? paceLive() : paceIdle());

                    disconnect: "an instrument drops out", fault: "an error is logged",
                    aborted: "a run is stopped", remote_view: "this page stops updating",
                    started: "a run starts"};

/* ---------- PUSH: phone alerts with nothing to install (2026-09-29) --------
   This browser subscribes with its own push service (Apple's, Google's or
   Mozilla's, whichever made it), and the lab PC sends through that. What the
   service carries is encrypted for this browser alone. An iPhone does it for
   a page on its Home Screen (iOS 16.4 and up), not in a Safari tab.
   The page can write nowhere, so the subscription reaches the lab PC through
   a relay: sealed to the lab PC's key (push.relay.key, ECDH P-256 then
   AES-GCM), left in a random public message box, read there by the lab PC
   within half a minute. The lab PC then lists this device (push.subs, by a
   hash of its address), which is how this row knows it is really on.
   All of it arrives sealed with the rest (push), so only people who can
   sign in ever see the keys or the box. */
const PUSH_KEY = "rv.push";      // {h: this device's hash, sent: when it last asked}
let pushSnap = null;             // the push block of the last snapshot
let pushLocal = {known: false, sub: null, h: ""};
let pushBusy = "";               // "on" / "off" while turning, else ""
let pushSaid = "";               // a short answer to a tap, shown for a few seconds
let pushSaidTimer = null;

function pushEnv(){
  const ua = navigator.userAgent || "";
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const home = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) ||
               navigator.standalone === true;
  const can = !!(window.isSecureContext && "serviceWorker" in navigator &&
                 "PushManager" in window && "Notification" in window);
  return {ios, home, can};
}
const b64u = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, "-")
                     .replace(/\//g, "_").replace(/=+$/, "");
const unb64u = s => b64(String(s).replace(/-/g, "+").replace(/_/g, "/"));
async function pushHash(endpoint){
  const d = new Uint8Array(await crypto.subtle.digest("SHA-256",
                                                      new TextEncoder().encode(endpoint)));
  return [...d].map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 12);
}
/* the service worker (sw.js), once it is running; null if it never comes */
function pushWorker(){
  return Promise.race([navigator.serviceWorker.ready,
                       new Promise(res => setTimeout(() => res(null), 10000))]);
}
async function pushCurrent(){
  try {
    const r = await navigator.serviceWorker.getRegistration();
    return r ? await r.pushManager.getSubscription() : null;
  } catch(e){ return null; }
}
/* made with the lab PC's current key? A subscription belongs to the key it
   was made with, and a push signed with any other is refused. */
function pushSameKey(sub, vapid){
  try {
    const k = sub.options && sub.options.applicationServerKey;
    return !k || b64u(new Uint8Array(k)) === vapid;    // a browser that does not say: assume so
  } catch(e){ return true; }
}
function pushMemo(){
  try { return JSON.parse(localStorage.getItem(PUSH_KEY) || "{}") || {}; } catch(e){ return {}; }
}
function pushRemember(o){
  try { o ? localStorage.setItem(PUSH_KEY, JSON.stringify(o)) : localStorage.removeItem(PUSH_KEY); }
  catch(e){}
}
async function relaySeal(obj, keyText){
  const P256 = {name: "ECDH", namedCurve: "P-256"};
  const eph = await crypto.subtle.generateKey(P256, true, ["deriveBits"]);
  const pub = await crypto.subtle.importKey("raw", unb64u(keyText), P256, false, []);
  const shared = new Uint8Array(await crypto.subtle.deriveBits({name: "ECDH", public: pub},
                                                               eph.privateKey, 256));
  const tag = new TextEncoder().encode("rv-push-relay");
  const km = new Uint8Array(shared.length + tag.length);
  km.set(shared); km.set(tag, shared.length);
  const key = await crypto.subtle.importKey("raw", await crypto.subtle.digest("SHA-256", km),
                                            "AES-GCM", false, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: "AES-GCM", iv}, key,
                              new TextEncoder().encode(JSON.stringify(obj))));
  const epk = new Uint8Array(await crypto.subtle.exportKey("raw", eph.publicKey));
  return JSON.stringify({v: 1, epk: b64u(epk), iv: b64u(iv), ct: b64u(ct)});
}
/* one request to the lab PC: add this device (with the alerts it wants),
   remove it, change which alerts it gets, or send it a test */
async function relaySend(op, sub){
  const p = pushSnap;
  if(!(p && p.relay && sub)) return false;
  const who = BRAND_OPEN || {};
  const msg = {op, endpoint: sub.endpoint, tok: p.relay.tok || ""};
  if(op === "add"){
    msg.sub = sub.toJSON();
    msg.netid = who.netid || "";
    msg.name = who.user || "";
    msg.device = deviceInfo().name;
  }
  if(op === "add" || op === "prefs") msg.events = pushWanted();
  try {
    const r = await fetch(p.relay.url, {method: "POST", body: await relaySeal(msg, p.relay.key)});
    return r.ok;
  } catch(e){ return false; }
}

  if(pushBusy || !L.known) return "busy";
  if(Notification.permission === "denied") return "blocked";
  if(!L.sub || Notification.permission !== "granted" || !pushSameKey(L.sub, p.vapid) ||

/* what this device wants: what it last asked for here, else what the lab PC
   holds for it, else the defaults */
function pushWanted(){
  const m = pushMemo();
  if(Array.isArray(m.ev)) return PUSH_ORDER.filter(e => m.ev.includes(e));
  const held = pushHeld();
  return Array.isArray(held) ? held.slice() : PUSH_DEFAULT.slice();

}
const sameList = (a, b) => Array.isArray(a) && Array.isArray(b) && a.length === b.length &&
                           a.every(x => b.includes(x));
/* A TICK CHANGED: kept here at once, sent after a short pause so a few
   ticks in a row go as one request. */
let pushPickTimer = null;
function pushPick(){
  if(pushBusy) return;
  const ev = PUSH_ORDER.filter(e => {
    const b = $("#pushev").querySelector("input[data-ev='" + e + "']");
    return b && b.checked;
  });
  pushRemember(Object.assign(pushMemo(), {ev, evSent: 0}));
  renderPush();
  clearTimeout(pushPickTimer);
  pushPickTimer = setTimeout(() => { pushPickTimer = null; pushSendPrefs(); }, 700);
}
async function pushSendPrefs(){
  const sub = pushLocal.sub;
  if(!sub || pushView() !== "on") return;      // a device still waiting sends them with its add
  const m = pushMemo();
  if(!Array.isArray(m.ev) || sameList(pushWanted(), pushHeld())) return;
  pushRemember(Object.assign(m, {evSent: Date.now()}));
  if(!(await relaySend("prefs", sub))) pushSay("The lab PC could not be reached; it will be asked again");
  renderPush();
}
/* Where this device stands, read afresh: whenever a snapshot arrives and
   after every tap. It also asks the lab PC again while it has not confirmed
   (the box keeps a request twelve hours; a lab PC that was off, or a key
   that changed, is caught up by the next ask). */
async function pushRefresh(){
  if(!pushEnv().can){ pushLocal = {known: true, sub: null, h: ""}; renderPush(); return; }
  const sub = await pushCurrent();
  pushLocal = {known: true, sub, h: sub ? await pushHash(sub.endpoint) : ""};
  renderPush();
  const m = pushMemo(), v = pushView();
  if(v === "on"){
    /* a choice of alerts the lab PC has not confirmed: asked again */
    if(Array.isArray(m.ev) && !sameList(pushWanted(), pushHeld()) &&
       Date.now() - (m.evSent || 0) >= 180000 && !pushPickTimer) pushSendPrefs();
    return;
  }
  if(v !== "wait") return;
  if(m.h === pushLocal.h && Date.now() - (m.sent || 0) < 180000) return;
  pushRemember(Object.assign(m, {h: pushLocal.h, sent: Date.now()}));
  relaySend("add", sub);
}
function pushSay(text){
  pushSaid = text;
  clearTimeout(pushSaidTimer);
  pushSaidTimer = setTimeout(() => { pushSaid = ""; renderPush(); }, 5000);
  renderPush();
}
async function pushOn(){
  const p = pushSnap;
  if(!p || pushBusy) return;
  pushBusy = "on"; renderPush();
  let said = "";
  try {
    /* Asked first and on its own: the browser shows its question only in
       answer to a tap, and an iPhone is strict about what counts as one. */
    const perm = await Notification.requestPermission();
    if(perm !== "granted"){ said = perm === "denied" ? "" : "Not allowed"; return; }
    const reg = await pushWorker();
    if(!reg){ said = "This browser did not start its alert service"; return; }
    let sub = await reg.pushManager.getSubscription();
    if(sub && (!pushSameKey(sub, p.vapid) || (p.refused || []).includes(await pushHash(sub.endpoint)))){
      await sub.unsubscribe();
      sub = null;
    }
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true,
                                                     applicationServerKey: unb64u(p.vapid)});
    const h = await pushHash(sub.endpoint);
    pushRemember(Object.assign(pushMemo(), {h, sent: Date.now()}));   // the list chosen stays
    if(!(await relaySend("add", sub))) said = "The lab PC could not be reached; it will be asked again";
  } catch(e){
    said = "This browser would not turn alerts on";
  } finally {
    pushBusy = "";
    await pushRefresh();
    if(said) pushSay(said);
  }
}
async function pushOff(){
  if(pushBusy) return;
  pushBusy = "off"; renderPush();
  try {
    const sub = await pushCurrent();
    if(sub){
      await relaySend("remove", sub);
      await sub.unsubscribe();
    }
    /* the list chosen is kept for the next time alerts go on here */
    const keep = pushMemo().ev;
    pushRemember(Array.isArray(keep) ? {ev: keep} : null);
  } catch(e){}
  finally {
    pushBusy = "";
    await pushRefresh();
  }
}
async function pushTest(){
  const sub = pushLocal.sub;
  if(!sub) return;
  pushSay((await relaySend("test", sub)) ? "Test asked for; it arrives within a minute"
                                          : "The lab PC could not be reached");
}

/* ONE listener per list, on the list, bound once: the rows under it are
   updated in place and must not collect a listener per refresh. The open set
   is the truth; the classes follow it now and on every refresh after. */
function wireSections(host, openSet, attr){
  host.addEventListener("click", ev => {
    const el = ev.target.closest(".sec");
    if(!el || !host.contains(el)) return;
    const k = el.dataset[attr];
    openSet.has(k) ? openSet.delete(k) : openSet.add(k);
    el.classList.toggle("open", openSet.has(k));
    const body = el.nextElementSibling;
    if(body && body.classList.contains("body")) body.classList.toggle("shut", !openSet.has(k));
  });
}

/* ---------- the pressure trends ------------------------------------------ */
/* THE APP'S PUMP PANEL, A PLOT PER GAUGE: pressure on a log axis (a pump-down
   runs through nine decades), the lab's wall clock along the bottom with the
   date over each time, a dot on every sample, and the two tools the panel
   gives each plot. The publisher sends twelve hours, thinned so that a burst
   survives, and the last five minutes whole (snapshot.fridge_trend). */
const TREND_MARG = {l:58, r:12, t:26, b:44};
const TREND_RECENT_S = 300;                 // the panel's RECENT_WINDOW_S
const TREND_MIN_DECADES = 3;                // and its MIN_Y_DECADES
const TRENDS = [["gauge1_torr", "Gauge 1"], ["gauge2_torr", "Gauge 2"],
                ["gauge23_torr", "Gauge 23"]];
/* each gauge in its own colour, as the pump panel draws them */
const GAUGE_INK = {gauge1_torr: "--g1", gauge2_torr: "--g2", gauge23_torr: "--g23"};
/* The panel's clock ladder, from a minute up: labels land on round times. */
const CLOCK_LADDER = [60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400];
/* pyqtgraph's logTickStrings, which is how the app's log axes print a decade:
   1, 0.1 ... 0.0001 as numbers, anything else as a power of ten. */
function decadeLabel(k){
  return k === 0 ? "1" : "0." + "0".repeat(-k - 1) + "1";
}
/* THE EXPONENT IS DRAWN, NOT TYPED. pyqtgraph writes 10⁻⁵ with the Unicode
   superscript minus, which Segoe UI has and many phone faces do not: the
   minus then vanished and 10⁻⁵ read as 10⁵. Here "10" is set in the tick font
   and the exponent after it a size down and raised, which every face can do.
   Right-aligned at x, like every other tick label. */
function decadeText(g, k, x, y){
  if(k < 1 && k >= -4){ g.fillText(decadeLabel(k), x, y); return; }
  const exp = String(k).replace("-", "−"), small = "8px " + FACE;
  g.font = small; const ew = g.measureText(exp).width;
  g.font = TICK_FONT; const bw = g.measureText("10").width;
  g.textAlign = "left";
  g.fillText("10", x - ew - bw - 0.5, y);
  g.font = small; g.fillText(exp, x - ew, y - 4);
  g.font = TICK_FONT; g.textAlign = "right";
}
const pad2 = n => String(n).padStart(2, "0");
/* WHOLE RECORD OR THE LAST FIVE MINUTES, per plot, remembered by this browser
   (a convenience of this reader's, nothing more). */
const TREND_SPAN_KEY = "rv.trendspan";
let trendSpan = {};
try { trendSpan = JSON.parse(localStorage.getItem(TREND_SPAN_KEY) || "{}") || {}; }
catch(e){ trendSpan = {}; }
function drawTrend(cv, name, unit, tr, key){
  const dpr = window.devicePixelRatio || 1, M = TREND_MARG;
  const w = cv.clientWidth, h = cv.clientHeight, iw = w - M.l - M.r, ih = h - M.t - M.b;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue("--ink").trim(), fr = css.getPropertyValue("--frame").trim();
  const well = css.getPropertyValue("--well").trim();
  if(well && well !== "transparent"){ g.fillStyle = well; g.fillRect(M.l, M.t, iw, ih); }
  g.font = LABEL_FONT; g.fillStyle = ink; g.textAlign = "center"; g.textBaseline = "alphabetic";
  g.fillText(name, M.l + iw/2, 18);
  /* x: the whole record, or the last five minutes to the newest sample */
  const t1 = tr.now, t0 = trendSpan[key] === "recent" ? t1 - TREND_RECENT_S : t1 + (tr.t[0] || 0);
  const vs = tr[key] || [], pts = [];
  tr.t.forEach((dt, i) => { const t = t1 + dt, v = vs[i];
    if(t >= t0 && typeof v === "number" && v > 0) pts.push([t, Math.log10(v)]); });
  /* y: decades, never fewer than three, centred on what there is */
  let lo = 0, hi = 1;
  if(pts.length){ lo = Math.min(...pts.map(p => p[1])); hi = Math.max(...pts.map(p => p[1])); }
  const pad = (hi - lo) * 0.05; lo -= pad; hi += pad;
  if(hi - lo < TREND_MIN_DECADES){ const c = (hi + lo)/2; lo = c - TREND_MIN_DECADES/2; hi = c + TREND_MIN_DECADES/2; }
  const X = t => M.l + (t - t0)/((t1 - t0) || 1)*iw, Y = l => M.t + ih - (l - lo)/(hi - lo)*ih;
  g.strokeStyle = fr; g.lineWidth = 1; g.font = TICK_FONT; g.fillStyle = ink;
  g.textAlign = "right"; g.textBaseline = "middle";
  /* a label on every decade while they have 14 px, on every other one after */
  const every = (ih / Math.max(1, hi - lo)) < 14 ? 2 : 1;
  for(let k = Math.floor(lo); k <= Math.ceil(hi); k++){
    for(let m = 1; m <= 9; m++){
      const l = k + Math.log10(m);
      if(l < lo || l > hi) continue;
      const y = Math.round(Y(l)) + 0.5;
      g.beginPath(); g.moveTo(M.l + 0.5, y);
      g.lineTo(M.l + 0.5 + (m === 1 ? TICK_LEN : TICK_LEN/2), y); g.stroke();
      if(m === 1 && k % every === 0) decadeText(g, k, M.l - 6, y);
    }
  }
  g.save(); g.translate(10, M.t + ih/2); g.rotate(-Math.PI/2);
  g.font = LABEL_FONT; g.textAlign = "center"; g.fillText("P (" + unit + ")", 0, 0);
  g.restore();
  /* x: round clock times of the LAB's clock, the date over each, the way the
     panel's date axis writes them; a label at the right edge ends on it */
  const maxLabels = Math.max(2, Math.floor(iw / 72));
  const step = CLOCK_LADDER.find(s => (t1 - t0)/s <= maxLabels) || 86400;
  const tz = tr.tz || 0;
  g.font = TICK_FONT; g.textAlign = "center"; g.textBaseline = "top";
  for(let t = Math.ceil((t0 + tz)/step)*step - tz; t <= t1; t += step){
    const x = Math.round(X(t)) + 0.5, d = new Date((t + tz)*1000);
    g.beginPath(); g.moveTo(x, M.t + ih - 0.5); g.lineTo(x, M.t + ih - 0.5 - TICK_LEN); g.stroke();
    const l1 = d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate());
    const l2 = pad2(d.getUTCHours()) + ":" + pad2(d.getUTCMinutes());
    const half = Math.max(g.measureText(l1).width, g.measureText(l2).width)/2;
    const lx = Math.min(x, w - 2 - half);
    g.fillText(l1, lx, M.t + ih + 3);
    g.fillText(l2, lx, M.t + ih + 17);
  }
  /* the trace: the pump panel's navy, a dot on every sample */
  g.save(); g.beginPath(); g.rect(M.l, M.t, iw, ih); g.clip();
  if(!pts.length){
    g.fillStyle = css.getPropertyValue("--muted").trim(); g.textAlign = "left";
    g.textBaseline = "top"; g.fillText("no reading", M.l + 6, M.t + 6);
  } else {
    const col = css.getPropertyValue(GAUGE_INK[key] || "--line").trim();
    g.strokeStyle = col; g.lineWidth = 2; g.lineJoin = "round"; g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1])));
    g.stroke(); g.fillStyle = col;
    pts.forEach(p => { g.beginPath(); g.arc(X(p[0]), Y(p[1]), 2.5, 0, Math.PI*2); g.fill(); });
  }
  g.restore();
  g.strokeStyle = fr; g.lineWidth = 1; g.strokeRect(M.l + 0.5, M.t + 0.5, iw - 1, ih - 1);
}
/* The panel's own two glyphs: mi_span_all and mi_clock. */
const TREND_ICON_ALL = '<svg viewBox="0 0 24 24"><path class="f" d="M1.92 12 L8.01 6.6 L8.01 10.5 L15.99 10.5 L15.99 6.6 L22.08 12 L15.99 17.4 L15.99 13.5 L8.01 13.5 L8.01 17.4 Z"/></svg>';
const TREND_ICON_CLOCK = '<svg viewBox="0 0 24 24"><circle class="s" cx="12" cy="12" r="8.8"/><path class="s" d="M12 6.8 V12 L15.8 14.4"/></svg>';
/* THE TRENDS ARE PAGED like the Experiment's plots (the user, 2026-09-28:
   "can't the fridge plots be pages?"): as many side by side as the width
   holds (perPage, the pager's own rule: three on a desktop, one on a phone),
   the rest a page turn away, with the same pager under them and the same
   slide between pages. */
let trendPage = 0;
function renderTrends(f){
  const host = $("#trends");
  const tr = f && f.available && f.trend;
  host.classList.toggle("hidden", !tr);
  if(!tr) $("#tpager").classList.add("hidden");
  /* not while its module is shut: a hidden canvas has no width to draw into,
     and opening the module draws it (go -> redrawOpen) */
  if(!tr || host.closest(".hidden")) return;
  /* ":scope >" throughout: a page turn lays copies of the plots over the
     grid for a moment (slideTurn), and those are not the plots */
  if(!host.querySelector(":scope > .trend")){
    host.innerHTML = TRENDS.map(([key]) =>
      '<div class="trend" data-key="' + key + '"><div class="tools">' +
      '<button data-span="all" title="Show the whole record" aria-label="Show the whole record">' +
        TREND_ICON_ALL + '</button>' +
      '<button data-span="recent" title="Show only the last 5 min" aria-label="Show only the last 5 min">' +
        TREND_ICON_CLOCK + '</button>' +
      '</div><canvas></canvas></div>').join("");
    host.addEventListener("click", ev => {
      const b = ev.target.closest("button[data-span]");
      if(!b) return;
      const plot = b.closest(".trend");
      if(trendSpan[plot.dataset.key] === b.dataset.span) return;
      trendSpan[plot.dataset.key] = b.dataset.span;
      try { localStorage.setItem(TREND_SPAN_KEY, JSON.stringify(trendSpan)); } catch(e){}
      /* the plot dissolves from the one span into the other */
      if(lastSnap) dissolve([plot.querySelector("canvas")], () => renderTrends(lastSnap.fridge));
    });
  }
  /* which of them this page shows */
  const pp = perPage(host.clientWidth || document.body.clientWidth);
  const all = [...host.querySelectorAll(":scope > .trend")];
  const pages = Math.max(1, Math.ceil(all.length / pp));
  trendPage = Math.min(Math.max(0, trendPage), pages - 1);
  host.style.gridTemplateColumns = "repeat(" + pp + ", minmax(0, 1fr))";
  all.forEach((el, i) => el.classList.toggle("hidden", Math.floor(i / pp) !== trendPage));
  $("#tpager").classList.toggle("hidden", pages < 2);
  $("#tpage").textContent = (trendPage + 1) + " / " + pages;
  $("#tprev").disabled = trendPage === 0;
  $("#tnext").disabled = trendPage >= pages - 1;
  host.querySelectorAll(":scope > .trend:not(.hidden)").forEach(el => {
    const key = el.dataset.key, name = TRENDS.find(x => x[0] === key)[1];
    const span = trendSpan[key] === "recent" ? "recent" : "all";
    el.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.span === span));
    const cv = el.querySelector("canvas");
    const inner = Math.max(80, cv.clientWidth - TREND_MARG.l - TREND_MARG.r);
    cv.style.height = Math.round(inner*0.55 + TREND_MARG.t + TREND_MARG.b) + "px";
    drawTrend(cv, name, "Torr", tr, key);
  });
}

/* ---------- saving a plot ------------------------------------------------- */
/* SAVE OR SHARE A PLOT (2026-09-28): a button among each plot's own tools
   (the trends' row, the maps' title row, the top right of a sweep column)
   that turns what is on screen into one PNG: the plot's heading, its
   canvases one under the other on the page's own ground, and the lab time
   along the bottom. On a phone it opens the share sheet (Photos, Files, a
   message); elsewhere it downloads. The image is made AND shared inside the
   tap itself, with nothing waited for in between, because a phone's browser
   refuses a share that does not come straight from a tap. */
const SAVE_ICON = '<svg viewBox="0 0 24 24"><path class="s" d="M12 15V3.5M7.5 8 12 3.5 16.5 8' +
  'M5 13.5v5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5v-5"/></svg>';
const SAVE_BTN = '<button class="plotsave" type="button" title="Save or share this plot" ' +
                 'aria-label="Save or share this plot">' + SAVE_ICON + '</button>';
function addSaveButtons(){
  document.querySelectorAll("#trends .trend .tools").forEach(t => {
    if(!t.querySelector(".plotsave")) t.insertAdjacentHTML("beforeend", SAVE_BTN);
  });
  document.querySelectorAll("#plots .chan:not(.empty)").forEach(c => {
    if(c.querySelector("canvas") && !c.querySelector(":scope > .plotsave"))
      c.insertAdjacentHTML("beforeend", SAVE_BTN);
  });
  document.querySelectorAll("#plots .pophead").forEach(h => {
    if(!h.querySelector(".plotsave")) h.insertAdjacentHTML("beforeend", SAVE_BTN);
  });
}
let saveQueued = false;
new MutationObserver(() => {
  if(saveQueued) return;
  saveQueued = true;
  requestAnimationFrame(() => { saveQueued = false; addSaveButtons(); });
}).observe(document.querySelector("#views") || document.body, {childList: true, subtree: true});

function plotImage(box){
  const cvs = [...box.querySelectorAll("canvas")].filter(c => c.width > 2 && c.height > 2 &&
                                                          c.offsetParent !== null);
  if(!cvs.length) return null;
  const css = getComputedStyle(document.documentElement);
  const dpr = cvs[0].width / Math.max(1, cvs[0].clientWidth);
  /* what the plot is: a sweep column's caption, channel and unit and the
     pass it is showing (not both words of its toggle), a map's title, a
     trend's gauge (its title is drawn in its own canvas) */
  let head = "", name = "";
  const ch = box.querySelector(".chead");
  if(ch){
    const parts = [...ch.childNodes]
      .filter(n => !(n.classList && (n.classList.contains("seg") || n.classList.contains("plotsave"))))
      .map(n => (n.textContent || "").trim()).filter(Boolean);
    const dir = ch.querySelector(".seg .on");
    const pass = dir ? dir.textContent.trim() : "";
    head = parts.join(" ") + (pass ? " · " + pass : "");
    name = parts.slice(1).join(" ") + (pass ? " " + pass : "");
  } else if(box.querySelector(".poptitle")){
    head = name = box.querySelector(".poptitle").textContent.trim();
  } else if(box.closest(".trend")){
    const t = TRENDS.find(x => x[0] === box.closest(".trend").dataset.key);
    name = t ? t[1] + " pressure" : "Pressure";
  }
  const s = lastSnap || {};
  const when = new Date(s.now || Date.now());
  const foot = [((s.run || {}).file && !box.closest("#trends")) ? s.run.file : "",
                when.toLocaleDateString() + " " + (s.clock || when.toLocaleTimeString())]
               .filter(Boolean).join("   ");
  const pad = Math.round(12 * dpr), headH = head ? Math.round(26 * dpr) : 0,
        footH = Math.round(22 * dpr);
  const w = Math.max(...cvs.map(c => c.width)) + 2 * pad;
  const h = headH + cvs.reduce((a, c) => a + c.height, 0) + footH + pad;
  const out = document.createElement("canvas");
  out.width = w; out.height = h;
  const g = out.getContext("2d");
  g.fillStyle = css.getPropertyValue("--ground").trim() || "#f0f0f0";
  g.fillRect(0, 0, w, h);
  let y = pad;
  if(head){
    g.fillStyle = css.getPropertyValue("--ink").trim() || "#222222";
    g.font = "600 " + Math.round(13 * dpr) + "px Helvetica Neue, Helvetica, Arial, sans-serif";
    g.textBaseline = "middle"; g.textAlign = "center";
    g.fillText(head, w / 2, y + headH / 2 - Math.round(4 * dpr));
    y += headH;
  }
  for(const c of cvs){ g.drawImage(c, Math.round((w - c.width) / 2), y); y += c.height; }
  g.fillStyle = css.getPropertyValue("--muted").trim() || "#666666";
  g.font = Math.round(11 * dpr) + "px Helvetica Neue, Helvetica, Arial, sans-serif";
  g.textBaseline = "middle"; g.textAlign = "right";
  g.fillText(foot, w - pad, y + footH / 2);
  return {canvas: out, name: name || head || "Plot"};
}
function savePlot(btn){
  const box = btn.closest(".trend, .chan, .popmap, .apxy");
  const img = box && plotImage(box);
  if(!img) return;
  const d = new Date(), p2 = n => String(n).padStart(2, "0");
  const stamp = d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) + " " +
                p2(d.getHours()) + "-" + p2(d.getMinutes());
  const fname = (img.name.replace(/[^\w .()+-]+/g, " ").replace(/\s+/g, " ").trim() || "plot") +
                " " + stamp + ".png";
  /* synchronously, so the share below still counts as part of the tap */
  const url = img.canvas.toDataURL("image/png");
  const bin = atob(url.split(",")[1]);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type: "image/png"});
  let file = null;
  try { file = new File([blob], fname, {type: "image/png"}); } catch(e){}
  if(file && navigator.canShare && navigator.canShare({files: [file]}) &&
     /Android|iPhone|iPad/.test(navigator.userAgent || "")){
    navigator.share({files: [file], title: img.name}).catch(() => {});
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
document.addEventListener("click", e => {
  const b = e.target.closest(".plotsave");
  if(!b) return;
  e.preventDefault();
  e.stopPropagation();
  savePlot(b);
});

/* ---------- the system log ----------------------------------------------- */
/* Oldest first with the newest at the BOTTOM, and follow it, because that is
   the Global System Log's own order. The source tag at the head of a line is
   navy on every line, including a warning or an error: only the body takes
   the level colour. */
const LOG_TAG = /^([\[(][^\])]{1,40}[\])])\s*/;
function logLineHTML(l){
  const mm = LOG_TAG.exec(l.text || "");
  const tag = mm ? '<span class="g">' + esc(mm[1]) + '</span> ' : "";
  const body = mm ? (l.text || "").slice(mm[0].length) : (l.text || "");
  return '<div><span class="t">' + esc(l.time) + '</span>' + tag +
         '<span class="' + esc(l.level) + '">' + esc(body) + '</span></div>';
}
/* THE LOG MOVES THE WAY THE APP'S DOES (Widgets: log follow glide). The
   publisher sends the newest lines, so from one push to the next some fall
   off the top and some arrive at the bottom. The lines still there keep
   their places, the new ones are added under them, and a reader who was at
   the end is carried down to it smoothly; one who had scrolled up to read is
   left exactly where they were. Lines are matched on time, text and level. */
let logKeys = [];
/* AT THE END, OR FOLLOWING IT. On a phone these lists are filled while their
   module is hidden, where a box has no height: measuring it said "scrolled
   up", so the log opened on its oldest line and never followed again. A
   hidden box goes by what its reader last did with it (FOLLOW_SEL below). */
const FOLLOW_SEL = "#log, .zrec, .xyrec";
function atEndOf(box){
  if(!box.clientHeight) return box.dataset.follow !== "0";
  return box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
}
document.addEventListener("scroll", e => {
  const b = e.target;
  if(b && b.matches && b.matches(FOLLOW_SEL) && b.clientHeight)
    b.dataset.follow = atEndOf(b) ? "1" : "0";
}, true);
function followDown(root){
  root.querySelectorAll(FOLLOW_SEL).forEach(b => {
    if(b.dataset.follow !== "0") b.scrollTop = b.scrollHeight; });
}
function renderLog(lines){
  const box = $("#log");
  const keys = lines.map(l => [l.time, l.text, l.level].join("\u0001"));
  const wasAtEnd = atEndOf(box);
  /* how many old lines went off the top: what is left of the old list must
     be where the new one starts */
  let drop = -1;
  for(let k = 0; k <= logKeys.length && drop < 0; k++){
    const rest = logKeys.length - k;
    if(rest > keys.length) continue;
    let same = true;
    for(let i = 0; i < rest && same; i++) same = logKeys[k + i] === keys[i];
    if(same) drop = k;
  }
  if(drop < 0 || box.children.length !== logKeys.length){
    box.innerHTML = lines.map(logLineHTML).join("");
    if(wasAtEnd) box.scrollTop = box.scrollHeight;
  } else if(drop > 0 || keys.length > logKeys.length){
    box.insertAdjacentHTML("beforeend",
      lines.slice(logKeys.length - drop).map(logLineHTML).join(""));
    let lost = 0;
    for(let i = 0; i < drop; i++){
      lost += box.firstElementChild.offsetHeight;
      box.firstElementChild.remove();
    }
    if(lost) box.scrollTop = Math.max(0, box.scrollTop - lost);
    if(wasAtEnd) box.scrollTo({top: box.scrollHeight, behavior: motionOK() ? "smooth" : "auto"});
  }
  logKeys = keys;
}

/* ---------- the front panel ---------------------------------------------- */
/* PROGRESS_QSS's groove with its own caption centred on it. One definition,
   used by the run's section and by the run's row on the front panel, so the
   two can never drift apart. */
/* ── the panel's run-info grid ─────────────────────────────────────────────
   Each cell knows the row, column and span it had in the QGridLayout, so the
   page puts it back there: captions in columns 0 and 3, values in 1 and 4,
   and a progress bar across 0..2. The publisher sends the panel's own cells
   when the app is running and a reconstruction from the run file when it is
   not; both arrive in this one shape, so there is one renderer. */
function renderRuntime(cells){
  const host = $("#runtime");
  host.classList.toggle("hidden", !cells.length);
  if(!cells.length){ host.innerHTML = ""; return; }
  /* CSS grid lines count from one, and a column the panel left empty must
     stay empty, so every cell is placed rather than flowed. In place, so the
     bars in it glide. */
  morph(host, cells.map(c => {
    const at = 'grid-row:' + (c.r + 1) + '; grid-column:' + (c.c + 1) +
               ' / span ' + Math.max(1, c.cs || 1) + ';';
    if(c.kind === "bar"){
      return '<div class="bar' + ((c.frac || 0) >= 1 ? ' full' : '') +
             '" style="' + at + '">' +
             '<div class="fill" style="width:calc(' +
             (Math.max(0, Math.min(1, c.frac || 0))*100).toFixed(2) +
             '% - 2px)"></div><div class="cap">' + esc(c.text || "") +
             '</div></div>';
    }
    const cls = c.kind === "cap" ? "k" : "v";
    return '<span class="' + cls + '" style="' + at + '">' + esc(c.text || "") +
           (c.unit ? '<span class="u">' + esc(c.unit) + '</span>' : '') +
           '</span>';
  }).join(""));
}

function barHTML(pct, cap){
  pct = Math.max(0, Math.min(1, pct || 0));
  return '<div class="bar' + (pct >= 1 ? ' full' : '') + '">' +
         '<div class="fill" style="width:calc(' + (pct*100).toFixed(2) +
         '% - 2px)"></div><div class="cap">' + cap + '</div></div>';
}

/* Wide enough for everything at once? The same width the plots stop paging
   at, so the page has one idea of "narrow" rather than two. */
const WIDE = 860;
const wide = () => window.innerWidth >= WIDE;

//: module id -> the name on its row, in the order they are listed
const MODULES = [
  ["m-experiment", "Experiment"],
  ["m-fridge",     "Fridge Status"],
  ["m-scanmap",    "Scan Map"],
  ["m-insts",      "Instrument Connections"],
  ["m-log",        "System Log"],
  ["m-xlog",       "Experiment Log"],
  ["m-events",     "Last 24 Hours"],
];
/* Pages that are NOT modules: no row on the front panel, never laid out
   with the monitoring, reached only by their own control. */
const EXTRA = ["m-account"];
const ROUTABLE = () => MODULES.map(m => m[0]).concat(EXTRA);

let route = null;            // which page is open, if any
let pressedRow = null;       // the front panel row that was opened, washed until back
let lastSnap = null;         // the last snapshot, for redrawing the rows

const CHEV = '<svg viewBox="0 0 24 24"><path d="M8.3 4.8 L15.7 12 L8.3 19.2"/></svg>';

/* What a module puts on its own row: the one reading that says whether it
   needs opening. */
function summary(id, s){
  const r = s.run || {};
  if(id === "m-experiment"){
    let out = '<div class="modread">' +
              (r.experiment ? esc(r.experiment)
                            : '<span class="dim">no run yet</span>') + '</div>';
    /* ONE BAR on the front panel, the big one (the user, 2026-09-23). The
       app sends the Total bar's own caption and fill when it is running;
       otherwise it is rebuilt from the counts. */
    const hb = r.home_bar;
    if(Array.isArray(hb)){
      out += barHTML(hb[1] || 0, esc(String(hb[0] || "")));
    } else {
      const B = r.bars;
      if(B && B.total && B.total[1]){
        out += barHTML(B.total[0] / B.total[1],
                       B.total[0] + ' / ' + B.total[1]);
      }
    }
    return out;
  }
  if(id === "m-scanmap"){
    const n = ((s.scanmap || {}).layers || []).length;
    return '<div class="modread">' + (n ? n + (n === 1 ? " layer" : " layers")
                                       : '<span class="dim">no layers</span>') + '</div>';
  }
  if(id === "m-fridge"){
    const f = s.fridge || {};
    if(!f.available) return '<div class="modread dim">not on this system</div>';
    const L = f.latest || {};
    const bits = [];
    /* in the module's own units: mK below a kelvin, the cell in mbar */
    const tk = fmtKelvin(L.temperature_k);
    const g1 = _real(L.gauge1_torr) ? fmtPressure(L.gauge1_torr * 1.33322368, "mbar") : null;
    if(tk) bits.push('<span class="nb">' + tk[0] + " " + tk[1] + '</span>');
    if(g1) bits.push('<span class="nb">' + g1[0] + " " + g1[1] + '</span>');
    const stale = ' ' + agoSpan(f.age_s, 60, true);
    return '<div class="modread wrap">' +
           (bits.length ? bits.join(" &middot; ")
                        : '<span class="dim">no reading</span>') + '<span class="nb">' + stale + '</span></div>';
  }
  if(id === "m-insts"){
    const d = s.insts || {};
    if(!d.available) return '<div class="modread dim">No roster</div>';
    const items = d.items || [];
    const lamps = '<span class="lamps">' + items.map(i =>
      '<span class="led ' + (INST_STATE[i.state] || INST_STATE.unknown)[0] +
      '"></span>').join("") + '</span>';
    return '<div class="modread">' + lamps +
           (d.up || 0) + ' of ' + (d.total || items.length) + ' Connected</div>';
  }
  if(id === "m-xlog"){
    const x = s.explog || {};
    const e = (x.entries || [])[0];
    if(!x.available) return '<div class="modread dim">no log file</div>';
    if(!e) return '<div class="modread dim">nothing logged yet</div>';
    return '<div class="modread"><span class="dim">' + esc(e.day) + '</span> ' +
           esc(e.name) + '</div>';
  }
  if(id === "m-log"){
    const lines = (s.log || {}).lines || [];
    const last = lines[lines.length - 1];
    if(!last) return '<div class="modread dim">nothing logged</div>';
    return '<div class="modread"><span class="dim">' + esc(last.time) + '</span> ' +
           esc(last.text || "") + '</div>';
  }
  if(id === "m-events"){
    /* one lamp for the day, as the instruments' row has one per instrument:
       red if anything went wrong, gold for warnings only, green for runs
       that finished and nothing else, grey for a quiet day */
    const ev = s.events;
    if(!ev) return '<div class="modread dim">not sent by this lab PC yet</div>';
    const c = ev.counts || {};
    const bits = [];
    const plural = (n, one, many) => '<span class="nb">' + n + " " + (n === 1 ? one : many) + '</span>';
    if(c.safetip) bits.push(plural(c.safetip, "SafeTip", "SafeTips"));
    if(c.errors) bits.push(plural(c.errors, "error", "errors"));
    if(c.stopped) bits.push(plural(c.stopped, "run stopped", "runs stopped"));
    if(c.warnings) bits.push(plural(c.warnings, "warning", "warnings"));
    const lamp = (c.safetip || c.errors) ? "error" : (c.warnings || c.stopped) ? "connecting"
               : c.finished ? "on" : "off";
    const text = bits.length ? bits.join(" &middot; ")
               : c.finished ? plural(c.finished, "run finished", "runs finished")
               : '<span class="dim">Quiet</span>';
    return '<div class="modread wrap"><span class="led evlamp ' + lamp + '"></span>' +
           text + '</div>';
  }
  return "";
}

function renderHome(s){
  /* The run's row carries the same heading its page does: "Experiment in
     progress" while one runs, "Last Experiment" after (the user, 2026-09-23). */
  const runName = (((s.run || {}).active) && !isSilent()) ? "Experiment in progress"
                                                           : "Last Experiment";
  morph($("#home"), MODULES.map(([id, name]) =>
    [id, id === "m-experiment" ? runName : name]).map(([id, name]) =>
    '<button class="modrow' + (id === pressedRow ? ' pressed' : '') + '" data-go="' + id + '">' +
      '<div class="modname"><span>' + esc(name) + '</span>' + CHEV + '</div>' +
