<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<!-- The phone's own bar above the page takes the page's ground, so the page
     runs up to the top of the screen instead of under a white strip. -->
<meta name="theme-color" content="#f0f0f0">
<title>Status</title>
<!-- ON A PHONE'S HOME SCREEN (manifest.webmanifest, sw.js): a plain pulse on
     the page's navy, called Status like the tab, since these files are as
     public as the page. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Status">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
/* Applied BEFORE the first paint: a phone on a dark system would otherwise
   flash the light page while the rest of the script loads. */
(function(){
  var m = "system";
  try { m = localStorage.getItem("rv.theme") || "system"; } catch(e){}
  var dark = m === "night" || (m !== "day" && window.matchMedia &&
             matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "night" : "day";
  var tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.content = dark ? "#353535" : "#f0f0f0";
  /* A REMEMBERED SIGN-IN OPENS BY ITSELF, so the sign-in card is not shown
     for the second it takes: it used to flash up and vanish on every visit.
     Taken off again if that sign-in does not open anything. */
  try { if(localStorage.getItem("rv.pass")) document.documentElement.dataset.auto = "1"; }
  catch(e){}
})();
</script>
<!--
  This page is public, and it holds nothing. Everything it shows is fetched as
  a sealed block and opened here, in the browser, with a passphrase that is
  never sent anywhere. Reading this source tells you how the lock works and
  nothing about the lab.

  EVERY COLOUR AND EVERY MEASUREMENT BELOW COMES FROM THE APP. The day values
  are Widgets/ui_style.py, the night values are what Widgets/night_theme.py
  translates each of them to, read out of the app rather than guessed, so the
  page is the same component set the desktop windows are built from: 3 px
  corners, 1 px #cccccc hairlines, the #f9f9f9 card, the navy #003366 title
  over a grey abstract, bold-black section headers over a 1 px rule, the blue
  and brick and gold status pills, the #b3c8de progress fill, and the line
  plot's own navy.

  The publisher is Remote_View/publish.py on the lab PC.
-->
<style>
 /* ── the app's day palette (Widgets/ui_style.py) ─────────────────────────── */
 :root{
   --ground:#f0f0f0;        /* the window ground a panel sits on               */
   --card:#f9f9f9;          /* SURFACE: settings_card, fields, every panel     */
   --border:#cccccc;        /* FIELD_BORDER: card and field hairline           */
   --rule:#d6d6d6;          /* DIVIDER_COLOR: hline() and the header rule      */
   --ink:#222222;           /* FIELD_TEXT                                      */
   --muted:#666666;         /* SUBTITLE_COLOR / GREY_700                       */
   --unit:#4a4a4a;          /* UNIT_INK: the unit after a value                */
   --reading:#555555;       /* live_parameters VALUE_INK: a fridge reading     */
   --navy:#003366;          /* PRIMARY_DARK / TITLE_COLOR                      */
   /* ui_style.segmented_control: #e3e3e3 track, #f9f9f9 pill on #cfcfcf */
   --seg-track:#e3e3e3; --seg-pill:#f9f9f9; --seg-edge:#cfcfcf;
   --navy-hover:#143d62;    /* PRIMARY_HOVER                                   */
   --navy-fill:#194c79;     /* PRIMARY                                         */
   --pill-blue-bg:#eef2f7; --pill-blue-edge:#d3dce6; --pill-blue-ink:#003366;
   --pill-red-bg:#f9eeeb;  --pill-red-edge:#e6c6bd;  --pill-red-ink:#8c2f22;
   --pill-gold-bg:#fdf6e3; --pill-gold-edge:#ecdca0; --pill-gold-ink:#8a6d1f;
   --track:#f7f7f7;         /* FIELD_BG_RO                                    */
   --bar-track:#ececec;     /* GREY_100: PROGRESS_QSS's own groove             */
   --progress:#b3c8de;      /* PROGRESS_FILL                                   */
   --line:#173e6b;          /* LINE_COLORS[2], the app's navy curve            */
   --frame:#888888;         /* PLOT_FRAME_COLOR                                */
   --well:transparent;      /* a plot melts into the panel it sits on          */
   --well2:#f0f0f0;         /* the histogram box's own ground                  */
   --hist-edge:#c2c2c2;     /* its hairline                                    */
   --hist-ink:#9a9a9a;      /* the histogram outline                           */
   --log-err:#cc0000; --log-warn:#cc8800;
   --tool:#000000;          /* PLOT_TOOL_ICON: the tool glyphs are black       */
   --tool-off:#c2c2c2;      /* the same glyph disabled                         */
   --hover:#ececec;         /* GREY_100: the wash under a hovered icon button  */
   /* BTN_ICON_TOGGLE_QSS, a checkable plot tool: hover, checked, both */
   --tb-hover:#e8e8e8; --tb-on:#d8d8d8; --tb-on-hover:#cfcfcf;
   /* PRESSED, from the app's own button sheets: a plain button (GREY_200, the
      main window's module buttons), the navy primary (BTN_PRIMARY_QSS), a
      ghost (BTN_GHOST_QSS), a light danger button, a segment (segToggle) */
   --press:#e0e0e0; --navy-press:#001a33; --ghost-press:#e6e6e6;
   --danger-press:#ffd5d5; --seg-press:#d0d0d0;
   --pager-ink:#333333;     /* PagedStrip's "n / m" label                      */
   --log-bg:#f9f9f9;        /* the Global System Log's own box                 */
   --log-edge:#cfcfcf; --log-ink:#333333; --log-time:#9aa0a6; --log-tag:#003366;
   /* ui_style.LINE_COLORS: one per display column, in order. */
   --l0:#7F1D1D; --l1:#9C7A10; --l2:#173E6B;
   --l3:#14572F; --l4:#472A6E; --l5:#0B535A;
   --radius:3px;            /* RADIUS_SM = RADIUS_MD = RADIUS_LG = 3           */
   /* direction_toggle disabled: track, pill on its edge, text */
   --seg-off-track:#ececec; --seg-off-pill:#efefef; --seg-off-edge:#dcdcdc;
   --seg-off-ink:#b0b0b0;
   /* UI_pump_lines_DR.GAUGE_COLORS */
   --g1:#003366; --g2:#2e6fb4; --g23:#6fa8dc;
 }
 /* ── and its night translation, read out of Widgets/night_theme.py ───────── */
 /* NIGHT. Set as an attribute rather than matched as a media query, so
    the three-way choice below has one place to express itself. */
 :root[data-theme="night"]{
   --ground:#353535;        /* GROUND */
   --card:#3b3b3b;          /* CARD   */
   --border:#565656; --rule:#565656;          /* BORDER */
   --ink:#e6e6e6;           /* TEXT   */
   --muted:#a6a6a6; --unit:#a6a6a6;           /* TEXT_MUTED */
   --reading:#dadada;       /* VALUE_INK_NIGHT */
   --navy:#7fb2ec;          /* NAVY_TEXT: navy as TEXT lifts, as a fill it does not */
   --navy-hover:#2a6bb0; --navy-fill:#1f4f85;
   --pill-blue-bg:#2e4760; --pill-blue-edge:#3e658f; --pill-blue-ink:#7fb2ec;
   --pill-red-bg:#543533;  --pill-red-edge:#744a46;  --pill-red-ink:#e8a29a;
   --pill-gold-bg:#544a2e; --pill-gold-edge:#ecdca0; --pill-gold-ink:#e8c569;
   --track:#393939; --bar-track:#4a4a4a;
   --progress:#4a6f95;      /* PROGRESS */
   --line:#6fa3d8;          /* the line palette lifted for a dark ground */
   --frame:#8e8e8e;
   /* By night the app lifts the inside of a plot one step above the card it
      sits on, so the axes read as a well rather than as a hole. FIELD. */
   --g1:#7fb2ec; --g2:#2e6fb4; --g23:#6fa8dc;   /* ink(GAUGE_COLORS, "line") */
   --well:#454545; --well2:#414141; --hist-edge:#616161; --hist-ink:#7e7e7e;
   --log-err:#e07a86; --log-warn:#e4c56a;
   --tool:#e6e6e6; --tool-off:#616161; --hover:#4a4a4a; --pager-ink:#dadada;
   --tb-hover:#484848; --tb-on:#565656; --tb-on-hover:#616161;   /* map_hex of the day three */
   --press:#565656; --navy-press:#1f508a; --ghost-press:#414141;  /* and of the pressed five */
   --danger-press:#643d39; --seg-press:#565656;
   /* The time column is night_ink("#9aa0a6", "text"), as UI_main_window
      inks it: #8a8a8a, not TEXT_DIM (checked 2026-09-27). */
   --log-bg:#353535; --log-edge:#616161; --log-ink:#dadada;
   --log-time:#8a8a8a; --log-tag:#7fb2ec;
   /* ui_style.direction_toggle rendered by night in the app itself
      (2026-09-27, pixels read offscreen): the track #484848, the pill the
      darker #353535 on a #616161 hairline. The page had the pill LIGHTER
      than the track, the other way round from the panel. */
   --seg-track:#484848; --seg-pill:#353535; --seg-edge:#616161;
   /* night_theme.LINE_COLORS: the same six hues lifted for a dark ground. */
   --l0:#e0665e; --l1:#e6c15a; --l2:#6fa3d8;
   --l3:#7fbf5f; --l4:#b18ae0; --l5:#5fc3cc;
 }

 *{ box-sizing:border-box; -webkit-text-size-adjust:100%;
    /* no browser flash on a tap: the rows and buttons answer in the app's
       own colours (:hover / :active below) */
    -webkit-tap-highlight-color:transparent; }
 /* The browser's own controls (a drop-down's list, a tick, a scrollbar) are
    drawn for the theme the PAGE is in, which is not always the system's. */
 :root{ color-scheme:light; }
 :root[data-theme="night"]{ color-scheme:dark; }
 /* TYPE, MEASURED OFF THE PANEL, not chosen. Segoe UI 9 pt is the
    application default and 9 pt is 12 px at the 96 dpi a browser assumes, so
    12 px is this page's body size and every other size below is the same
    conversion of what the panel sets. */
 /* The panel's own window is 2000 px wide at its natural size; the page
    stops there rather than spreading across a monitor. */
 /* THE SCROLLBAR ALWAYS HAS ITS LANE. Without this the page is a loop: a
    plot is sized from the column width, that makes the page tall enough for
    a scrollbar, the bar takes 10 px off the column, and the plot that was
    just sized is 10 px out. Reserving the lane breaks the loop rather than
    chasing it, which two passes of re-measurement only made oscillate. */
 html{ scrollbar-gutter:stable; }
 /* NO RUBBER BAND. A phone let the whole page, masthead and all, be dragged
    and spring back even when a view did not fill the screen, which is what
    gives a web page away (the user, 2026-09-29: "更像一个app"). A view
    longer than the screen still scrolls; it just stops at its ends. */
 html, body{ overscroll-behavior:none; }
 /* ON A DESKTOP THE PAGE IS A CENTRED COLUMN with room either side (the
    user, 2026-09-23), 1280 px at most; a phone still uses its full width. */
 /* THE SAFE AREA. The viewport is declared viewport-fit=cover, so on a
    phone with a notch the page runs under it; a turned iPhone put the left
    edge of every row under the notch and the footer under the home bar. The
    16 px stays the least the page keeps from each edge. */
 body{ margin:0 auto; max-width:1280px; overflow-x:hidden;
       padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
       background:var(--ground); color:var(--ink);
       font:12px/1.45 "Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif; }
 /* THE FOOTER CLOSES THE SCREEN, not the content: on a short view (the
    Last 24 Hours with one row, the account) it stood in the middle of the
    phone with the empty ground under it. The page is at least one screen
    tall (its margins included, since every box here is border-box; svh:
    the screen with the browser's bars showing, so the footer never needs a
    scroll to reach), the app and
    its views are columns that take that height, and the footer's auto
    margin takes up whatever is left. A long view is not changed.
    Only #viewbody (everything in the views but the footer) is the column's
    item, so the modules inside it stack exactly as before. An item's
    margins no longer merge across its edge: the list's 2 px went into the
    greeting line's 20 px anyway, and the last module's 22 px stays inside
    #viewbody, so the footer adds only the 4 px that made its old 26 (the
    list, which has no margin under it, takes the module's 22). */
 body{ display:flex; flex-direction:column; min-height:100vh; min-height:100svh; }
 #app{ flex:1 0 auto; display:flex; flex-direction:column; }
 #views{ flex:1 0 auto; display:flex; flex-direction:column; }
 #viewbody{ flex:1 0 auto; }
 #viewbody > #home{ margin:0 0 22px; }

 /* header_block(): TITLE_PT 16 bold navy, abstract 2 px under it in grey,
    with the app's own icon beside them. */
 /* The mark and the name are ONE line: the name shrinks on a narrow screen
    rather than wrapping under the mark. The state pill is its own line under
    them. */
 .brand{ display:flex; align-items:center; gap:9px; margin-bottom:6px;
         font-size:clamp(15px, 4.4vw, 21.3px); }
 .brand .logo{ width:1em; height:1em; flex:0 0 1em; }
 .brand .title{ white-space:nowrap; font-size:inherit; }
 .brand .logo.night{ display:none; }
 :root[data-theme="night"] .brand .logo.day{ display:none; }
 :root[data-theme="night"] .brand .logo.night{ display:block; }
 /* THE MASTHEAD IS A NAME, so it takes the face the names are set in. */
 .title{ font-family:"Avenir","Avenir Book","Nunito Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
         font-size:21.3px; font-weight:700; color:var(--navy); margin:0; }
 .abstract{ color:var(--muted); font-size:12px; margin:0 0 16px; }

 /* NO CARD. A panel in this app puts its content straight on the panel and
    separates its sections with a heading over a hairline; it does not wrap
    each one in a filled box. The only box left on the page is the log's,
    because the Global System Log really does have one. */
 .card{ background:transparent; border:0; padding:0; margin-bottom:22px; }
 /* TABLE_HEADER_RULE: what marks a header as a header is its bold black text,
    not a heavier rule. 1 px, the same grey as hline(), 4 px of air under it. */
 .card h2{ display:flex; align-items:baseline; justify-content:space-between;
           gap:14px; font-family:"Avenir","Avenir Book","Nunito Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
           font-size:14px; font-weight:700; color:var(--ink); margin:0 0 10px;
           border-bottom:1px solid var(--rule); padding-bottom:4px; }
 /* What the section is ABOUT, right-aligned beside its name: a value, so it
    is the body face and the body ink, not the heading's. */
 .card h2 .what{ font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
                 font-size:12px; font-weight:400; color:var(--ink);
                 text-align:right; min-width:0; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
 /* ...and a note about the section, smaller and quieter still: the fridge's
    "Last sample 12 s ago", which turns the stale red on its own. */
 .card h2 .what.aside{ font-size:11px; color:var(--muted); }

 /* The rounded status pill, in the app's three tones. No numbers live in a
    pill: it says what is happening, and the figures go to the rows, the
    progress bar and the plot. */
 .pill{ display:inline-block; padding:4px 12px; border-radius:var(--radius);
        font-size:12px; font-weight:400; border:1px solid transparent; }
 .pill.blue{ background:var(--pill-blue-bg); border-color:var(--pill-blue-edge);
             color:var(--pill-blue-ink); }
 .pill.red{  background:var(--pill-red-bg);  border-color:var(--pill-red-edge);
             color:var(--pill-red-ink); }
 /* The main window's SafeTip notice (#safetipBadge): the badge red, a 3 px
    corner, 4 px by 12 px of padding, the body weight with the run in bold. */
 #safetip{ margin:6px 0 0; }
 .stnotice{ display:inline-block; padding:4px 12px; border-radius:3px;
            font-size:12px; font-weight:400; line-height:1.4;
            background:var(--pill-red-bg); border:1px solid var(--pill-red-edge);
            color:var(--pill-red-ink); }
 .pill.gold{ background:var(--pill-gold-bg); border-color:var(--pill-gold-edge);
             color:var(--pill-gold-ink); }

 /* min-width:0 and the wrap are what keep a long value (a file name like
    Poke-2026-09-22-19-13-55-00001.dat) from widening the row, pushing the
    whole page sideways and carrying every right-hand number off the screen. */
 .row{ display:flex; justify-content:space-between; gap:12px; padding:3px 0;
       align-items:baseline; max-width:520px; }
 .row span{ min-width:0; }
 .row .k{ color:var(--muted); white-space:nowrap; }
 .row .v{ font-variant-numeric:tabular-nums; text-align:right; overflow-wrap:anywhere; }
 /* The unit goes AFTER the value, in the app's unit grey, at full size. */
 .u{ color:var(--unit); }
 /* THE FRIDGE'S READINGS, the main window's Live Parameters: the name in
    the body weight, the number larger in the figure face with its unit after it on one
    baseline, and under it the state in the app's rounded pill (its 3 px
    corner, the body weight, as the main window's). The two gaps, name to number and
    number to pill, are one (12 px of empty space). Two to a row, as on the
    main window; the rest of the log's numbers stay rows under them. */
 .readings{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr));
            gap:18px 12px; margin:2px 0 14px; max-width:520px; }
 .reading .rn{ font-weight:400; line-height:16px; }
 .reading .rv{ margin-top:12px; line-height:15px; white-space:nowrap;
               font-variant-numeric:tabular-nums; }
 /* The app's figure face and weight (Widgets/live_parameters VALUE_*):
    Verdana Bold, which Windows and every iPhone carry, so the page and the
    main window draw the same face; number and unit in the reading's grey. */
 .reading .rnum{ font-family:Verdana, sans-serif;
                 font-size:20px; font-weight:700; color:var(--reading); }
 .reading .rnum sup{ font-size:12px; vertical-align:8px; line-height:0; }
 .reading .ru{ margin-left:5px; color:var(--reading); }
 .reading .pill{ margin-top:12px; font-weight:400; padding:0 7px; height:22px;
                 line-height:20px; box-sizing:border-box; }   /* the pill's own 3 px corner */

 /* THE SCAN MAP (2026-09-29): the Scan Navigator's Display Layers on the XY
    scanner map, drawn as the app draws them (see renderScanMap). */
 #scanmap .smhead{ display:flex; justify-content:flex-end; margin:0 0 6px; max-width:520px; }
 .smseg{ display:flex; background:var(--seg-track); border-radius:6px; padding:2px; }
 .smseg button{ border:0; background:transparent; font:inherit; font-size:11px; color:var(--muted);
                padding:3px 9px; border-radius:4px; cursor:pointer; }
 .smseg button.on{ background:var(--seg-pill); color:var(--ink); box-shadow:0 0 0 1px var(--seg-edge); }
 .smbox{ position:relative; max-width:520px; touch-action:none; overflow:hidden;
         user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
 .smbox .smlayer{ position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible;
                  pointer-events:none; }
 /* nothing inside the map answers a touch: the box takes every finger by its
    coordinates, and hit-testing hundreds of marks on every move was the
    drag's largest cost (6x slowed CPU: 5.7 ms a move) */
 #smplot{ position:absolute; overflow:hidden; pointer-events:none; }
 #smplot *{ pointer-events:none; }
 /* the layer a drag moves: a plain box, so every engine hands it to the GPU */
 #smplot .smmv{ position:absolute; will-change:transform; }
 #smplot .smmv svg{ display:block; width:100%; height:100%; }
 .smbox canvas.smstrip{ position:absolute; pointer-events:none; }
 .smbox .smgrid{ stroke:var(--rule); }
 .smbox .smedge{ stroke:var(--frame); fill:none; }
 .smbox .smtk{ fill:var(--muted); font-size:11px; }
 .smread{ position:absolute; background:var(--card); border:1px solid var(--border); border-radius:6px;
          padding:5px 9px; font-size:11px; box-shadow:0 2px 8px rgba(0,0,0,.12); white-space:nowrap;
          pointer-events:none; }
 .smread .m{ color:var(--muted); }
 .smread b{ font:400 14px Tahoma, Verdana, sans-serif; -webkit-text-stroke:.3px currentColor; }
 .smbar{ display:flex; align-items:center; gap:8px; margin:10px 0 18px; font-size:11px;
         color:var(--muted); max-width:520px; }
 .smbar .smgrad{ flex:1; height:12px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
 .smlist{ max-width:520px; }
 .smrow{ display:flex; align-items:center; gap:10px; min-height:52px; padding:0 10px 0 6px; }
 .smrow + .smrow{ border-top:1px solid var(--rule); }
 .smrow.sel{ background:var(--pill-blue-edge); }
 .smrow.off .smtxt, .smrow.off .smchips{ opacity:.45; }
 .smrow button{ border:0; background:transparent; width:34px; height:34px; display:flex;
                align-items:center; justify-content:center; padding:0; cursor:pointer; }
 .smrow button svg{ width:20px; height:20px; fill:var(--ink); }
 .smrow .smtop svg{ fill:var(--muted); }
 .smrow .smtop.first svg{ fill:var(--rule); }
 .smtxt{ flex:1; min-width:0; cursor:pointer; }
 .smname{ font-size:13px; }
 .smsub{ color:var(--muted); font-size:12px; }
 /* a title is one line: on a 360 px phone "Frame 2D · 09-26 20:06" broke
    between its date and its time. The bars give way first, the ellipsis is
    the last resort. */
 .smname, .smsub{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
 .smchips{ display:flex; align-items:center; gap:8px; }
 .smchips .cm{ width:54px; height:12px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
 .smchips .sq{ width:12px; height:12px; border:2px solid; box-sizing:border-box; }
 .smchips .sw{ width:54px; height:4px; border-radius:2px; }
 .smchips .pt{ width:11px; height:11px; }
 .smchips .psq{ width:14px; height:14px; border:2px solid; box-sizing:border-box; background:#fff;
                display:flex; align-items:center; justify-content:center; }
 .smchips .psq i{ width:4px; height:4px; border-radius:50%; }
 @media (max-width:380px){
   .smchips{ gap:6px; }
   .smchips .cm, .smchips .sw{ width:34px; }
 }

 /* PROGRESS_QSS, the panel's own: a 24 px track in GREY_100 on the field
    hairline with its caption centred INSIDE it, and the fill inset by 1 px so
    it never touches the border, rounded only at the end it starts from. */
 /* A LENGTH, not the width of whatever contains it. Edge to edge it read
    as a rule with a number on it, and on a desktop it was most of a metre of
    fill to say 53 %. */
 .bar{ max-width:340px; position:relative; height:24px; background:var(--bar-track);
       border:1px solid var(--border); border-radius:var(--radius);
       margin:8px 0 0; overflow:hidden; }
 /* THE FILL GLIDES, as style_fade's progress glide does in the panel: at one
    steady speed, over the time the last push took to follow the one before
    (--glide, set per push), so it creeps on between pushes instead of jumping
    once every few seconds. A first draw or a big jump takes PROGRESS_MS. */
 .bar .fill{ position:absolute; left:1px; top:1px; bottom:1px;
             background:var(--progress); border-radius:1px 0 0 1px;
             transition:width var(--glide, 220ms) var(--glide-ease, ease); }
 .bar.full .fill{ border-radius:1px; }
 .bar .cap{ position:absolute; inset:0; display:flex; align-items:center;
            justify-content:center; color:#333333; font-size:12px; }
 :root[data-theme="night"] .bar .cap{ color:#dadada; }

 canvas{ width:100%; display:block; }
 #plot{ height:180px; margin-top:10px; }

 /* One column per recorded channel, what _make_display_column builds: the
    channel's own header over the colour map over its line plot. PagedStrip
    shows three of them side by side with a 12 px gap and pages through the
    rest, and that is what a desktop gets here. A phone has room for one, so
    the same pager turns one column at a time. */
 #plots{ display:flex; gap:12px; align-items:flex-start; justify-content:center; }
 .chan{ flex:1 1 0; min-width:0; max-width:640px; margin-top:14px; }
 /* The map above a records table: as wide as it is tall (the canvas squares
    its own drawing area), centred, and not taller than a phone screen. */
 .chan.recmap{ flex:0 0 auto; width:100%; max-width:430px;
               align-self:center; }
 /* ColumnHeader: bold "Display channel N", then the name, then the unit a
    size down in the unit grey. Caption and name are both #333; only the
    caption is bold. 24 px tall, as the old channel picker was. */
 /* 30 px: the direction toggle's track is 30 tall, and the panel sizes the
    header row to it. At 24 the overflow clip cut 3 px off its top and bottom
    and took its rounded corners with them. */
 .chan .chead{ height:30px; display:flex; align-items:center;
               justify-content:center; gap:4px; font-size:12px;
               color:#333333; white-space:nowrap; overflow:hidden; }
 .chan .chead .cap{ font-weight:700; margin-right:8px; }
 .chan .chead .u{ font-size:10px; color:var(--unit); }
 /* direction_toggle: segmented_control(pad_h=8) -- a grey track with the
    selected segment as a pale pill in bold navy. A raster scan has no
    backward pass, and the panel greys the whole control out for one. */
 /* ui_style.direction_toggle == segmented_control(pad_h=8, reserve=16):
    a 3 px track margin, a 2 px gap between the segments ("a small gap so the
    selected pill reads as floating"), segments padded 4px 8px, and the pill
    carrying a soft drop shadow. The gap is why the pill is not simply half
    the track: without it the pill fills its half exactly and reads as a
    block rather than as something sitting on top. */
 /* MEASURED OFF THE PANEL (direction_toggle("Up", "Down") grabbed offscreen
    with main.py's stylesheet, 2026-09-23): track 101 x 30, a 3 px margin all
    round, 2 px between segments, each segment 24 px tall and as wide as its
    own BOLD label + 22 px (Up 38, Down 55; they are NOT equal halves). */
 .seg{ position:relative; display:inline-flex; gap:2px; padding:3px;
       background:var(--seg-track); border-radius:4px; margin-left:12px; }
 /* The pill is the ONLY box: it is laid over the selected segment by
    placeSegThumbs() from that segment's own geometry, which is what
    _seg_attach_thumb does. SEG_ANIM_MS with OutCubic. The shadow is the
    app's QGraphicsDropShadowEffect(blur 9, offset (0,1), rgba(0,30,70,60)). */
 .seg .thumb{ position:absolute; top:3px; bottom:3px; left:3px; width:0;
              box-sizing:border-box; border-radius:3px;
              background:var(--seg-pill); border:1px solid var(--seg-edge);
              box-shadow:0 1px 4.5px rgba(0,30,70,.235); }
 .seg.anim .thumb{ transition:left 170ms cubic-bezier(.215,.61,.355,1),
                              width 170ms cubic-bezier(.215,.61,.355,1); }
 /* A segment reserves the width of its label in BOLD (the hidden ::after),
    so it does not change width as the selection moves onto it. */
 .seg span[data-d]{ position:relative; display:inline-flex; flex-direction:column;
            align-items:center; justify-content:center; box-sizing:border-box;
            height:24px; padding:0 11px; color:#555555; font-size:12px;
            white-space:nowrap; cursor:pointer;
            transition:color 170ms cubic-bezier(.215,.61,.355,1); }
 .seg span[data-d]::after{ content:attr(data-w); font-weight:700; height:0;
                   overflow:hidden; visibility:hidden; }
 .seg span[data-d]:hover:not(.on){ background:#d8d8d8; border-radius:3px; }
 .seg span[data-d].on{ color:var(--navy); font-weight:700; }
 :root[data-theme="night"] .seg span[data-d]{ color:var(--muted); }
 :root[data-theme="night"] .seg span[data-d].on{ color:var(--navy); }
 :root[data-theme="night"] .seg span[data-d]:hover:not(.on){ background:var(--hover); }
 .seg.off{ background:var(--seg-off-track); }
 /* Disabled: no shadow, because a greyed control should not look like it
    is popping off the track (ui_style._shadow does the same). */
 .seg.off .thumb{ background:var(--seg-off-pill); border-color:var(--seg-off-edge);
                  box-shadow:none; }
 .seg.off span[data-d], .seg.off span[data-d].on{ color:var(--seg-off-ink);
                              background:none; cursor:default; }
 .seg.off span[data-d].on{ font-weight:400; }
 :root[data-theme="night"] .seg.off span[data-d]{ color:var(--seg-off-ink); }
 :root[data-theme="night"] .chan .chead{ color:#dadada; }
 /* An empty slot on the last page: the columns keep their width instead of
    stretching to fill it, which is what PagedStrip's fixed pitch does. */
 .chan.empty{ visibility:hidden; }
 /* The history selector: "Slow" and "Fast", each with its drop-down,
    centred, one row above all the columns, since every column shows the
    frame it picks. */
 .fpick{ display:flex; justify-content:center; align-items:center; gap:6px;
         margin:14px 0 0; font-size:12px; color:var(--ink); }
 .fpick select:first-of-type{ margin-right:8px; }
 .fpick select{ min-width:110px; height:24px; font-size:12px; }

 /* RecordTable: no fill anywhere, because it is meant to sit on the panel.
    A hairline under the header in the field border grey, captions bold in
    #444444 with the second line in the unit grey when it is a unit, and every
    value centred. No rule between rows and no grid at all. */
 .rec{ width:100%; border-collapse:collapse; font-size:12px; }
 .rec th{ font-weight:700; color:#444444; padding:3px 6px 5px;
          border-bottom:1px solid var(--border); vertical-align:bottom;
          white-space:pre; line-height:1.25; }
 /* BOTH LINES BOLD. A unit in brackets keeps the muted ink the app writes
    units in, but not a lighter weight: in a heading row where everything
    else is bold, one thin line under a bold one reads as a mistake
    (record_table.py sets bold for both and changes only the pen). */
 .rec th .u{ font-weight:700; color:var(--unit); }
 .rec td{ padding:0 6px; height:28px; color:var(--ink); text-align:center;
          white-space:pre; line-height:1.25; }
 .rec td.two{ height:42px; }
 :root[data-theme="night"] .rec th{ color:#dadada; }
 /* POKE ON PATH: the map with its bar and ETA on the left, the records
    beside it, as the panel lays them out; stacked on a narrow screen. */
 /* The map takes the larger share (the user, 2026-09-23: "the map can be
    bigger", twice): it grows three to the records' one, up to 1000 px. */
 .popmap{ flex:3 1 640px; min-width:0; max-width:1000px; margin-top:14px; }
 .poprec{ flex:1 1 400px; min-width:0; margin-left:24px; }
 @media (max-width: 860px){ .poprec{ margin-left:0; } }
 .pophead{ display:flex; align-items:center; gap:10px; font-size:12px; }
 /* The map is handled, not scrolled past: the page does not scroll or zoom
    under a finger on it. */
 /* The map draws no title, so the band MARG.t keeps for one is taken back:
    the frame sits just under the progress bar (the user, 2026-09-23). */
 .popmap canvas.map{ touch-action:none; cursor:grab; margin-top:-18px; }
 .popmap .popbar{ margin-bottom:0; }
 .popmap canvas.map:active{ cursor:grabbing; }
 /* the panel's fit button: a 22 px icon button in the tool grey */
 .popfit{ margin-left:auto; width:22px; height:22px; padding:0; border:0;
          background:transparent; border-radius:var(--radius); cursor:pointer;
          display:flex; align-items:center; justify-content:center; }
 .popfit:hover{ background:var(--tb-hover); }
 .popfit svg{ width:16px; height:16px; fill:none; stroke:var(--tool);
              stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
 .poptitle{ font-weight:700; color:var(--ink); }
 .popbar{ display:flex; align-items:center; gap:10px; margin:10px 0 4px 56px; }
 .popbar .bar{ width:130px; margin:0; }
 .popbar .eta{ color:#555555; font-size:12px; }
 :root[data-theme="night"] .popbar .eta{ color:var(--muted); }
 .rec tr.runrow td{ background:var(--pill-blue-bg); color:var(--pill-blue-ink); }
 .rec tr.runrow td:first-child{ border-radius:6px 0 0 6px; }
 .rec tr.runrow td:last-child{ border-radius:0 6px 6px 0; }
 .rec svg.chev{ width:12px; height:12px; fill:none; stroke:var(--pill-blue-ink);
                stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; }
 /* THE APPROACH PANEL: two sections side by side, stacked when narrow. */
 .asec{ flex:1 1 440px; min-width:0; margin-top:14px; }
 .asec + .asec{ margin-left:28px; }
 @media (max-width: 960px){ .asec + .asec{ margin-left:0; } }
 .ahead{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
 .atitle{ display:inline-flex; align-items:center; gap:6px; font-weight:700;
          font-size:14px; color:var(--navy); }
 .atitle svg.tri{ width:9px; height:9px; fill:var(--navy); }
 /* the section's state pill (_state_pill_qss: a 3 px corner, 4 by 12 padding) */
 .apill{ display:inline-block; padding:4px 12px; border-radius:3px; font-size:12px;
         border:1px solid var(--pill-blue-edge); background:var(--pill-blue-bg);
         color:var(--pill-blue-ink); min-width:90px; text-align:center; }
 .amode{ display:inline-flex; align-items:center; gap:8px; margin-left:auto; font-size:12px; }
 .amode .seg{ margin-left:0; }
 .seg.ro span[data-d]{ cursor:default; }
 .seg.ro span[data-d]:hover:not(.on){ background:none; }
 /* the lamps in two columns, as the panel sets them */
 .aleds{ display:grid; grid-template-columns:repeat(2, max-content); gap:8px 40px;
         font-size:12px; margin:0 0 6px 4px; }
 .aleds .grp{ display:flex; align-items:center; gap:8px; }
 @media (max-width: 360px){ .aleds{ gap:8px 20px; } }
 .ascroll{ max-height:460px; overflow-y:auto; }
 /* the heading stays over the rows while the list is scrolled to its end */
 .ascroll thead th{ position:sticky; top:0; z-index:1; background:var(--ground); }
 .rec tr.here td{ background:var(--hover); }
 .apxy canvas.xymap{ width:100%; display:block; touch-action:none; cursor:grab; }
 .apxy .popbar{ margin-left:56px; }
 .reccap{ font-weight:700; font-size:12px; color:var(--ink); margin:14px 0 6px; }

 /* The .dat header. Its sections are the panel's tabs, so they are captioned
    the way a table's column headers are: bold black over a 1 px rule. */
 #cfg{ margin-top:14px; }
 /* Each section of the header is a chevron you can open, the way the
    panel's own reveal blocks are: shut by default so the page stays short,
    and the chevron turns as it opens. */
 /* No underline: the chevron already says it opens, and a rule under each
    of six configuration sections is six more lines down the page. */
 .seclist .sec{ display:flex; align-items:center; gap:6px; cursor:pointer;
            font-weight:700; color:var(--ink); font-size:12px;
            padding-bottom:4px;
            margin:12px 0 0; user-select:none; }
 .seclist .sec:hover{ color:var(--navy); }
 .seclist .sec svg{ width:12px; height:12px; flex:0 0 12px;
                transition:transform var(--t-sec) var(--ease-cubic); }   /* in step with the blind */
 .seclist .sec svg path{ fill:none; stroke:var(--tool); stroke-width:2.8;
                     stroke-linecap:round; stroke-linejoin:round; }
 .seclist .sec.open svg{ transform:rotate(90deg); }
 /* OPENING IS A ROLLER BLIND, as the app's config sections open
    (UI_data_browser._animate_collapse: 150 ms, InOutCubic; _RollBox): the
    rows keep their places and the box uncovers them top-down, rather than
    the section appearing in one frame and shoving the page down. The grid
    row is what animates, because a height of "auto" cannot be. */
 .seclist .body{ display:grid; grid-template-rows:1fr;
                 transition:grid-template-rows var(--t-sec) var(--ease-cubic),
                            visibility 0s linear 0s; }
 .seclist .body > .in{ overflow:hidden; min-height:0; }
 .seclist .body.shut{ grid-template-rows:0fr; visibility:hidden;
                      transition:grid-template-rows var(--t-sec) var(--ease-cubic),
                                 visibility 0s linear var(--t-sec); }
 .seclist .row{ max-width:520px; }

 /* AN ENTRY'S HEADING: what was run, and when, on one line. The time is a
    value, so it takes the body's grey rather than the heading's ink. */
 /* An entry's own rule is dropped too: the list is a dozen of them, and
    the heading above it already says where the list starts. */
 #xlog .sec{ border-bottom:0; margin:8px 0 0; padding-bottom:0; }
 #xlog .sec .when{ margin-left:auto; font-weight:400; color:var(--muted); }
 #xlog .sec .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
 #xlog .secs{ margin:6px 0 2px; font-size:12px; color:var(--muted);
              max-width:520px; }
 #xlog .foot{ margin-top:14px; font-size:12px; color:var(--muted); }

 /* ONE ROW PER INSTRUMENT: the app's lamp, its name, and what the log last
    said about it. Same 12 px lamp as the run's own row of them. */
 /* Twelve instruments used to mean twelve rules. */
 #insts .irow{ display:flex; align-items:center; gap:9px; max-width:520px;
               padding:4px 0; }
 #insts .nm{ flex:1 1 auto; font-size:12px; overflow:hidden;
             text-overflow:ellipsis; white-space:nowrap; }
 #insts .st{ flex:0 0 auto; font-size:12px; color:var(--muted); }
 #insts .foot{ margin-top:12px; font-size:12px; color:var(--muted); }

 /* THE LAST 24 HOURS: the instruments' rows with a time in front, newest
    first, under a caption per day. The name wraps rather than cuts: an
    error's text is the whole point of the row. */
 #events .evday{ font-size:12px; font-weight:600; color:var(--ink); margin:14px 0 4px; }
 #events .evday:first-child{ margin-top:2px; }
 #events .erow{ display:flex; align-items:flex-start; gap:9px; max-width:560px;
                padding:4px 0; }
 #events .t{ flex:0 0 auto; width:5ch; font-size:12px; color:var(--muted);
             font-variant-numeric:tabular-nums; padding-top:1px; }
 #events .led{ flex:0 0 12px; margin-top:2px; }
 #events .ev{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px; }
 #events .nm{ font-size:12px; color:var(--ink); overflow-wrap:anywhere; }
 #events .n{ color:var(--muted); }
 #events .dt{ font-size:11.5px; color:var(--muted); overflow-wrap:anywhere; }
 #events .evnone{ font-size:12px; color:var(--muted); }
 /* the day's one lamp on the front panel, in line with its words */
 .modread .evlamp{ display:inline-block; vertical-align:-1px; margin-right:6px; }

 /* THE PRESSURE TRENDS, under the fridge's rows: the app's pump panel's
    three plots, one per gauge, side by side where there is room and a page
    turn apart where there is not (a phone shows one at a time). */
 /* (How many columns is renderTrends' to say: as many as fit, the rest on
    further pages, the Experiment pager's rule.) */
 #trends{ display:grid; grid-template-columns:repeat(3, minmax(0, 1fr));
          gap:14px 16px; margin-top:14px; position:relative; }
 /* A PAGE TURN (slideTurn): the page being left, copied into a layer over
    the grid, and the two pages clipped to the box while they travel. */
 #trends.sliding{ overflow:hidden; overflow:clip; }
 #plots.sliding{ position:relative; overflow:hidden; overflow:clip; }
 .tghost{ position:absolute; inset:0; display:grid; gap:inherit; z-index:1;
          pointer-events:none; }
 .trend{ position:relative; min-width:0; }
 .trend canvas{ width:100%; display:block; }
 /* The plot's own tools, standing on its frame line at the right, as the
    panel's: the whole record, or the last five minutes. One choice, so they
    are the app's checkable icon buttons (BTN_ICON_TOGGLE_QSS), 22 px with a
    15 px glyph in the tool ink. */
 .trend .tools{ position:absolute; top:4px; right:12px; display:flex; gap:2px; }
 .trend .tools button{ width:22px; height:22px; padding:0; border:0; cursor:pointer;
                       background:transparent; border-radius:3px; display:flex;
                       align-items:center; justify-content:center; }
 .trend .tools button:hover{ background:var(--tb-hover); }
 .trend .tools button.on{ background:var(--tb-on); }
 .trend .tools button.on:hover{ background:var(--tb-on-hover); }
 .trend .tools svg{ width:15px; height:15px; }
 .trend .tools svg .f{ fill:var(--tool); }
 .trend .tools svg .s{ fill:none; stroke:var(--tool); stroke-width:2;
                       stroke-linecap:round; stroke-linejoin:round; }
 /* SAVE OR SHARE (savePlot): the tool row's own 22 px button and 15 px
    glyph in the tool ink, beside a trend's two tools, at the end of a map's
    title row, and on the frame line of a sweep column's first plot. */
 .plotsave{ width:22px; height:22px; flex:0 0 22px; padding:0; border:0; cursor:pointer;
            background:transparent; border-radius:3px; display:flex; align-items:center;
            justify-content:center; transition:background-color 250ms ease; }
 .plotsave:hover{ background:var(--tb-hover); }
 .plotsave:active{ background:var(--tb-on); transition-duration:40ms; }
 .plotsave svg{ width:15px; height:15px; }
 .plotsave svg .s{ fill:none; stroke:var(--tool); stroke-width:2;
                   stroke-linecap:round; stroke-linejoin:round; }
 .trend .tools .plotsave{ margin-left:6px; }
 /* in a sweep column it closes the header row (the plot's own top right is
    the colour bar's top value); the header keeps a button's width free on
    BOTH sides, so what it says stays centred and never runs under it */
 .chan{ position:relative; }
 .chan > .plotsave{ position:absolute; top:4px; right:0; }
 .chan .chead{ padding:0 26px; }
 .pophead .plotsave{ margin-left:2px; }
 /* The lamps on the front panel's row, packed tight. */
 .modrow .lamps{ display:inline-flex; gap:3px; margin-right:8px;
                 vertical-align:-1px; }
 .modrow .lamps .led{ width:9px; height:9px; border-radius:5px; flex:0 0 9px;
   background:radial-gradient(circle 7.2px at 30% 30%, var(--led-a) 0%, var(--led-b) 50%,
                              var(--led-c) 100%); }

 /* THE LED ROW, as the panel builds it: a 12 px circle with the app's radial
    gradient and a 1 px rim of its own dark stop, SPACE_SM to its caption and
    SPACE_MD between groups, the lot against the right edge (the user,
    2026-09-23: every LED row right-aligned). */
 .leds{ display:flex; justify-content:flex-end; align-items:center;
        gap:8px; margin:2px 0 10px; flex-wrap:wrap; }
 .leds .grp{ display:flex; align-items:center; gap:8px; margin-right:4px; }
 .leds .grp + .grp{ margin-left:12px; }
 .leds .grp:last-child{ margin-right:0; }   /* flush with the right edge */
 /* THE LAMP'S THREE STOPS ARE REGISTERED COLOURS, so a change of state can
    FADE, as Widgets/led_transition.py fades the app's: lighting up is quick
    and front-loaded (LED_ON_MS 60, OutQuad), going dark lingers (LED_OFF_MS
    300, ease-in-and-out). A gradient itself cannot be transitioned; the
    colours it is drawn from can. The rim is the dark stop, as in led_qss. */
 @property --led-a{ syntax:"<color>"; inherits:false; initial-value:#e0e0e0; }
 @property --led-b{ syntax:"<color>"; inherits:false; initial-value:#888888; }
 @property --led-c{ syntax:"<color>"; inherits:false; initial-value:#333333; }
 .led{ width:12px; height:12px; border-radius:6px; display:inline-block;
       flex:0 0 12px; border:1px solid var(--led-c);
       /* led_qss: qradialgradient(cx 0.3, cy 0.3, radius 0.8) of the lamp */
       background:radial-gradient(circle 9.6px at 30% 30%, var(--led-a) 0%, var(--led-b) 50%,
                                  var(--led-c) 100%);
       transition:--led-a 300ms var(--ease-io),
                  --led-b 300ms var(--ease-io),
                  --led-c 300ms var(--ease-io); }
 .led.on, .led.error, .led.connecting{ transition-duration:60ms;
       transition-timing-function:cubic-bezier(.25,.46,.45,.94); }
 .led.on{ --led-a:#93d567; --led-b:#2D5016; --led-c:#1d340e; }
 .led.error{ --led-a:#ff3d6e; --led-b:#800020; --led-c:#420011; }
 .led.connecting{ --led-a:#ecc150; --led-b:#D4A017; --led-c:#3c2d06; }
 .led.off{ --led-a:#e0e0e0; --led-b:#888888; --led-c:#333333; }

 /* BY NIGHT THE LAMPS GET THEIR OWN PALETTE, ui_style._LED_COLORS_NIGHT.
    The day jewels read as lit only because the paper around them is bright;
    on a dark ground the same lamp looks unlit. Same hues, brighter middle
    stop, and a rim lifted off black so the lamp keeps its outline. */
 :root[data-theme="night"] .led.on{ --led-a:#b4f08c; --led-b:#4cbf5a; --led-c:#256b2b; }
 :root[data-theme="night"] .led.error{ --led-a:#ff7d9c; --led-b:#e83a5b; --led-c:#6e1330; }
 :root[data-theme="night"] .led.connecting{ --led-a:#ffe08e; --led-b:#f2b62b; --led-c:#6b500b; }
 :root[data-theme="night"] .led.off{ --led-a:#a3a3a3; --led-b:#646464; --led-c:#4e4e4e; }

 /* The pager, as PagedStrip builds it: a 22 px icon button either side of
    "n / m" in #333333, 2 px apart, and the whole row gone when there is only
    one page. */
 .pager{ display:flex; align-items:center; justify-content:center; gap:2px;
         margin-top:10px; }
 .pager button{ width:22px; height:22px; padding:0; border:none; cursor:pointer;
                background:transparent; border-radius:var(--radius);
                display:flex; align-items:center; justify-content:center; }
 .pager button:hover:not(:disabled){ background:var(--tb-hover); }
 .pager button:disabled{ cursor:default; }
 .pager svg{ width:16px; height:16px; }
 .pager svg path{ fill:none; stroke:var(--tool); stroke-width:2.8;
                  stroke-linecap:round; stroke-linejoin:round; }
 .pager button:disabled svg path{ stroke:var(--tool-off); }
 .pager .n{ color:var(--pager-ink); min-width:38px; text-align:center; }

 select{ font:inherit; font-size:13px; height:26px; padding:2px 4px; color:var(--ink);
         border:1px solid var(--border); border-radius:var(--radius);
         background:var(--card); max-width:100%; }

/* The Global System Log is its own box: #f9f9f9 on a 1 px #cfcfcf hairline,
   3 px corners, 4 px of padding, Cascadia Mono. NO RULE BETWEEN LINES: the
   app draws none, and a log with a rule per line reads as a table. A wrapped
   line hangs under the TAG, never under the time, which is what the block's
   left margin and negative indent do in the app. */
 /* overflow-anchor off: the page keeps the lines in place itself when the
    oldest go off the top (renderLog), and a browser that also anchors would
    move them twice. */
 .log{ font:12px/1.45 "Cascadia Mono",Consolas,ui-monospace,monospace;
       background:var(--log-bg); border:1px solid var(--log-edge);
       border-radius:var(--radius); padding:4px; color:var(--log-ink);
       max-height:360px; overflow-y:auto; overflow-anchor:none; }
 /* The log's heading has no hairline under it: the box is the separation
    (the user, 2026-09-23). */
 #m-log h2{ border-bottom:0; padding-bottom:0; }
 .log div{ padding:0; padding-left:10ch; text-indent:-10ch;
           overflow-wrap:break-word; }
 /* text-indent is INHERITED, and an inline-block starts a formatting
    context of its own, so the parent's -9ch hanging indent was applied
    again inside this box and pushed the time out of it: the column
    reserved its width and drew nothing. */
 .log .t{ color:var(--log-time); display:inline-block; width:10ch;
          text-indent:0; }
 /* the source tag is navy on EVERY line, including a warning or an error */
 .log .g{ color:var(--log-tag); }
 .log .error{ color:var(--log-err); } .log .warning{ color:var(--log-warn); }
 .stale{ color:var(--pill-red-ink); font-weight:600; }
 .when{ color:var(--muted); font-size:12px; }
 /* HOW OLD WHAT YOU ARE LOOKING AT IS, beside the state pill and never in
    it (a pill carries no numbers). It counts on by itself between pushes,
    and turns the pill's gold when the lab PC is later than its own rhythm
    allows: a stale reading that looks live is the dangerous failure. */
 #head{ display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; }
 .fresh{ color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
 .fresh.late{ color:var(--pill-gold-ink); font-weight:600; }
 .fresh .stale{ font-weight:600; }

 /* The app's scrollbars appear when the pointer is in the area and fade out
    again (Widgets/scrollbar_autohide.py). A phone already does this; a desktop
    browser does not, and a permanent grey bar down the side is the one piece
    of chrome that would not belong to this app. */
 ::-webkit-scrollbar{ width:10px; height:10px; }
 ::-webkit-scrollbar-thumb{ background:transparent; border-radius:5px;
                            border:2px solid transparent; background-clip:content-box; }
 body:hover::-webkit-scrollbar-thumb{ background:rgba(128,128,128,.45);
                                      background-clip:content-box; }
 ::-webkit-scrollbar-track{ background:transparent; }

 /* the lock: the same card, the same field, the app's primary button */
 /* 13vh, not 10: the block used to open with the name and the icon above
    the form, and losing them moved the field up by about their height. The
    field stays where it was. */
 /* THE SIGN-IN: one card in the middle of the screen, NetID over the
    passphrase, the app's navy for the one button (the user, 2026-09-23:
    "more modern"). Nothing on it names the lab. */
 #lock{ max-width:380px; margin:11vh auto 0; padding:0 4px; }
 .lockcard{ background:var(--card); border:1px solid var(--border); border-radius:14px;
            padding:30px 28px 22px; box-shadow:0 10px 30px rgba(0,30,70,.08); }
 .lockmark{ width:46px; height:46px; border-radius:50%; margin:0 auto 14px;
            display:flex; align-items:center; justify-content:center;
            background:var(--pill-blue-bg); border:1px solid var(--pill-blue-edge); }
 .lockmark svg{ width:22px; height:22px; fill:var(--navy-fill); }
 .locktitle{ margin:0; text-align:center; font-size:20px; font-weight:600; color:var(--ink); }
 .locksub{ text-align:center; font-size:12px; color:var(--muted); margin:4px 0 22px; }
 #lock .fld{ display:block; margin-bottom:14px; }
 #lock .fld > span{ display:block; font-size:12px; font-weight:600; color:var(--ink);
                    margin:0 0 6px 1px; }
 #lock input[type=text], #lock input[type=password]{
      width:100%; height:40px; font:inherit; font-size:16px; padding:0 12px; box-sizing:border-box;
      color:var(--ink); background:var(--ground); border:1px solid var(--border);
      border-radius:8px; transition:border-color 120ms ease, box-shadow 120ms ease; }
 #lock input:focus{ outline:none; border-color:var(--navy-fill);
                    box-shadow:0 0 0 3px rgba(0,51,102,.12); }
 #lock .pw{ position:relative; display:block; }
 #lock .pw input{ padding-right:42px; }
 #peek{ position:absolute; right:4px; top:4px; width:32px; height:32px; border:0;
        background:none; border-radius:6px; cursor:pointer; display:flex;
        align-items:center; justify-content:center; }
 #peek:hover{ background:var(--tb-hover); }
 #peek svg{ width:18px; height:18px; fill:var(--muted); }
 #peek.on svg{ fill:var(--navy-fill); }
 #lock .rem{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);
             margin:2px 0 18px; cursor:pointer; }
 /* the app's navy, not the browser's own blue, for the one tick on the card */
 #lock .rem input{ accent-color:var(--navy-fill); margin:0; }
 #go{ width:100%; height:42px; font:inherit; font-size:14px; font-weight:600; cursor:pointer;
      color:#ffffff; background:var(--navy-fill); border:1px solid var(--navy-fill);
      border-radius:8px; transition:background 120ms ease; }
 #go:hover{ background:var(--navy-hover); border-color:var(--navy-hover); }
 #go:disabled{ opacity:.7; cursor:default; }
 #lockmsg{ min-height:18px; font-size:12px; margin-top:12px; text-align:center;
           color:var(--muted); }
 .locknote{ font-size:11.5px; color:var(--muted); text-align:center; line-height:1.5;
            margin:16px 10px 0; }
 .linkish{ background:none; border:none; padding:0; font:inherit; font-size:12px;
           color:var(--muted); text-decoration:underline; cursor:pointer; }
 .hidden{ display:none !important; }
 /* Opening by itself (the head script): no card, and only if it is slow a
    quiet word where the card would be. */
 :root[data-auto] #lock{ visibility:hidden; }
 :root[data-auto] body::after{ content:"Opening\2026"; position:fixed; left:0; right:0;
       top:38vh; text-align:center; color:var(--muted); font-size:12px; opacity:0;
       animation:rv-late-word 200ms ease 700ms forwards; pointer-events:none; }
 @keyframes rv-late-word{ to{ opacity:1; } }

 /* ── MOTION ───────────────────────────────────────────────────────────────
    ONE SET OF SPEEDS AND CURVES for everything that moves (2026-09-28, the
    user: the web's animations were far too stiff). Filmed frame by frame the
    stiffness was three things: a change of view went through a blank frame
    (the old view vanished at once and the new one faded up from nothing), a
    plot redrawn at the reader's request was simply replaced in one frame, and
    nearly every animation had its own duration and curve. The two big
    movements are now the app's own, number for number. A change of view is
    its tab change (tab_transition): the new view is all there at once, under
    a picture of the old one that dissolves over it in 150 ms on OutQuad, the
    two drifting 8 px the way the reader went. A page of plots is its
    PagedStrip: both pages side by side, sliding one page width in 260 ms on
    the material standard curve, no fade. A state change moves colour only
    (style_fade). Every timing comes from here. */
 :root{
   --t-quick:120ms;       /* a colour answering the pointer                  */
   --t-state:200ms;       /* a state changing colour (style_fade COLOR_MS)    */
   --t-dissolve:150ms;    /* a view dissolving (tab_transition TRANSITION_MS) */
   --t-view:260ms;        /* something arriving by itself (the sign-in card)  */
   --t-page:260ms;        /* a page of plots (PagedStrip PAGE_MS)             */
   --t-sec:150ms;         /* a section's roller blind (_animate_collapse)     */
   --ease-cubic:cubic-bezier(.645,.045,.355,1); /* its InOutCubic            */
   --t-redraw:200ms;      /* a plot redrawn because the reader asked          */
   --travel:8px;          /* a view's drift (tab_transition NUDGE_PX)         */
   --page-gap:12px;       /* between two pages of plots (#plots' own gap)     */
   --ease:cubic-bezier(.2,.7,.2,1);           /* arriving: quick, then settling  */
   --ease-quad:cubic-bezier(.25,.46,.45,.94); /* DissolveOverlay's OutQuad      */
   --ease-io:cubic-bezier(.4,0,.2,1);         /* ui_style.travel_curve          */
   --t-tab:var(--t-dissolve);                 /* the fallback arrival (arrive()) */
 }

 /* VIEW TRANSITIONS (change()): the browser holds a picture of the page as it
    was, lays out the new one, and the two are animated into each other.
    Only the region that moves is named, and only while it moves. */
 @media (prefers-reduced-motion: no-preference){
   /* (#views holds the footer too: a footer of its own flew down past the
      bottom edge in the first frames.) */
   :root[data-vt="forward"] #views, :root[data-vt="back"] #views{ view-transition-name:views; }
   :root[data-vt="page-next"] #plots, :root[data-vt="page-prev"] #plots{ view-transition-name:plots; }
   /* (The fridge's trends turn without one: slideTurn.) */
   /* What is not named (the header) is the same on both sides and holds
      still through the browser's own dissolve. */
   ::view-transition-old(root), ::view-transition-new(root){
     animation-duration:var(--t-state); animation-timing-function:ease; }

   /* A CHANGE OF VIEW, the app's tab change. The old view is a picture ON
      TOP, on the page's own ground so that nothing of the new view shows
      through it yet, and it dissolves while the new view, already all there
      underneath, drifts the last 8 px into place. Forward drifts left and
      back drifts right, the way the chevron on the back line points. The
      first version did it the other way round (the old view let go and the
      new one faded up through it) and filmed, the new view was still at
      half strength under the old at 90 ms: the tap looked like it had landed
      late. The region takes its new size at once, so neither picture is
      stretched, and the old picture is at least as tall as the new view, so
      a longer page does not show below it before it has gone. Its ground
      also reaches 16 px (the page's gutter) past the view on every side:
      the new view starts 8 px over and its right-hand column (every value
      on a module page is right-aligned) stood out past the old picture from
      the first frame, and the wash on a row the reader came back to reaches
      6 px above the list. Clipping the region instead cut that wash's sides
      off until the end, and top to bottom it cut a long module page off at
      the height of the short list in the very first frame. */
   ::view-transition-group(views){ animation:none; }
   ::view-transition-old(views), ::view-transition-new(views){ mix-blend-mode:normal; }
   ::view-transition-old(views){ z-index:1; background:var(--ground);
       box-shadow:0 0 0 16px var(--ground);
       min-block-size:100%; object-fit:none; object-position:left top; }
   :root[data-vt="forward"]::view-transition-old(views){
     animation:rv-drift-out-left var(--t-dissolve) var(--ease-quad) both; }
   :root[data-vt="forward"]::view-transition-new(views){
     animation:rv-drift-in-left var(--t-dissolve) var(--ease-quad) both; }
   :root[data-vt="back"]::view-transition-old(views){
     animation:rv-drift-out-right var(--t-dissolve) var(--ease-quad) both; }
   :root[data-vt="back"]::view-transition-new(views){
     animation:rv-drift-in-right var(--t-dissolve) var(--ease-quad) both; }
   /* ...and scrolled down the page, the same dissolve over the whole window
      without the drift (the view's picture would start from where the
      scrolled page had it, not from where the new view begins). */
   :root[data-vt="fade"]::view-transition-old(root){ z-index:1; mix-blend-mode:normal;
     animation:rv-leave var(--t-dissolve) var(--ease-quad) both; }
   :root[data-vt="fade"]::view-transition-new(root){ mix-blend-mode:normal; animation:none; }

   /* A PAGE OF PLOTS, the app's PagedStrip: the two pages a page width and
      a gap apart, travelling together, clipped to the strip. Nothing fades:
      the first version faded the old page out as the new one faded in, and
      the middle of the turn was two half-strength pages over each other. */
   ::view-transition-group(plots){ overflow:clip;
       animation-duration:var(--t-page); animation-timing-function:var(--ease-io); }
   ::view-transition-old(plots), ::view-transition-new(plots){ mix-blend-mode:normal; }
   :root[data-vt="page-next"]::view-transition-old(plots){
     animation:rv-page-out-left var(--t-page) var(--ease-io) both; }
   :root[data-vt="page-next"]::view-transition-new(plots){
     animation:rv-page-in-left var(--t-page) var(--ease-io) both; }
   :root[data-vt="page-prev"]::view-transition-old(plots){
     animation:rv-page-out-right var(--t-page) var(--ease-io) both; }
   :root[data-vt="page-prev"]::view-transition-new(plots){
     animation:rv-page-in-right var(--t-page) var(--ease-io) both; }

   /* SIGNING IN: the card is a picture on top and dissolves (the app's
      plain DissolveOverlay, the one a panel locking uses) over the page,
      which is already there, drawn, underneath. */
   :root[data-vt="unlock"]::view-transition-old(root){ z-index:1; mix-blend-mode:normal;
     animation:rv-leave var(--t-state) var(--ease-quad) both; }
   :root[data-vt="unlock"]::view-transition-new(root){ mix-blend-mode:normal; animation:none; }
   /* the theme: one straight dissolve over 260 ms, the old half at full
      strength so a dark page and a light one do not add up to glare */
   :root[data-vt="theme"]::view-transition-old(root),
   :root[data-vt="theme"]::view-transition-new(root){ animation-duration:260ms; }
   /* the new theme lies whole underneath and the old one dissolves off it,
      as "fade" does: two half-strength pictures over the bare canvas went
      through a grey frame where the text vanished, and the new picture on
      top carries no ground of its own (it filmed white) */
   :root[data-vt="theme"]::view-transition-old(root){ z-index:1; mix-blend-mode:normal;
     animation:rv-leave 260ms var(--ease-quad) both; }
   :root[data-vt="theme"]::view-transition-new(root){ mix-blend-mode:normal; animation:none; }
 }
 @keyframes rv-leave{ to{ opacity:0; } }
 @keyframes rv-fade-in{ from{ opacity:0; } }
 @keyframes rv-arrive-up{ from{ opacity:0; transform:translateY(var(--travel)); } }
 @keyframes rv-drift-out-left{ to{ opacity:0; transform:translateX(calc(var(--travel) * -1)); } }
 @keyframes rv-drift-in-left{ from{ transform:translateX(var(--travel)); } }
 @keyframes rv-drift-out-right{ to{ opacity:0; transform:translateX(var(--travel)); } }
 @keyframes rv-drift-in-right{ from{ transform:translateX(calc(var(--travel) * -1)); } }
 @keyframes rv-page-out-left{ to{ transform:translateX(calc(-100% - var(--page-gap))); } }
 @keyframes rv-page-in-left{ from{ transform:translateX(calc(100% + var(--page-gap))); } }
 @keyframes rv-page-out-right{ to{ transform:translateX(calc(100% + var(--page-gap))); } }
 @keyframes rv-page-in-right{ from{ transform:translateX(calc(-100% - var(--page-gap))); } }

 /* COLOUR ANSWERS, NEVER SNAPS: text that changes colour under the pointer
    or with a state (a pill going red, the age going gold) fades as the app's
    styles do. */
 .modname, .seclist .sec, #backbar, .linkish{ transition:color var(--t-quick) var(--ease-io); }
 #backbar svg{ transition:stroke var(--t-quick) var(--ease-io); }
 .pill, .apill, .stnotice{ transition:background-color var(--t-state) var(--ease-io),
                           border-color var(--t-state) var(--ease-io), color var(--t-state) var(--ease-io); }
 .fresh{ transition:color var(--t-state) var(--ease-io); }
 /* the sign-in card comes up once, when the page opens; what it has to say
    (signing in, a wrong passphrase) fades in rather than appearing. The note
    under the card does NOT fade: the browser holds back input until the page
    has painted something visible, and with everything starting transparent a
    tap in the first quarter second went nowhere (measured offscreen). */
 .lockcard{ animation:rv-arrive-up var(--t-view) var(--ease) both; }
 #lockmsg > span{ display:inline-block; animation:rv-fade-in var(--t-state) ease both; }

 /* Somebody who has asked their system for less movement gets none. */
 @media (prefers-reduced-motion: reduce){
   *, *::before, *::after{ transition-duration:.01ms !important;
                           animation-duration:.01ms !important; }
 }

 /* THE GREETING LINE: who this is, and the two things that belong to them
    rather than to the fridge. */
 .userbar{ display:flex; align-items:center; justify-content:space-between;
           gap:12px; margin:0 0 20px; }
 /* Not bold: it is a greeting, not a heading. */
 /* The body's face and the body's size: it is a line of text, not a title. */
 .welcome{ font-weight:400; color:var(--ink);
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
 .userbar .right{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }

 /* ui_style.segmented_control: a grey track with a pale pill floating on it.
    The pill is a real element that slides, because that is what the app's
    does (SEG_ANIM_MS 170, OutCubic). */
 /* Addressed by id, not by class: `.seg` is the Fwd / Bwd toggle's, and a
    second rule for the same class merges with it rather than replacing it. */
 #themeseg{ position:relative; display:flex; gap:2px; padding:3px; border-radius:4px;
       background:var(--seg-track); }
 #themeseg .thumb{ position:absolute; top:3px; bottom:3px; width:26px;
              border-radius:3px; background:var(--seg-pill);
              border:1px solid var(--seg-edge); box-shadow:0 1px 4.5px rgba(0,30,70,.235);
              transition:transform 170ms cubic-bezier(.22,.61,.36,1); }
 #themeseg button{ position:relative; width:26px; height:22px; padding:0; border:0;
              background:none; cursor:pointer; display:flex;
              align-items:center; justify-content:center; }
 #themeseg button svg{ width:14px; height:14px; fill:var(--tool); opacity:1;
                  transition:opacity 170ms ease; }
 #themeseg button.on svg{ opacity:1; }

 .iconbtn{ width:26px; height:26px; padding:0; border:0; background:none;
           cursor:pointer; border-radius:4px; display:flex;
           align-items:center; justify-content:center; }
 .iconbtn svg{ width:19px; height:19px; fill:var(--tool); }
 .iconbtn:hover, .iconbtn:active{ background:var(--tb-hover); }
 /* EVERY BUTTON ON THE PAGE PRESSES LIKE ITS COUNTERPART IN THE APP: the
    pressed colour of that button's own sheet, in 40 ms on the way down and
    fading back over 250 ms. Colour only, as the app's states are. */
 .iconbtn, .pager button, .popfit, #peek, .trend .tools button, .accbtn{
   transition:background-color 250ms ease; }
 .iconbtn:active, .pager button:active:not(:disabled), .popfit:active, #peek:active,
 .trend .tools button:active{ background:var(--tb-on); transition-duration:40ms; }
 .accbtn:active{ background:var(--ghost-press); transition-duration:40ms; }
 .accbtn.danger:active{ background:var(--danger-press); }
 #go:active:not(:disabled){ background:var(--navy-press); border-color:var(--navy-press);
                            transition-duration:40ms; }
 .seg span[data-d]:active:not(.on){ background:var(--seg-press); border-radius:3px; }
 #backbar:active{ color:var(--navy); }
 #backbar:active svg{ stroke:var(--navy); }

 /* The account page: the same rows as everywhere else, and the one button
    that used to float at the bottom of every screen. */
 /* THE FOOTER: a hairline, then two quiet centred lines. */
 #foot{ margin:4px 0 0; padding:10px 0 2px; border-top:1px solid var(--rule);
        display:flex; justify-content:center; align-items:center; flex-wrap:wrap;
        gap:2px 7px; color:var(--muted); font-size:11px; }
 #foot .fver{ color:var(--ink); font-weight:600; }
 #foot .fdot{ color:var(--border); }
 /* THE ACCOUNT PAGE. The one place on the page that is about a PERSON, so
    it is laid out like a profile: initials in the app's navy, the name, and
    two grouped lists with a hairline between rows (the app's own grey). */
 .acc{ max-width:560px; }
 .acchead{ display:flex; align-items:center; gap:16px; margin:6px 0 22px; }
 .avatar{ width:56px; height:56px; border-radius:50%; flex:0 0 56px;
          display:flex; align-items:center; justify-content:center;
          background:var(--navy-fill); color:#ffffff; font-size:20px; font-weight:600;
          letter-spacing:.5px; }
 .accname{ font-size:18px; font-weight:600; color:var(--ink); line-height:1.25; }
 .accsub{ font-size:12px; color:var(--muted); margin-top:3px; }
 .accgrp{ margin-bottom:18px; }
 .acccap{ font-size:13px; font-weight:600; color:var(--ink); margin:0 0 8px 2px; }
 .accrow.dev{ min-height:56px; }
 .devico{ flex:0 0 36px; height:36px; border-radius:8px; background:var(--pill-blue-bg);
          display:flex; align-items:center; justify-content:center; }
 .devico svg{ width:20px; height:20px; fill:var(--navy-fill); }
 .devtxt{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px; }
 .devname{ color:var(--ink); font-weight:600; }
 .devsub{ color:var(--muted); font-size:12px; }
 .acclist{ border:1px solid var(--border); border-radius:8px; background:var(--card);
           overflow:hidden; }
 .accrow{ display:flex; align-items:center; gap:12px; min-height:44px; padding:0 14px;
          font-size:13px; }
 .accrow + .accrow{ border-top:1px solid var(--rule); }
 .accrow .k{ flex:0 0 110px; color:var(--muted); }
 .accrow .v{ flex:1 1 auto; min-width:0; color:var(--ink); overflow:hidden;
             text-overflow:ellipsis; white-space:nowrap;
             display:flex; align-items:center; gap:8px; }
 .accbtn{ flex:0 0 auto; height:28px; padding:0 14px; border-radius:6px; cursor:pointer;
          font:inherit; font-size:12px; font-weight:600; color:var(--navy-fill);
          background:transparent; border:1px solid var(--border); }
 .accbtn:hover{ background:var(--hover); }
 .accbtn.danger{ color:var(--pill-red-ink); border-color:var(--pill-red-edge); }
 .accbtn.danger:hover{ background:var(--pill-red-bg); }
 .accnote{ font-size:11.5px; color:var(--muted); margin:8px 2px 0; line-height:1.45; }
 /* a switch that is turning (phone alerts): held still, and it says so */
 .accbtn:disabled{ opacity:.55; cursor:default; background:transparent; }
 /* two buttons side by side sit closer than the row's text does to them */
 .accbtn:not(.hidden) + .accbtn{ margin-left:-4px; }
 /* WHICH ALERTS THIS DEVICE GETS (Phone alerts): a caption with where the
    choice stands at its right, then one tick per alert, each row tall
    enough for a thumb. The tick is the sign-in card's, in the app's navy. */
 .accrow.pushev{ display:block; padding:10px 14px 8px; }
 .pushev .evhead{ display:flex; align-items:baseline; justify-content:space-between;
                  gap:12px; margin-bottom:2px; }
 .pushev .evcap{ font-weight:600; color:var(--ink); }
 .pushev .saved{ font-size:12px; color:var(--muted); transition:color var(--t-state) ease; }
 .pushev .saved.wait{ color:var(--pill-gold-ink); }
 .pushev label{ display:flex; align-items:center; gap:10px; min-height:34px;
                color:var(--ink); cursor:pointer; }
 .pushev input{ accent-color:var(--navy-fill); width:16px; height:16px; margin:0; flex:0 0 16px; }
 /* held still while alerts are turning on or off */
 .pushev.held label{ opacity:.55; cursor:default; }
 :root[data-theme="night"] .accbtn{ color:var(--navy); }
 /* ...but a danger button keeps its red by night too: the rule above
    outranked .accbtn.danger and printed "Forget" in blue on a red edge. */
 :root[data-theme="night"] .accbtn.danger{ color:var(--pill-red-ink); }
 /* NAVY AS INK, NOT AS FILL, BY NIGHT. A glyph in the navy fill (#1f4f85)
    on the blue pill's night ground (#2e4760) could hardly be seen; the app
    draws navy lines and text in NAVY_TEXT by night, which is --navy. */
 :root[data-theme="night"] .devico svg,
 :root[data-theme="night"] .lockmark svg,
 :root[data-theme="night"] #peek.on svg{ fill:var(--navy); }

 /* THE FRONT PANEL. One row per module: its name in the section face, the
    one reading worth glancing at underneath, a chevron to say it opens.
    A row is a button because that is what it is, styled back down so it
    reads as part of the page rather than as a control. */
 #home{ margin-top:2px; }
 /* Separated by space, not by a line: five rules down a short list is
    more furniture than list. */
 .modrow{ display:block; width:100%; text-align:left; cursor:pointer;
          background:none; border:0; padding:0 0 20px; font:inherit;
          color:inherit; position:relative; isolation:isolate; }
 .modrow:last-child{ padding-bottom:6px; }
 /* A PRESS YOU CAN SEE (the user, 2026-09-28: "a bit of a click feel").
    The row keeps no box of its own; a wash in the app's plain-button colours
    comes up behind it, a little wider than the text, and only colour moves
    (the app's rule for state changes). Down is quick (40 ms), release fades
    (250 ms), and the row that was opened keeps its wash until the reader
    comes back, then lets it go, so returning shows where they came from. */
 .modrow::before{ content:""; position:absolute; z-index:-1; left:-8px; right:-8px;
                  top:-6px; bottom:14px; border-radius:var(--radius);
                  background:transparent; transition:background-color 250ms ease; }
 .modrow:last-child::before{ bottom:0; }
 /* Hover only where there is a pointer that hovers: on a touch screen the
    hover state stays on the row last tapped, which then looked pressed for
    good after coming back to this list. BEFORE the pressed rule, which has
    the same weight and must win while both hold. */
 @media (hover: hover){
   .modrow:hover::before{ background:var(--hover); }
   .modrow:hover .modname{ color:var(--navy-hover); }
 }
 .modrow:active::before, .modrow.pressed::before{ background:var(--press);
                  transition-duration:40ms; }
 .modrow:active .modname{ color:var(--navy-hover); }
 :root[data-theme="night"] .modrow:active .modname{ color:var(--navy); }
 .modname{ display:flex; align-items:baseline; justify-content:space-between;
           gap:10px; font-family:"Avenir","Avenir Book","Nunito Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
           font-size:14px; font-weight:700; color:var(--ink); }
 /* ui_style.draw_chevron's geometry, pointing the way the row opens. */
 .modname svg{ width:13px; height:13px; flex:0 0 13px; stroke:var(--muted);
               stroke-width:2.8; fill:none; stroke-linecap:round;
               stroke-linejoin:round; align-self:center; }
 .modread{ margin-top:5px; font-size:12px; color:var(--ink);
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
 /* A row of several readings breaks between them rather than losing the
    last one to the ellipsis (the age of the fridge's sample, the warnings). */
 .modread.wrap{ white-space:normal; }
 .modread .nb{ white-space:nowrap; }
 /* A FINGER IS NOT A POINTER: the plot tools, pager chevrons and the theme
    switch are 22 px, half what a fingertip needs. Each gets an invisible
    44 px tall hit area; widened only a little, so neighbours do not take
    each other's taps. */
 @media (pointer: coarse){
   .pager button, .trend .tools button, .iconbtn, .smseg button,
   .trend .tools .plotsave, .pophead .plotsave{ position:relative; }
   .pager button::after, .trend .tools button::after, .plotsave::after,
   .iconbtn::after, #themeseg button::after, .smseg button::after,
   #peek::after{ content:""; position:absolute; inset:-11px -3px; }
 }
 .modread .dim, .modrow .dim{ color:var(--muted); }
 .modrow .bar{ margin-top:8px; }
 /* TWO COLUMNS, at every width the front panel is shown (the user,
    2026-09-26, after comparing it with one column and with only Fridge and
    Instruments paired). Each row keeps its height and starts at the top of
    its grid row: a button centres its content vertically, which put the
    shorter of a pair lower than its neighbour. A long reading (a log line)
    is cut with an ellipsis where it meets the next column. The lamps take a
    line of their own over the count, since half a phone is too narrow for
    both. */
 #home{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr));
        column-gap:20px; align-items:start; }
 #home .modrow[data-go="m-insts"] .modread{ white-space:normal; }
 #home .modrow .lamps{ display:flex; flex-wrap:wrap; max-width:100%; margin:0 0 5px; }
 /* On the narrowest phones (320 px) half the page is about 130 px, and
    twelve lamps 3 px apart need 141: the last one dropped onto a line of its
    own. 2 px apart they need 130, and a narrower gutter between the columns
    leaves room for them even where a scrollbar keeps its lane. */
 @media (max-width: 359px){
   #home{ column-gap:14px; }
   #home .modrow .lamps{ gap:2px; }
 }

 /* THE RUN'S READ-OUTS, in the panel's two columns: label then value,
    reading across. No box around a value, because there is nothing to type
    into here; the panel's read-only fields are a form's convention, not a
    way of showing a number. */
 /* THE PANEL'S OWN GRID: five columns, as the QGridLayout has them. A
    progress bar spans the first three, so the rate beside it (min/line,
    s/point) lands in the fourth and fifth, which is where the panel writes
    it. Rows are placed explicitly, so a cell the run cannot fill leaves a
    gap rather than shuffling everything up a line. */
 #runtime{ display:grid;
           grid-template-columns:auto minmax(64px,140px) 14px auto minmax(64px,140px);
           gap:5px 10px; max-width:560px; margin:12px 0 2px;
           font-size:12px; align-items:center; }
 #runtime .k{ color:var(--muted); white-space:nowrap; }
 #runtime .v{ color:var(--ink); white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
 #runtime .u{ color:var(--unit); margin-left:3px; }
 #runtime .bar{ margin:0; }
 @media (max-width: 560px){
   /* The bar keeps the full width and each caption takes the line under it,
      which is how the panel reflows when its window is narrowed. */
   #runtime{ grid-template-columns:auto 1fr; }
   #runtime > *{ grid-column:auto !important; grid-row:auto !important; }
   #runtime .bar{ grid-column:1 / -1 !important; }
 }

 /* Going back. Only ever present on a narrow screen, inside a module. */
 #backbar{ display:flex; align-items:center; gap:7px; cursor:pointer;
           background:none; border:0; padding:2px 0 12px; font:inherit;
           color:var(--muted); font-size:12px; }
 #backbar svg{ width:13px; height:13px; stroke:var(--muted); stroke-width:2.8;
               fill:none; stroke-linecap:round; stroke-linejoin:round; }
 #backbar:hover{ color:var(--navy); }
 #backbar:hover svg{ stroke:var(--navy); }
 /* Until the lock opens the icons have no src at all: an empty one would
    make the browser re-request this page, and a placeholder would still be
    an image baked into the markup. */
 .logo:not([src]){ display:none; }

<script>
/* ---------- the theme ---------------------------------------------------- */
/* Day, Night, or whatever the system is on. Chosen here rather than matched
   in CSS so the three-way choice has one place to live; the head script has
   already applied it before the first paint. */
const THEME_KEY = "rv.theme";
function themeMode(){
  try { return localStorage.getItem(THEME_KEY) || "system"; }
  catch(e){ return "system"; }
}
function applyTheme(mode){
  const dark = mode === "night" || (mode !== "day" &&
    window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "night" : "day";
  /* the phone's bar follows the ground (--ground, day and night) */
  const tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.content = dark ? "#353535" : "#f0f0f0";
  const seg = document.querySelector("#themeseg");
  if(!seg) return;
  const btns = [...seg.querySelectorAll("button")];
  btns.forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  const i = Math.max(0, btns.findIndex(b => b.dataset.mode === mode));
  const t = document.querySelector("#segthumb");
  if(t) t.style.transform = "translateX(" + (i * 26) + "px)";
}
/* The whole window through a fade, which is what the app allows here and
   all it allows. The plots are redrawn in the middle of it: a canvas is a
   bitmap and took its colours from the variables when it was drawn, so
   without this the page turns dark around plots still in daylight. */
function setTheme(mode){
  try { localStorage.setItem(THEME_KEY, mode); } catch(e){}
  /* The plots are repainted with the colours, inside whichever transition
     runs: a canvas keeps the pixels it was drawn with. */
  const swap = () => { applyTheme(mode); redrawOpen(); };

  if(document.startViewTransition && motionOK() && !vtMisdrawn()){
    change("theme", swap);
    return;
  }
  /* No snapshot available: dip, but shallowly and unhurriedly. A deep quick
     dip is what reads as a flinch. */
  const root = document.documentElement;
  const half = 180;
  root.style.transition = "opacity " + half + "ms ease";
  root.style.opacity = "0.55";
  setTimeout(() => {
    swap();
    root.style.opacity = "1";
    setTimeout(() => { root.style.transition = root.style.opacity = ""; },
               half + 20);
  }, half);
}
