/* ONE listener per list, on the list, bound once: the rows under it are
   updated in place and must not collect a listener per refresh. The open set
   is the truth; the classes follow it now and on every refresh after. */
function wireSections(host, openSet, attr){
  host.addEventListener("click", ev => {
    const el = ev.target.closest(".sec");
    if(!el || !host.contains(el)) return;
    const k = el.dataset[attr];
    openSet.has(k) ? openSet.delete(k) : openSet.add(k);
    el.classList.toggle("open", openSet.has(k));
    const body = el.nextElementSibling;
    if(body && body.classList.contains("body")) body.classList.toggle("shut", !openSet.has(k));
  });
}

/* ---------- the system log ----------------------------------------------- */
/* Oldest first with the newest at the BOTTOM, and follow it, because that is
   the Global System Log's own order. The source tag at the head of a line is
   navy on every line, including a warning or an error: only the body takes
   the level colour. */
const LOG_TAG = /^([\[(][^\])]{1,40}[\])])\s*/;
function logLineHTML(l){
  const mm = LOG_TAG.exec(l.text || "");
  const tag = mm ? '<span class="g">' + esc(mm[1]) + '</span> ' : "";
  const body = mm ? (l.text || "").slice(mm[0].length) : (l.text || "");
  return '<div><span class="t">' + esc(l.time) + '</span>' + tag +
         '<span class="' + esc(l.level) + '">' + esc(body) + '</span></div>';
}
/* THE LOG MOVES THE WAY THE APP'S DOES (Widgets: log follow glide). The
   publisher sends the newest lines, so from one push to the next some fall
   off the top and some arrive at the bottom. The lines still there keep
   their places, the new ones are added under them, and a reader who was at
   the end is carried down to it smoothly; one who had scrolled up to read is
   left exactly where they were. Lines are matched on time, text and level. */
let logKeys = [];
function renderLog(lines){
  const box = $("#log");
  const keys = lines.map(l => [l.time, l.text, l.level].join("\u0001"));
  const wasAtEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
  /* how many old lines went off the top: what is left of the old list must
     be where the new one starts */
  let drop = -1;
  for(let k = 0; k <= logKeys.length && drop < 0; k++){
    const rest = logKeys.length - k;
    if(rest > keys.length) continue;
    let same = true;
    for(let i = 0; i < rest && same; i++) same = logKeys[k + i] === keys[i];
    if(same) drop = k;
  }
  if(drop < 0 || box.children.length !== logKeys.length){
    box.innerHTML = lines.map(logLineHTML).join("");
    if(wasAtEnd) box.scrollTop = box.scrollHeight;
  } else if(drop > 0 || keys.length > logKeys.length){
    box.insertAdjacentHTML("beforeend",
      lines.slice(logKeys.length - drop).map(logLineHTML).join(""));
    let lost = 0;
    for(let i = 0; i < drop; i++){
      lost += box.firstElementChild.offsetHeight;
      box.firstElementChild.remove();
    }
    if(lost) box.scrollTop = Math.max(0, box.scrollTop - lost);
    if(wasAtEnd) box.scrollTo({top: box.scrollHeight, behavior: "smooth"});
  }
  logKeys = keys;
}

/* ---------- the front panel ---------------------------------------------- */
/* PROGRESS_QSS's groove with its own caption centred on it. One definition,
   used by the run's section and by the run's row on the front panel, so the
   two can never drift apart. */
/* ── the panel's run-info grid ─────────────────────────────────────────────
   Each cell knows the row, column and span it had in the QGridLayout, so the
   page puts it back there: captions in columns 0 and 3, values in 1 and 4,
   and a progress bar across 0..2. The publisher sends the panel's own cells
   when the app is running and a reconstruction from the run file when it is
   not; both arrive in this one shape, so there is one renderer. */
function renderRuntime(cells){
  const host = $("#runtime");
  host.classList.toggle("hidden", !cells.length);
  if(!cells.length){ host.innerHTML = ""; return; }
  /* CSS grid lines count from one, and a column the panel left empty must
     stay empty, so every cell is placed rather than flowed. In place, so the
     bars in it glide. */
  morph(host, cells.map(c => {
    const at = 'grid-row:' + (c.r + 1) + '; grid-column:' + (c.c + 1) +
               ' / span ' + Math.max(1, c.cs || 1) + ';';
    if(c.kind === "bar"){
      return '<div class="bar' + ((c.frac || 0) >= 1 ? ' full' : '') +
             '" style="' + at + '">' +
             '<div class="fill" style="width:calc(' +
             (Math.max(0, Math.min(1, c.frac || 0))*100).toFixed(2) +
             '% - 2px)"></div><div class="cap">' + esc(c.text || "") +
             '</div></div>';
    }
    const cls = c.kind === "cap" ? "k" : "v";
    return '<span class="' + cls + '" style="' + at + '">' + esc(c.text || "") +
           (c.unit ? '<span class="u">' + esc(c.unit) + '</span>' : '') +
           '</span>';
  }).join(""));
}

function barHTML(pct, cap){
  pct = Math.max(0, Math.min(1, pct || 0));
  return '<div class="bar' + (pct >= 1 ? ' full' : '') + '">' +
         '<div class="fill" style="width:calc(' + (pct*100).toFixed(2) +
         '% - 2px)"></div><div class="cap">' + cap + '</div></div>';
}

/* Wide enough for everything at once? The same width the plots stop paging
   at, so the page has one idea of "narrow" rather than two. */
const WIDE = 860;
const wide = () => window.innerWidth >= WIDE;

//: module id -> the name on its row, in the order they are listed
const MODULES = [
  ["m-experiment", "Experiment"],
  ["m-fridge",     "Fridge Status"],
  ["m-insts",      "Instrument Connections"],
  ["m-log",        "System Log"],
  ["m-xlog",       "Experiment Log"],
];
/* Pages that are NOT modules: no row on the front panel, never laid out
   with the monitoring, reached only by their own control. */
const EXTRA = ["m-account"];
const ROUTABLE = () => MODULES.map(m => m[0]).concat(EXTRA);

let route = null;            // which page is open, if any
let lastSnap = null;         // the last snapshot, for redrawing the rows

const CHEV = '<svg viewBox="0 0 24 24"><path d="M8.3 4.8 L15.7 12 L8.3 19.2"/></svg>';

/* What a module puts on its own row: the one reading that says whether it
   needs opening. */
function summary(id, s){
  const r = s.run || {};
  if(id === "m-experiment"){
    let out = '<div class="modread">' +
              (r.experiment ? esc(r.experiment)
                            : '<span class="dim">no run yet</span>') + '</div>';
    /* ONE BAR on the front panel, the big one (the user, 2026-09-23). The
       app sends the Total bar's own caption and fill when it is running;
       otherwise it is rebuilt from the counts. */
    const hb = r.home_bar;
    if(Array.isArray(hb)){
      out += barHTML(hb[1] || 0, esc(String(hb[0] || "")));
    } else {
      const B = r.bars;
      if(B && B.total && B.total[1]){
        out += barHTML(B.total[0] / B.total[1],
                       B.total[0] + ' / ' + B.total[1]);
      }
    }
    return out;
  }
  if(id === "m-fridge"){
    const f = s.fridge || {};
    if(!f.available) return '<div class="modread dim">not on this system</div>';
    const L = f.latest || {};
    const bits = [];
    if(L.temperature_k != null) bits.push(num(L.temperature_k) + " K");
    if(L.gauge1_torr != null) bits.push(num(L.gauge1_torr) + " Torr");
    const stale = ' ' + agoSpan(f.age_s, 60, true);
    return '<div class="modread">' +
           (bits.length ? bits.join(" &middot; ")
                        : '<span class="dim">no reading</span>') + stale + '</div>';
  }
  if(id === "m-insts"){
    const d = s.insts || {};
    if(!d.available) return '<div class="modread dim">No roster</div>';
    const items = d.items || [];
    const lamps = '<span class="lamps">' + items.map(i =>
      '<span class="led ' + (INST_STATE[i.state] || INST_STATE.unknown)[0] +
      '"></span>').join("") + '</span>';
    return '<div class="modread">' + lamps +
           (d.up || 0) + ' of ' + (d.total || items.length) + ' Connected</div>';
  }
  if(id === "m-xlog"){
    const x = s.explog || {};
    const e = (x.entries || [])[0];
    if(!x.available) return '<div class="modread dim">no log file</div>';
    if(!e) return '<div class="modread dim">nothing logged yet</div>';
    return '<div class="modread"><span class="dim">' + esc(e.day) + '</span> ' +
           esc(e.name) + '</div>';
  }
  if(id === "m-log"){
    const lines = (s.log || {}).lines || [];
    const last = lines[lines.length - 1];
    if(!last) return '<div class="modread dim">nothing logged</div>';
    return '<div class="modread"><span class="dim">' + esc(last.time) + '</span> ' +
           esc(last.text || "") + '</div>';
  }
  return "";
}

function renderHome(s){
  /* The run's row carries the same heading its page does: "Experiment in
     progress" while one runs, "Last Experiment" after (the user, 2026-09-23). */
  const runName = ((s.run || {}).active) ? "Experiment in progress" : "Last Experiment";
  morph($("#home"), MODULES.map(([id, name]) =>
    [id, id === "m-experiment" ? runName : name]).map(([id, name]) =>
    '<button class="modrow" data-go="' + id + '">' +
      '<div class="modname"><span>' + esc(name) + '</span>' + CHEV + '</div>' +
      summary(id, s) +
    '</button>').join(""));
}

/* Show what this width and this route call for. Nothing here rebuilds a
   section; it only decides which are on screen. */
/* THE LOG FITS THE SCREEN when it is the page on its own: its box runs down
   to the bottom of the window, where the Global System Log fills its panel
   (the user, 2026-09-23). Laid out with the other modules it keeps its
   fixed height. */
function fitLog(){
  const box = $("#log");
  if(!box) return;
  if(route === "m-log" && !box.closest(".hidden")){
    const top = box.getBoundingClientRect().top + window.scrollY;
    box.style.height = Math.max(160, window.innerHeight - top - 24) + "px";
    box.style.maxHeight = "none";
  } else {
    box.style.height = ""; box.style.maxHeight = "";
  }
}
function applyRoute(){
  const w = wide();
  /* A page is open: show only it, whatever the width, and offer the way
     back. Otherwise a wide screen lays out every module and a narrow one
     shows the front panel. */
  const onPage = route !== null;
  $("#home").classList.toggle("hidden", w || onPage);
  $("#backbar").classList.toggle("hidden", !onPage);
  ROUTABLE().forEach(id => {
    const el = $("#" + id);
    if(!el) return;
    const show = onPage ? (route === id)
                        : (w && EXTRA.indexOf(id) === -1);
    el.classList.toggle("hidden", !show);
  });
  fitLog();
}

/* A hidden canvas has no width, so a plot drawn while its module was closed
   drew into nothing. Opening one redraws it. */
function redrawOpen(){
  if(!lastMap) return;
  renderAny(lastMap);
}

/* The tab change: 150 ms of dissolve with 8 px of travel. */
function arrive(el, from){
  if(!el) return;
  el.style.transition = "none";
  el.style.opacity = "0";
  el.style.transform = "translateY(" + from + ")";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.transition = "opacity var(--t-tab) var(--ease), " +
                          "transform var(--t-tab) var(--ease)";
    el.style.opacity = "1";
    el.style.transform = "translateY(0)";
  }));
}

function go(id){
  route = id;
  const w = wide();
  $("#backword").textContent = w ? "Back" : "All modules";
  applyRoute();
  window.scrollTo(0, 0);
  /* Drawn BEFORE it is faded in: a plot sized while its module was hidden
     has no width, and the fade would then be a fade onto an empty frame. */
  if(id === "m-experiment") redrawOpen();
  arrive($("#" + id), "var(--travel)");
}

function home(){
  route = null;
  applyRoute();
  window.scrollTo(0, 0);
  if(lastSnap) renderHome(lastSnap);
  /* Coming back moves the other way. */
  arrive(wide() ? null : $("#home"), "calc(var(--travel) * -1)");
  /* Coming back on a wide screen reveals every module at once, and the plots
     in them have not been drawn at this width since they were hidden. */
  if(wide()) redrawOpen();
}

/* A refresh that fails keeps what is on screen and says why beside its age,
   rather than blanking the state it last knew. */
function trouble(why){
  fetchTrouble = why;
  if(sealT == null) $("#head").innerHTML = '<span class="stale">' + esc(why) + '.</span>';
  else tickAges();
}
async function tick(force, pre){
  let blob, s;
  /* A refresh that did not arrive is tried again at the pace the run is
     going at, not dropped to the idle one: one lost request in the middle
     of a sweep used to cost ten seconds. */
  try { blob = pre || await fetchBlob(); }
  catch(e){ trouble("Cannot reach GitHub"); rearm(runActive); return; }
  fetchTrouble = "";
  /* THE SAME PUSH AGAIN. The page asks more often than the lab PC pushes, so
     most answers are the push already on screen: nothing to open, nothing to
     redraw. Only the ages move. */
  if(!force && blob.iv && blob.iv === lastIv){
    tickAges();
    rearm(runActive);
    return;
  }
  try { s = await open_(blob, key); }
  catch(e){
    /* THE SECRET WAS CHANGED UNDER AN OPEN PAGE: taking someone off seals
       everything after it under a new secret, and every other reader's page
       used to stop at "Cannot open the data" until it was reloaded. The
       reader's own slot in the new block opens it again, if they still have
       one. Tried once per push, so a reader who was taken off does not pay a
       key derivation every refresh. */
    if(cred && blob.iv !== rekeyTried){
      rekeyTried = blob.iv;
      try {
        const who = await openSlot(blob.slots, cred.n, cred.p);
        if(who && who.s){
          const k2 = await deriveKey(who.s, b64(blob.salt));
          s = await open_(blob, k2);
          key = k2;
          for(const id of Object.keys(frameCache)) delete frameCache[id];
        }
      } catch(e2){ s = undefined; }
    }
    if(!s){ trouble("Cannot open the data"); rearm(runActive); return; }
  }
  /* How long the last push took to follow the one before: a progress bar
     glides over that long, so it creeps on as the panel's does instead of
     jumping once a push. */
  const gap = (sealT != null && blob.t > sealT) ? blob.t - sealT : 0;
  document.documentElement.style.setProperty("--glide",
    (gap > 0 && gap <= 8) ? Math.round(gap * 1000) + "ms" : "220ms");
  document.documentElement.style.setProperty("--glide-ease",
    (gap > 0 && gap <= 8) ? "linear" : "cubic-bezier(.22,.61,.36,1)");
  lastIv = blob.iv;
  sealT = blob.t || nowS();
  runActive = !!((s.run || {}).live || (s.run || {}).active);
  rearm(runActive);

  /* The lab PC stamps every push. If that stamp stops moving, the app or the
     publisher has stopped and the numbers below are history. Say so plainly:
     a stale reading that looks live is the one dangerous failure of a page
     you check at 3 a.m. The pill carries the phrase, the age goes beside it,
     because a status pill in this app never carries a number. */
  const age = sinceSeal();
  const app = s.app || {};
  const cfgList = ((s.run || {}).config) || [];
  const sysRow = cfgList.find(e => e.key === "System");
  const system = (sysRow && sysRow.value) || app.system || "";
  const what = age > SILENT_S ? ["red", "Not reporting"]
             : app.running ? ["blue", "App running"]
                           : ["red", "App not running"];
  const pill = '<span class="pill ' + what[0] + '">' + what[1] +
               (system ? ' &middot; ' + esc(system) : '') + '</span>';
  morph($("#head"), pill + freshHTML());
  /* THE MAIN WINDOW'S SAFETIP NOTICE, word for word, while it is up there:
     the trip sentence with the run's name in bold. Only <b> survives from
     the app's markup. It goes when the trip is acknowledged in the app. */
  const st = s.safetip;
  $("#safetip").classList.toggle("hidden", !st);
  $("#safetip").innerHTML = st ? '<span class="stnotice">' +
    esc(st.text || "SafeTip triggered").replace(/&lt;(\/?)b&gt;/g, "<$1b>") +
    '</span>' : "";

  /* the lamps, in the panel's order and with the panel's own legends */
  const LEDS = [
    ["safetip", "SafeTip Guard", "error: SafeTip triggered.  off: clear"],
    ["poking",  "Poking",        "on: poking.  error: poke failed.  off: idle"],
    ["measuring", "Measuring",   "on: measuring.  off: idle"],
  ];
  const leds = (s.run || {}).leds || {};
  /* THE LAMPS THIS PANEL HAS. The run says so when its panel differs from
     the sweep panels' three; a key starting "?" is a lamp no file reports,
     so it stays grey and says why. */
  const set = Array.isArray((s.run || {}).led_set) ? (s.run || {}).led_set : LEDS;
  morph($("#leds"), set.map(([k, caption, tip]) =>
    '<span class="grp" title="' + esc(tip) + '">' +
    '<span class="led ' + esc(k.charAt(0) === "?" ? "off" : (leds[k] || "off")) +
    '"></span><span>' + esc(caption) + '</span></span>').join(""));

  const r = s.run || {};
  /* A NEW RUN STARTS CLEAN (the user, 2026-09-23): every Up/Down or Fwd/Bwd
     toggle back on its first pass and the plots back on page one, rather than
     carrying what was picked for the previous file. */
  if(r.file !== lastRunFile){
    if(lastRunFile !== undefined){
      for(const k of Object.keys(dirOf)) delete dirOf[k];
      for(const k of Object.keys(selFrame)) delete selFrame[k];
      mapViews.pop = null; mapViews.xy = null;
      $("#fpick").dataset.k = "";          // rebuilt with nothing picked
      page = 0; plotKey = "";
    }
    lastRunFile = r.file;
  }
  /* Whether this is happening NOW or is the last thing that did, and which
     experiment it is, off to the right. */
  $("#runhead").textContent = r.active ? "Experiment in progress"
                                       : "Last Experiment";
  $("#runwhat").textContent = r.experiment || "";
  /* The bars live in the run-info grid now, beside the rate that belongs to
     each (renderRuntime). This block is kept only for a payload published by
     an older build, which has bars and no grid. */
  /* Poke on Path carries its bar over its map, as its panel does. */
  const B = ((r.runtime || []).length || (r.map && (r.map.pop || r.map.kind === "approach")))
            ? null : r.bars;
  morph($("#bars"), !B ? "" :
    [["Total", B.total], ["Line", B.line]]
      .filter(([, b]) => Array.isArray(b))
      .map(([name, [v, mx]]) =>
        barHTML(mx ? v/mx : 0, name + '&nbsp;&nbsp;' + v + ' / ' + mx)).join(""));
  if(!r.file){}
  else{
    const m = r.map;
    $("#fpick").classList.toggle("hidden", !(m && m.kind === "frames"));
    if(m) m.bwd = !/raster/i.test(r.scan_mode || "")
                  && !/^forward$/i.test(r.direction || "");
    if(m && m.kind === "curves"){
      $("#plots").classList.remove("hidden");
      $("#legacy").classList.add("hidden");
      $("#plots").style.flexWrap = "";
      $("#plots").style.flexDirection = "";
      $("#plots").style.alignItems = "";
      lastMap = m;
      renderCurves(m);
    } else if(m && m.kind === "records"){
      /* a run that is a list of what happened, not a grid of what was measured */
      $("#plots").classList.remove("hidden");
      $("#legacy").classList.add("hidden");
      lastMap = m;
      renderRecords(m);
    } else if(m && m.kind === "approach"){
      /* the Approach panel's two halves */
      $("#plots").classList.remove("hidden");
      $("#legacy").classList.add("hidden");
      m._leds = r.leds || {};
      lastMap = m;
      renderApproach(m);
    } else if(m && m.kind === "frames"){
      /* a frame run: the reader picks which frame each column shows */
      $("#plots").classList.remove("hidden");
      $("#legacy").classList.add("hidden");
      $("#plots").style.flexWrap = "";
      $("#plots").style.flexDirection = "";
      $("#plots").style.alignItems = "";
      lastMap = m;
      renderFrames(m);
    } else if(m && (m.channels || []).length){
      $("#plots").classList.remove("hidden");
      $("#legacy").classList.add("hidden");
      $("#plots").style.flexWrap = "";
      $("#plots").style.flexDirection = "";
      $("#plots").style.alignItems = "";
      lastMap = m;
      renderPlots(m);
    } else {
      /* not a 2D sweep: keep the one picked column */
      $("#plots").classList.add("hidden");
      $("#legacy").classList.remove("hidden");
      lastMap = null;
      const cols = r.columns || [];
      if(cols.join("|") !== lastCols){
        lastCols = cols.join("|");
        $("#col").innerHTML = cols.map((c,i) => '<option value="'+i+'">'+esc(c)+'</option>').join("");
        chosen = Math.min(cols.length-1, cols[0] && cols[0].toLowerCase()==="index" ? 3 : 1);
        $("#col").value = chosen;
      }
      draw(r.trace || [], chosen == null ? 1 : chosen);
    }
  }

  /* THE RUN'S OWN HEADER, section by section, exactly as written. Nothing
     here is re-worded: the page shows what the .dat says. */
  const cfg = ((s.run || {}).config) || [];
  let seen = null, chtml = "", open = false;
  for(const e of cfg){
    if(e.section !== seen){
      if(open){ chtml += '</div></div>'; open = false; }
      seen = e.section;
      if(seen){
        const isOpen = cfgOpen.has(seen);
        chtml += '<div class="sec' + (isOpen ? ' open' : '') +
          '" data-sec="' + esc(seen) + '">' +
          '<svg viewBox="0 0 24 24"><path d="M8.3 4.8 L15.7 12 L8.3 19.2"/></svg>' +
          esc(seen) + '</div><div class="body' + (isOpen ? '' : ' shut') + '"><div class="in">';
        open = true;
      }
    }
    chtml += row(esc(e.key), esc(e.value));
  }
  if(open) chtml += '</div></div>';
  /* In place, so a section opening under the reader's finger keeps its
     element and finishes its animation; the clicks are the host's. */
  morph($("#cfg"), chtml);

  const f = s.fridge || {};
  if(!f.available){ morph($("#fridge"), row("No environment log", "not on this system")); }
  else{
    const L = f.latest || {};
    let html = row("Temperature", num(L.temperature_k), "K");
    html += row("Gauge 1", num(L.gauge1_torr), "Torr");
    html += row("Gauge 2", num(L.gauge2_torr), "Torr");
    html += row("Turbo", num(L.turbo_pct), "%");
    html += row("Flow", num(L.mfc_flow), "sccm");
    /* counted on between pushes: the sample does not get younger because
       nothing new has been pushed since */
    html += row("Last sample", agoSpan(f.age_s, 60, false));
    morph($("#fridge"), html);
  }

  renderLog((s.log || {}).lines || []);

  renderRuntime((s.run || {}).runtime || []);

  renderAccount(s);
  renderFoot(s.footer);
  renderInsts(s.insts);
  renderXlog(s.explog);

  /* and the rows on the front panel, which is on screen only when narrow */
  lastSnap = s;
  renderHome(s);
  applyRoute();
}

$("#col").addEventListener("change", e => { chosen = +e.target.value; tick(true); });

/* PagedStrip's 260 ms, as a slide: out in the direction of travel, redraw,
   then in from the other side. The halves are equal so the page turns at one
   speed rather than snapping at the join. */
let paging = false;
function repage(step){
  if(!lastMap || paging) return;
  const host = $("#plots");
  const half = 130;
  const away = step > 0 ? -1 : 1;
  paging = true;
  host.style.transition = "transform " + half + "ms var(--ease), opacity " +
                          half + "ms var(--ease)";
  host.style.transform = "translateX(calc(var(--travel) * " + away + "))";
  host.style.opacity = "0";
  setTimeout(() => {
    page = Math.max(0, page + step);
    renderAny(lastMap);
    host.style.transition = "none";
    host.style.transform = "translateX(calc(var(--travel) * " + (-away) + "))";
    /* Two frames: one for the jump to the far side to take effect without a
       transition, one to start the transition back. */
    requestAnimationFrame(() => requestAnimationFrame(() => {
      host.style.transition = "transform " + half + "ms var(--ease), opacity " +
                              half + "ms var(--ease)";
      host.style.transform = "translateX(0)";
      host.style.opacity = "1";
      setTimeout(() => {
        host.style.transition = host.style.transform = "";
        paging = false;
      }, half + 20);
    }));
  }, half);
}

/* A remembered passphrase makes this a page you glance at, not one you log
   into. It lives in this browser only and never leaves it. */
(function(){
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch(e){}
  /* NetID and passphrase, remembered together. A bare string is the old
     single passphrase, which no longer opens anything: forget it. */
  let rec = null;
  try { rec = saved ? JSON.parse(saved) : null; } catch(e){ rec = null; }
  /* A remembered sign-in that does not open anything puts the card back. */
  const showCard = () => { delete document.documentElement.dataset.auto; };
  if(rec && rec.n && rec.p){
    $("#netid").value = rec.n; $("#pass").value = rec.p;
    unlock(rec.n, rec.p, true).then(okk => { if(!okk) showCard(); }, showCard);
  } else {
    if(saved){ try { localStorage.removeItem(STORE); } catch(e){} }
    showCard();
  }
})();
/* Coming back to the tab after a while should not show a stale number. */

/* A canvas holds pixels, not a layout: turning the phone or changing its text
   size changes the CSS width underneath it and the drawing has to be redone. */
let resizeWait = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeWait);
  resizeWait = setTimeout(() => {
    /* WIDENING PUTS THE MONITORING BACK. A module was opened on its own only
       because there was no room for the rest; once there is, showing one of
       five in a thousand pixels is worse than showing all five. The account
       page is different: it was asked for, so widening leaves it alone. */
    if(wide() && route !== null && EXTRA.indexOf(route) === -1) route = null;
    /* Crossing the breakpoint changes WHICH sections exist on screen, and a
       plot in one that has just appeared has never been drawn at this size. */
    applyRoute();
    if(lastSnap) renderHome(lastSnap);
    if(!lastMap) return;
    renderAny(lastMap);
  }, 150);
});
