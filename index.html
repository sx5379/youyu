/* Show what this width and this route call for. Nothing here rebuilds a
   section; it only decides which are on screen. */
/* THE LOG FITS THE SCREEN when it is the page on its own: its box runs down
   to the bottom of the window, where the Global System Log fills its panel
   (the user, 2026-09-23). Laid out with the other modules it keeps its
   fixed height. */
function fitLog(){
  const box = $("#log");
  if(!box) return;
  if(route === "m-log" && !box.closest(".hidden")){
    const top = box.getBoundingClientRect().top + window.scrollY;
    box.style.height = Math.max(160, window.innerHeight - top - 24) + "px";
    box.style.maxHeight = "none";
  } else {
    box.style.height = ""; box.style.maxHeight = "";
  }
}
function applyRoute(){
  const w = wide();
  /* A page is open: show only it, whatever the width, and offer the way
     back. Otherwise a wide screen lays out every module and a narrow one
     shows the front panel. */
  const onPage = route !== null;
  $("#home").classList.toggle("hidden", w || onPage);
  $("#backbar").classList.toggle("hidden", !onPage);
  ROUTABLE().forEach(id => {
    const el = $("#" + id);
    if(!el) return;
    const show = onPage ? (route === id)
                        : (w && EXTRA.indexOf(id) === -1);
    el.classList.toggle("hidden", !show);
  });
  fitLog();
}

/* A hidden canvas has no width, so a plot drawn while its module was closed
   drew into nothing. Opening one redraws it. */
function redrawOpen(){
  if(lastSnap) renderTrends(lastSnap.fridge);
  if(!lastMap) return;
  renderAny(lastMap);
}

/* Where the browser cannot hold a picture of the old view (no view
   transitions), the new one at least fades up with its 8 px of travel,
   sideways for a change of view (axis "X"), rising otherwise. */
function arrive(el, from, axis){
  if(!el) return;
  const move = "translate" + (axis || "Y");
  el.style.transition = "none";
  el.style.opacity = "0";
  el.style.transform = move + "(" + from + ")";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.transition = "opacity var(--t-tab) var(--ease), " +
                          "transform var(--t-tab) var(--ease)";
    el.style.opacity = "1";
    el.style.transform = move + "(0)";
  }));
}

/* A CHANGE OF VIEW goes through change(): the app's tab change, the old view
   dissolving over the new one as both drift 8 px, forward to the left and
   back to the right (MOTION). Scrolled down at all, the window is dissolved
   in place instead ("fade"): the new view starts at the top, and a picture of
   the old one taken scrolled would start from somewhere else and jump. */
const viewKind = dir => (window.scrollY > 2 ? "fade" : dir);

/* A MODULE PAGE IS A PLACE IN THE HISTORY (2026-09-30), so the browser's
   own back (the edge swipe in a browser tab, Android's back) returns to the
   front panel. Each entry carries how deep it is, so "All modules" goes all
   the way back however many pages were opened on the way. */
let navDepth = 0;
function navPush(id){
  if(!history.pushState || (history.state && history.state.rv === id)) return;
  navDepth += 1;
  try { history.pushState({rv: id, d: navDepth}, ""); } catch(e){}
}
function go(id, pop, dir){
  if(!pop) navPush(id);
  change(viewKind(dir || "forward"), () => {
    route = id;
    $("#backword").textContent = wide() ? "Back" : "All modules";
    applyRoute();
    window.scrollTo(0, 0);
    /* Drawn INSIDE the change: a plot sized while its module was hidden has
       no width, and the new picture is taken once this has run. */
    if(id === "m-experiment" || id === "m-fridge") redrawOpen();
    const open = $("#" + id);
    if(open) followDown(open);
  }, () => arrive($("#" + id), dir === "back" ? "calc(var(--travel) * -1)" : "var(--travel)", "X"));
}

function home(pop){
  /* the history steps back too, so the browser's back and this agree; the
     page animates this one itself and lets that step pass */
  if(!pop && history.state && history.state.rv){
    NAV.ignorePop++;
    clearTimeout(NAV.t); NAV.t = setTimeout(() => { NAV.ignorePop = 0; }, 1000);
    history.go(-(history.state.d || 1));
  }
  navDepth = 0;
  const back = pressedRow;
  change(viewKind("back"), () => {
    route = null;
    applyRoute();
    window.scrollTo(0, 0);
    if(lastSnap) renderHome(lastSnap);
    /* Coming back on a wide screen reveals every module at once, and the
       plots in them have not been drawn at this width since they were
       hidden. */
    if(wide()) redrawOpen();
  }, () => arrive(wide() ? null : $("#home"), "calc(var(--travel) * -1)", "X"));
  homeLetGo(back);
}
/* ...and the row that was opened is still washed as the list comes in,
   then lets go (the wash's own 250 ms fade), so the reader sees where they
   have come back to. */
function homeLetGo(back){
  if(back) setTimeout(() => {
    if(pressedRow !== back) return;
    pressedRow = null;
    if(lastSnap) renderHome(lastSnap);
  }, 260);
}

/* A refresh that fails keeps what is on screen and says why beside its age,
   rather than blanking the state it last knew. */
function trouble(why){
  fetchTrouble = why;
  if(sealT == null) $("#head").innerHTML = '<span class="stale">' + esc(why) + '.</span>';
  else tickAges();
}
let tickSeq = 0;
async function tick(force, pre){
  /* NOT UNDER A FINGER. A fresh push redraws the whole page, which cost a
     drag on the Scan Map two or three frames each time; it waits for the
     fingers to lift instead, and never longer than 8 s: a lost pointerup must
     not leave the page on an old reading. */
  /* nor under a page turn, which a redraw would cut short */
  if((SM.touching && performance.now() - SM.touchT < 8000) || slideNow){ clearTimeout(timer); timer = setTimeout(() => tick(force, pre), 250); return; }
  let blob, s;
  /* ONE REFRESH AT A TIME COUNTS: coming back to the tab asks at once while
     the timer a phone suspended fires too, and the older answer could be
     drawn over the newer one. */
  const seq = ++tickSeq;
  /* A refresh that did not arrive is tried again at the pace the run is
     going at, not dropped to the idle one: one lost request in the middle
     of a sweep used to cost ten seconds. */
  try { blob = pre || await fetchBlob(); }
  catch(e){
    if(seq !== tickSeq) return;
    trouble((DIRECT || onDirect) ? "Cannot reach the lab PC" : "Cannot reach GitHub");
    rearm(runActive); return; }
  if(seq !== tickSeq) return;
  fetchTrouble = "";
  /* THE SAME PUSH AGAIN. The page asks more often than the lab PC pushes, so
     most answers are the push already on screen: nothing to open, nothing to
     redraw. Only the ages move. */
  if(!force && blob.iv && blob.iv === lastIv){
    tickAges();
    rearm(runActive);
    return;
  }
  try { s = await open_(blob, key); }
  catch(e){
    /* THE SECRET WAS CHANGED UNDER AN OPEN PAGE: taking someone off seals
       everything after it under a new secret, and every other reader's page
       used to stop at "Cannot open the data" until it was reloaded. The
       reader's own slot in the new block opens it again, if they still have
       one. Tried once per push, so a reader who was taken off does not pay a
       key derivation every refresh. */
    if(cred && blob.iv !== rekeyTried){
      rekeyTried = blob.iv;
      try {
        const who = await openSlot(blob.slots, cred.n, cred.p);
        if(who && who.s){
          const k2 = await deriveKey(who.s, b64(blob.salt));
          s = await open_(blob, k2);
          key = k2;
          for(const id of Object.keys(frameCache)) delete frameCache[id];
          /* a remembered sign-in keeps the new data key, so the next visit
             opens at once again */
          let kept = false;
          try { kept = !!localStorage.getItem(STORE); } catch(e){}
          if(kept) keysGet().then(r => {
            if(!r) return;
            r.k = k2; r.salt = blob.salt;
            if(who.name) r.name = who.name;
            keysPut(r);
          });
        }
      } catch(e2){ s = undefined; }
    }
    if(seq !== tickSeq) return;
    if(!s){ trouble("Cannot open the data"); rearm(runActive); return; }
  }
  if(seq !== tickSeq) return;
  /* How long the last push took to follow the one before: a progress bar
     glides over that long, so it creeps on as the panel's does instead of
     jumping once a push. */
  const gap = (sealT != null && blob.t > sealT) ? blob.t - sealT : 0;
  document.documentElement.style.setProperty("--glide",
    (gap > 0 && gap <= 8) ? Math.round(gap * 1000) + "ms" : "220ms");
  document.documentElement.style.setProperty("--glide-ease",
    (gap > 0 && gap <= 8) ? "linear" : "cubic-bezier(.22,.61,.36,1)");
  lastIv = blob.iv;
  lastBlob = blob;
  sealT = blob.t || nowS();
  shownSilent = isSilent();
  runActive = !!((s.run || {}).live || (s.run || {}).active);
  rearm(runActive);

  /* The lab PC stamps every push. If that stamp stops moving, the app or the
     publisher has stopped and the numbers below are history. Say so plainly:
     a stale reading that looks live is the one dangerous failure of a page
     you check at 3 a.m. The pill carries the phrase, the age goes beside it,
     because a status pill in this app never carries a number. */
  const age = sinceSeal();
  const app = s.app || {};
  const cfgList = ((s.run || {}).config) || [];
  const sysRow = cfgList.find(e => e.key === "System");
  const system = (sysRow && sysRow.value) || app.system || "";
  const what = age > SILENT_S ? ["red", "Not reporting"]
             : app.running ? ["blue", "App running"]
                           : ["red", "App not running"];
  const pill = '<span class="pill ' + what[0] + '">' + what[1] +
               (system ? ' &middot; ' + esc(system) : '') + '</span>';
  morph($("#head"), pill + freshHTML());
  /* THE MAIN WINDOW'S SAFETIP NOTICE, word for word, while it is up there:
     the trip sentence with the run's name in bold. Only <b> survives from
     the app's markup. It goes when the trip is acknowledged in the app. */
  const st = s.safetip;
  $("#safetip").classList.toggle("hidden", !st);
  $("#safetip").innerHTML = st ? '<span class="stnotice">' +
    esc(st.text || "SafeTip triggered").replace(/&lt;(\/?)b&gt;/g, "<$1b>") +
    '</span>' : "";

  /* the lamps, in the panel's order and with the panel's own legends */
  const LEDS = [
    ["safetip", "SafeTip Guard", "error: SafeTip triggered.  off: clear"],
    ["poking",  "Poking",        "on: poking.  error: poke failed.  off: idle"],
    ["measuring", "Measuring",   "on: measuring.  off: idle"],
  ];
  const leds = (s.run || {}).leds || {};
  /* THE LAMPS THIS PANEL HAS. The run says so when its panel differs from
     the sweep panels' three; a key starting "?" is a lamp no file reports,
     so it stays grey and says why. */
  const set = Array.isArray((s.run || {}).led_set) ? (s.run || {}).led_set : LEDS;
  morph($("#leds"), set.map(([k, caption, tip]) =>
    '<span class="grp" title="' + esc(tip) + '">' +
    '<span class="led ' + esc(k.charAt(0) === "?" ? "off" : (leds[k] || "off")) +
    '"></span><span>' + esc(caption) + '</span></span>').join(""));

  const r = s.run || {};
  /* A NEW RUN STARTS CLEAN (the user, 2026-09-23): every Up/Down or Fwd/Bwd
     toggle back on its first pass and the plots back on page one, rather than
     carrying what was picked for the previous file. */
  if(r.file !== lastRunFile){
    if(lastRunFile !== undefined){
      for(const k of Object.keys(dirOf)) delete dirOf[k];
      for(const k of Object.keys(selFrame)) delete selFrame[k];
      mapViews.pop = null; mapViews.xy = null;
      $("#fpick").dataset.k = "";          // rebuilt with nothing picked
      page = 0; plotKey = "";
    }
    lastRunFile = r.file;
  }
  /* Whether this is happening NOW or is the last thing that did, and which
     experiment it is, off to the right. */
  $("#runhead").textContent = (r.active && !isSilent()) ? "Experiment in progress"
                                                         : "Last Experiment";
  $("#runwhat").textContent = r.experiment || "";
  /* The bars live in the run-info grid now, beside the rate that belongs to
     each (renderRuntime). This block is kept only for a payload published by
     an older build, which has bars and no grid. */
  /* Poke on Path carries its bar over its map, as its panel does. */
  const B = ((r.runtime || []).length || (r.map && (r.map.pop || r.map.kind === "approach")))
            ? null : r.bars;
  morph($("#bars"), !B ? "" :
    [["Total", B.total], ["Line", B.line]]
      .filter(([, b]) => Array.isArray(b))
      .map(([name, [v, mx]]) =>
        barHTML(mx ? v/mx : 0, name + '&nbsp;&nbsp;' + v + ' / ' + mx)).join(""));
  if(!r.file){}
  else{
    const m = r.map;
    $("#fpick").classList.toggle("hidden", !(m && m.kind === "frames"));
    if(m) m.bwd = !/raster/i.test(r.scan_mode || "")
                  && !/^forward$/i.test(r.direction || "");
    if(m && m.kind === "curves"){
      $("#plots").classList.remove("hidden");
      $("#legacy").classList.add("hidden");
      $("#plots").style.flexWrap = "";
      $("#plots").style.flexDirection = "";
      $("#plots").style.alignItems = "";
      lastMap = m;
      renderCurves(m);
    } else if(m && m.kind === "records"){
      /* a run that is a list of what happened, not a grid of what was measured */
      $("#plots").classList.remove("hidden");
      $("#legacy").classList.add("hidden");
      lastMap = m;
      renderRecords(m);
    } else if(m && m.kind === "approach"){
      /* the Approach panel's two halves */
      $("#plots").classList.remove("hidden");
      $("#legacy").classList.add("hidden");
      m._leds = r.leds || {};
      lastMap = m;
      renderApproach(m);
    } else if(m && m.kind === "frames"){
      /* a frame run: the reader picks which frame each column shows */
      $("#plots").classList.remove("hidden");
      $("#legacy").classList.add("hidden");
      $("#plots").style.flexWrap = "";
      $("#plots").style.flexDirection = "";
      $("#plots").style.alignItems = "";
      lastMap = m;
      renderFrames(m);
    } else if(m && (m.channels || []).length){
      $("#plots").classList.remove("hidden");
      $("#legacy").classList.add("hidden");
      $("#plots").style.flexWrap = "";
      $("#plots").style.flexDirection = "";
      $("#plots").style.alignItems = "";
      lastMap = m;
      renderPlots(m);
    } else {
      /* not a 2D sweep: keep the one picked column */
      $("#plots").classList.add("hidden");
      $("#legacy").classList.remove("hidden");
      lastMap = null;
      const cols = r.columns || [];
      if(cols.join("|") !== lastCols){
        lastCols = cols.join("|");
        $("#col").innerHTML = cols.map((c,i) => '<option value="'+i+'">'+esc(c)+'</option>').join("");
        chosen = Math.min(cols.length-1, cols[0] && cols[0].toLowerCase()==="index" ? 3 : 1);
        $("#col").value = chosen;
      }
      draw(r.trace || [], chosen == null ? 1 : chosen);
    }
  }

  /* THE RUN'S OWN HEADER, section by section, exactly as written. Nothing
     here is re-worded: the page shows what the .dat says. */
  const cfg = ((s.run || {}).config) || [];
  let seen = null, chtml = "", open = false;
  for(const e of cfg){
    if(e.section !== seen){
      if(open){ chtml += '</div></div>'; open = false; }
      seen = e.section;
      if(seen){
        const isOpen = cfgOpen.has(seen);
        chtml += '<div class="sec' + (isOpen ? ' open' : '') +
          '" data-sec="' + esc(seen) + '">' +
          '<svg viewBox="0 0 24 24"><path d="M8.3 4.8 L15.7 12 L8.3 19.2"/></svg>' +
          esc(seen) + '</div><div class="body' + (isOpen ? '' : ' shut') + '"><div class="in">';
        open = true;
      }
    }
    chtml += row(esc(e.key), esc(e.value));
  }
  if(open) chtml += '</div></div>';
  /* In place, so a section opening under the reader's finger keeps its
     element and finishes its animation; the clicks are the host's. */
  morph($("#cfg"), chtml);

  const f = s.fridge || {};
  if(!f.available){
    morph($("#fridge"), row("No environment log", "not on this system"));
    morph($("#fridgeage"), "");
  }
  else{
    const L = f.latest || {};
    /* Every number the log has, as the main window's Live Parameters shows
       its own. The cell pressure is Gauge 1 in mbar there, so here too; the
       other gauges keep the Torr of their trend plots below. */
    const g1 = _real(L.gauge1_torr) ? L.gauge1_torr * 1.33322368 : null;
    const M = f.moving || {};
    let html = '<div class="readings">' +
               reading("Temperature", fmtKelvin(L.temperature_k), M.temperature_k, "Warming", "Cooling") +
               reading("He Cell Pressure", fmtPressure(g1, "mbar"), M.gauge1_torr) +
               reading("Gauge 2", fmtPressure(L.gauge2_torr, "Torr"), M.gauge2_torr) +
               reading("Gauge 23", fmtPressure(L.gauge23_torr, "Torr"), M.gauge23_torr) +
               reading("Turbo", fmtPlain(L.turbo_pct, "%"), M.turbo_pct) +
               reading("Flow", fmtPlain(L.mfc_flow, "sccm"), M.mfc_flow) + '</div>';
    morph($("#fridge"), html);
    /* The sample's age, small, at the right of the section's heading (the
       user). Counted on between pushes: the sample does not get younger
       because nothing new has been pushed since; past two minutes it turns
       the stale red, which is how a log that has stopped says so, once. */
    morph($("#fridgeage"), "Last sample " + agoSpan(f.age_s, 120, false));
  }
  renderTrends(f);
  renderScanMap(s.scanmap);

  renderLog((s.log || {}).lines || []);

  renderRuntime((s.run || {}).runtime || []);

  renderAccount(s);
  renderFoot(s.footer);
  renderInsts(s.insts);
  renderXlog(s.explog);
  renderEvents(s.events);

  /* and the rows on the front panel, which is on screen only when narrow */
  lastSnap = s;
  renderHome(s);
  applyRoute();
}
/* forced: the data has not changed, the column asked for has */
$("#col").addEventListener("change", e => { chosen = +e.target.value; tick(true); });
try { history.replaceState({rv: null, d: 0}, ""); } catch(e){}
window.addEventListener("popstate", e => {
  if(NAV.ignorePop){ NAV.ignorePop--; return; }
  if($("#app").classList.contains("hidden")) return;
  const st = e.state || {}, r = st.rv || null, d = st.d || 0;
  if(r === route){ navDepth = d; return; }
  /* the browser has shown its own; on an iPhone the swipe always does, and
     its answer to hasUAVisualTransition cannot be relied on, so never twice */
  if(e.hasUAVisualTransition === true || NAV_IOS) vtSkip = true;
  const back = d < navDepth;
  navDepth = d;
  if(r && ROUTABLE().includes(r)) go(r, true, back ? "back" : "forward");
  else home(true);
});

/* NO SWIPE OF THE PAGE'S OWN. The iPhone already goes back with a swipe from
   the left edge, in a browser tab and opened from the home screen alike,
   now that a module page is in the history; a second swipe drawn by the
   page gave two gestures at once (the user, 2026-09-30: "有两种右滑动手势？
   这样很不好"). What stays the page's is only not animating again what the
   browser has just animated: on an iPhone a back through the history is
   made bare, whether a swipe or the back button brought it (its WebKit
   cannot be relied on to say which). */
const NAV = {ignorePop: 0, t: 0};
const NAV_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

$("#home").addEventListener("click", ev => {
  const b = ev.target.closest(".modrow");
  if(!b) return;
  /* the row keeps its pressed wash while its module is open (renderHome) */
  pressedRow = b.dataset.go;
  b.classList.add("pressed");
  go(b.dataset.go);
});
/* Safari on an iPhone shows no :active state unless something on the page
   listens for touches. The page's own tap flash is switched off (it is not
   the app's), so without this a tap there gave no feedback at all. */
document.addEventListener("touchstart", () => {}, {passive: true});
wireSections($("#cfg"), cfgOpen, "sec");
wireSections($("#xlog"), xlogOpen, "x");
/* PagedStrip's turn (change("page-next" / "page-prev")): the page going out
   and the page coming in side by side, a page width apart, travelling
   together for 260 ms. It used to slide out, redraw, and only then slide in,
   which dipped through half a page of nothing in the middle. Without view
   transitions the plots are redrawn under a dissolve instead. */
/* (2026-09-30) The Experiment's columns turn by hand too, as the trends do
   (slideTurn): as a view transition the top of the screen flashed white on
   the iPhone for the whole turn, the page being scrolled down to the plots,
   which is WebKit drawing the transition's pictures in the wrong place. */
function repage(step){
  if(!lastMap) return;
  slideTurn($("#plots"), step,
            () => { page = Math.max(0, page + step); renderAny(lastMap); }, "*:not(.hidden)");
}
$("#backbar").addEventListener("click", () => home());
$("#gouser").addEventListener("click", () => go("m-account"));
$("#themeseg").querySelectorAll("button").forEach(b => {
  b.addEventListener("click", () => setTheme(b.dataset.mode));
});
/* "Follow system" has to keep following it. */
if(window.matchMedia){
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const onChange = () => { if(themeMode() === "system") applyTheme("system"); };
  mq.addEventListener ? mq.addEventListener("change", onChange)
                      : mq.addListener(onChange);
}
applyTheme(themeMode());
/* THE SERVICE WORKER (sw.js): what lets the page live on a phone's home
   screen and open with its last state when there is no signal. Registered
   after the page has loaded, so it never competes with the first paint, and
   only where the browser allows one (https, or this machine). */
if("serviceWorker" in navigator && window.isSecureContext){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
$("#pprev").addEventListener("click", () => repage(-1));
$("#pnext").addEventListener("click", () => repage(+1));
/* THE FRIDGE'S TRENDS TURN BY HAND (2026-09-29). The user, on an iPhone:
   the plots "jump" as the page turns. Every iPhone browser, Chrome too, is
   WebKit, and WebKit draws a view transition's pictures at the wrong height
   once the page is scrolled, which it always is at the trends (they sit
   under the fridge's rows). Filmed in WebKit: for the whole slide the rows
   above went blank, the top of the plot was covered and the pager showed
   through it, and at the end everything jumped back into place. So this
   turn is made of the page itself, the way the app's PagedStrip is: the page
   being left is copied (its canvases pixel for pixel) into a layer over the
   grid, the new page is drawn underneath, and the two travel together a
   page width and a gap apart, clipped to the box, in the same 260 ms on the
   same curve. Nothing is photographed, so nothing can come back in the
   wrong place. */
let slideNow = null;           // the turn that is moving: {done}
/* `sel`: which of the box's children are the page (the trends' plots by
   default, the Experiment's columns); the copy is laid out the way the box
   lays them out (a grid, or a row), every canvas in them copied */
function slideTurn(host, step, turn, sel){
  if(slideNow) slideNow.done();                 // a second tap lands the first
  if(!motionOK() || document.hidden || !host.offsetWidth){ turn(); return; }
  const css = getComputedStyle(document.documentElement);
  const ms = parseFloat(css.getPropertyValue("--t-page")) || 260;
  const ease = css.getPropertyValue("--ease-io").trim() || "cubic-bezier(.4,0,.2,1)";
  const gap = parseFloat(css.getPropertyValue("--page-gap")) || 12;
  const pick = ":scope > " + (sel || ".trend:not(.hidden)");
  const ghost = document.createElement("div"), hs = getComputedStyle(host);
  ghost.className = "tghost";
  ghost.setAttribute("aria-hidden", "true");
  for(const k of ["display", "gridTemplateColumns", "flexDirection", "flexWrap", "justifyContent", "alignItems"])
    ghost.style[k] = hs[k];
  for(const el of host.querySelectorAll(pick)){
    const c = el.cloneNode(true), from = el.querySelectorAll("canvas"), to = c.querySelectorAll("canvas");
    c.removeAttribute("id"); c.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));   // one of each on the page
    from.forEach((f, i) => {
      const t = to[i];
      if(!t || !f.width || !f.height) return;
      t.width = f.width; t.height = f.height;
      try { t.getContext("2d").drawImage(f, 0, 0); } catch(e){}
    });
    ghost.appendChild(c);
  }
  turn();
  host.classList.add("sliding");
  host.appendChild(ghost);
  const dx = host.clientWidth + gap, way = step > 0 ? -1 : 1;
  const opts = {duration: ms, easing: ease, fill: "both"};
  const anims = [ghost.animate([{transform: "translateX(0)"},
                                {transform: "translateX(" + (way * dx) + "px)"}], opts)];
  for(const el of host.querySelectorAll(pick))
    if(el !== ghost) anims.push(el.animate([{transform: "translateX(" + (-way * dx) + "px)"},
                           {transform: "translateX(0)"}], opts));
  const me = {done(){
    if(slideNow !== me) return;
    slideNow = null;
    anims.forEach(a => { try { a.cancel(); } catch(e){} });
    ghost.remove();
    host.classList.remove("sliding");
  }};
  slideNow = me;
  anims[0].finished.then(() => me.done(), () => me.done());
}
function trepage(step){
  if(!lastSnap) return;
  slideTurn($("#trends"), step,
            () => { trendPage = Math.max(0, trendPage + step); renderTrends(lastSnap.fridge); });
}
$("#tprev").addEventListener("click", () => trepage(-1));
$("#tnext").addEventListener("click", () => trepage(+1));

/* A remembered sign-in makes this a page you glance at, not one you log
   into. It lives in this browser only and never leaves it (KEYDB). */
(async function(){
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch(e){}
  let mark = null;
  try { mark = saved ? JSON.parse(saved) : null; } catch(e){ mark = null; }
  /* A remembered sign-in that does not open anything puts the card back. */
  const showCard = () => { delete document.documentElement.dataset.auto; };
  const forget = () => { try { localStorage.removeItem(STORE); } catch(e){} };
  if(mark && mark.n && mark.p){
    /* THE OLD WAY, the passphrase itself: used this once, and unlock()
       replaces it with the keys (and the marker without it). */
    /* (Not forgotten when it does not open: no signal fails the same way,
       and a blip must not cost anyone their remembered sign-in.) */
    $("#netid").value = mark.n;
    unlock(mark.n, mark.p, true).then(okk => { if(!okk) showCard(); }, showCard);
  } else if(mark && mark.n){
    const rec = await keysGet();
    if(rec && rec.base && rec.n){
      $("#netid").value = rec.n;
      unlock(rec.n, null, true, rec).then(okk => { if(!okk) showCard(); }, showCard);
    } else {
      forget();
      showCard();
    }
  } else {
    if(saved) forget();
    showCard();
  }
})();
/* Coming back to the tab after a while should not show a stale number. */
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && key){ clearTimeout(timer); tick(); }
});
/* A canvas holds pixels, not a layout: turning the phone or changing its text
   size changes the CSS width underneath it and the drawing has to be redone. */
let resizeWait = null, resizeW = window.innerWidth;
window.addEventListener("resize", () => {
  clearTimeout(resizeWait);
  resizeWait = setTimeout(() => {
    /* ONLY A NEW WIDTH REDRAWS. A phone's toolbar showing and hiding as the
       page scrolls changes the height alone, and redrew every plot each time. */
    if(window.innerWidth === resizeW) return;
    resizeW = window.innerWidth;
    /* WIDENING PUTS THE MONITORING BACK. A module was opened on its own only
       because there was no room for the rest; once there is, showing one of
       five in a thousand pixels is worse than showing all five. The account
       page is different: it was asked for, so widening leaves it alone. */
    if(wide() && route !== null && EXTRA.indexOf(route) === -1){
      route = null;
      pressedRow = null;          // no list to come back to: nothing to let go of
    }
    /* Crossing the breakpoint changes WHICH sections exist on screen, and a
       plot in one that has just appeared has never been drawn at this size. */
    applyRoute();
    if(lastSnap){ renderHome(lastSnap); renderTrends(lastSnap.fridge); }
    if(!lastMap) return;
    renderAny(lastMap);
  }, 150);
});
