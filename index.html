                    '(Safari 16.4 or Chrome 80 and up).</span>'; return false; }
  if(!String(netid || "").trim() || !pass){
    msg.innerHTML = '<span class="stale">Enter your NetID and passphrase.</span>'; return false; }
  msg.textContent = "Signing in\u2026";
  let blob;
  try { blob = await fetchBlob(); }
  catch(e){ msg.innerHTML = '<span class="stale">Cannot reach the data file (' +
            e.message + ').</span>'; return false; }
  if(blob.v !== FORMAT){
    msg.innerHTML = '<span class="stale">This page is out of step with the lab PC ' +
                    '(file v' + blob.v + ', page v' + FORMAT + ').</span>'; return false; }
  let k, who;
  try {
    who = await openSlot(blob.slots, netid, pass);
    if(!who || !who.s) throw new Error("no slot");
    k = await deriveKey(who.s, b64(blob.salt));
    await open_(blob, k);
  } catch(e){
    msg.innerHTML = '<span class="stale">NetID or passphrase is not right.</span>'; return false; }
  const secret = who.s;
  msg.textContent = "";
  key = k;
  cred = {n: String(netid).trim(), p: pass};
  /* The name and the icons, opened with the key just derived. A failure here
     must not keep the page shut: an unnamed page that works beats a named
     page that does not, so this is allowed to do nothing. */
  try {
    if(BRAND && BRAND.ct){
      /* Normally sealed with the same salt as the snapshot, so the key just
         derived opens it and nothing extra runs. Only a mismatch pays for a
         second derivation, and that is the case that used to fail. */
      const bk = (BRAND.salt === blob.salt) ? k
                                            : await deriveKey(secret, b64(BRAND.salt));
      const b = await open_(BRAND, bk);
      /* The name is the PERSON's, from their own slot, not the page's. */
      if(who.name) b.user = who.name;
      b.netid = who.netid || String(netid).trim().toLowerCase();
      BRAND_OPEN = b;
      /* the first name only (the user, 2026-09-23) */
      if(b.user) $("#welcome").textContent =
        "Welcome, " + String(b.user).trim().split(/\s+/)[0] + "!";
      if(b.tab) document.title = b.tab;
      if(b.title) $("#brandtitle").textContent = b.title;
      if(b.logo_day) $("#logoday").src = b.logo_day;
      if(b.logo_night) $("#logonight").src = b.logo_night;
    }
  } catch(e){ /* stay anonymous */ }
  try { remember ? localStorage.setItem(STORE, JSON.stringify({n: String(netid).trim(), p: pass}))
                 : localStorage.removeItem(STORE); }
  catch(e){ /* private mode: just do not remember */ }
  /* DRAWN, THEN SHOWN. The page used to appear as an empty frame that the
     first refresh then filled in. It is laid out invisibly instead (a hidden
     canvas has no width, so it cannot be drawn while display:none), filled
     from the block just opened, and then comes in the way a tab does. */
  const appEl = $("#app");
  appEl.style.transition = "none";
  appEl.style.opacity = "0";
  $("#lock").classList.add("hidden");
  appEl.classList.remove("hidden");
  try { await tick(true, blob); } catch(e){ /* the next refresh will try again */ }
  delete document.documentElement.dataset.auto;
  arrive(appEl, "var(--travel)");
  setTimeout(() => { appEl.style.transition = appEl.style.transform =
                     appEl.style.opacity = ""; }, 400);
  return true;
}

$("#lockform").addEventListener("submit", async e => {
  e.preventDefault();
  $("#go").disabled = true;
  try { await unlock($("#netid").value, $("#pass").value, $("#remember").checked); }
  finally { $("#go").disabled = false; }
});
$("#peek").addEventListener("click", () => {
  const p = $("#pass"), show = p.type === "password";
  p.type = show ? "text" : "password";
  $("#peek").classList.toggle("on", show);
});

/* ---------- the page ---------------------------------------------------- */
function secs(s){ if(s==null) return "-";
  s = Math.round(s); if(s < 60) return s + " s";
  const m = Math.floor(s/60); if(m < 60) return m + " min " + (s%60) + " s";
  return Math.floor(m/60) + " h " + (m%60) + " min"; }
const esc = t => String(t).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
/* A missing value is a dash and nothing else: "- sccm" reads as a reading. */
function row(k, v, unit){ return '<div class="row"><span class="k">' + k +
  '</span><span class="v">' + v +
  (unit && v !== "-" ? ' <span class="u">' + unit + '</span>' : '') +
  '</span></div>'; }
/* A reading the log has not got, drawn as the app draws a missing value. */
const num = v => (v === null || v === undefined || v !== v) ? "-" : v;

function draw(trace, idx){
  const c = $("#plot"), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  c.width = w*dpr; c.height = h*dpr;
  const g = c.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0,0,w,h);
  const css = getComputedStyle(document.documentElement);
  const frame = css.getPropertyValue("--frame").trim();
  const well = css.getPropertyValue("--well").trim();
  const ys = trace.map(r => r[idx]).filter(v => typeof v === "number");
  if(well && well !== "transparent"){ g.fillStyle = well; g.fillRect(0, 0, w, h); }
  /* The app frames a plot on all four sides in PLOT_FRAME_COLOR, 1 px. */
  g.strokeStyle = frame; g.lineWidth = 1;
  g.strokeRect(0.5, 0.5, w-1, h-1);
  if(ys.length < 2){
    g.fillStyle = css.getPropertyValue("--muted").trim();
    g.font = '12px "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif';
    g.fillText("no numeric data in this column", 8, 20); return; }
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if(hi === lo){ hi = lo + 1e-12; }
  const pad = (hi-lo)*0.08; lo -= pad; hi += pad;
  const m = 1;
  g.strokeStyle = css.getPropertyValue("--line").trim(); g.lineWidth = 1.6;
  g.beginPath();
  ys.forEach((v,i) => { const x = m + i/(ys.length-1)*(w-2*m),
                        y = (h-m) - (v-lo)/(hi-lo)*(h-2*m);
    i ? g.lineTo(x,y) : g.moveTo(x,y); });
  g.stroke();
  g.fillStyle = css.getPropertyValue("--muted").trim();
  g.font = '11px "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,sans-serif';
  g.fillText(hi.toPrecision(4), 5, 13); g.fillText(lo.toPrecision(4), 5, h-6);
}

/* ---------- the Point 2D plots ------------------------------------------ */
/* ColorMapWidget.DEFAULT_CMAP is "RdBu_r", and the app resolves it from these
   eleven ColorBrewer stops rather than from matplotlib. Interpolated linearly
   to 256 rows, which is what _interp_colors does, so the page and the panel
   put the same colour on the same number. */
/* ONE PALETTE PER PANEL, because the panels do not all use the same one:
   ColorMapWidget defaults to RdBu_r, but the Frame 2D panel sets "Blues" on
   both of its maps. The Blues stops are sampled from the app's own resolved
   colormap at the same eleven positions. */
const CMAPS = {
  "RdBu_r": ["#053061","#2166ac","#4393c3","#92c5de","#d1e5f0","#f7f7f7",
             "#fddbc7","#f4a582","#d6604d","#b2182b","#67001f"],
  "Blues":  ["#f7fbff","#e3eef9","#d0e1f2","#b7d4ea","#94c4df","#6caed6",
             "#4a98c9","#2f7fbc","#1764ab","#084b93","#08306b"],
  /* matplotlib viridis: what the Line 1D sweep's colour maps are built with,
     read off the panel itself (chk_export_grid). */
  "viridis":["#440154","#482475","#414487","#355f8d","#2a788e","#21918c",
             "#22a884","#44bf70","#7ad151","#bddf26","#fde725"],
  /* matplotlib magma at the same eleven stops: what the I-V mapper builds its
     colour maps with (UI_universal_IV_mapper._cm, cmap="magma"). */
  "magma":  ["#000004","#140e36","#3b0f70","#641a80","#8c2981","#b73779",
             "#de4968","#f7705c","#fe9f6d","#fecf92","#fcfdbf"],
  /* The rest of the I-V mapper's six (Thermal inferno; the analysis maps
     cividis, plasma), matplotlib at the same eleven stops. */
  "inferno":["#000004","#160b39","#420a68","#6a176e","#932667","#bc3754",
             "#dd513a","#f37819","#fca50a","#f6d746","#fcffa4"],
  "cividis":["#00224e","#083370","#35456c","#4f576c","#666970","#7d7c78",
             "#948e77","#aea371","#c8b866","#e5cf52","#fee838"],
  "plasma": ["#0d0887","#41049d","#6a00a8","#8f0da4","#b12a90","#cc4778",
             "#e16462","#f2844b","#fca636","#fcce25","#f0f921"],
};
const _luts = {};
function lutOf(name){
  const key = CMAPS[name] ? name : "RdBu_r";
  if(!_luts[key]){
    const stop = CMAPS[key].map(h => [parseInt(h.slice(1,3),16),
                                      parseInt(h.slice(3,5),16),
                                      parseInt(h.slice(5,7),16)]);
    const out = new Uint8Array(256*3), m = stop.length - 1;
    for(let i=0;i<256;i++){
      const x = i/255*m, k = Math.min(m-1, Math.floor(x)), t = x - k;
      for(let c=0;c<3;c++) out[i*3+c] = Math.round(stop[k][c]*(1-t) + stop[k+1][c]*t);
    }
    _luts[key] = out;
  }
  return _luts[key];
}
/* The palette the map on screen is drawn in; set from the run's own map. */
let LUT = lutOf("RdBu_r");

/* SI, THE WAY THE PANEL DOES IT. Both plot axes have enableAutoSIPrefix on, so
   pyqtgraph takes ONE prefix for the whole axis from the larger end of its
   range and moves it into the caption: a 0 to 0.1 V axis reads 0 to 100 with
   "(mV)" underneath. The colorbar is the other form, siFormat per value, which
   is why its two ends can read "5.241u" and "155.5n". */
const SI_PRE = ["y","z","a","f","p","n","\u00b5","m","","k","M","G","T","P","E","Z","Y"];
function siScale(maxAbs){
  if(!isFinite(maxAbs) || maxAbs === 0) return {scale:1, pre:""};
  let m = Math.floor(Math.log10(Math.abs(maxAbs))/3);
  m = Math.min(8, Math.max(-8, m));
  return {scale: Math.pow(1000, -m), pre: SI_PRE[m+8]};
}
function siFormat(v, prec){
  if(v == null || v !== v) return "-";
  const s = siScale(v);
  return trimNum(v*s.scale, prec || 4) + s.pre;
}
/* A value and its unit, with the SI prefix moved onto the UNIT, which is
   where an axis caption puts it: 0.058 V reads "58" and "mV", never "58m V". */
function siPair(v, unit){
  if(v == null || v !== v) return {v:"-", u:unit || ""};
  const ub = unitBase(unit);
  const s = siScale(v * ub.f);
  return {v: trimNum(v * ub.f * s.scale, 4), u: s.pre + ub.base};
}
function trimNum(v, prec){
  if(v === 0) return "0";
  const t = parseFloat(v.toPrecision(prec));
  return Math.abs(t) >= 1e5 || Math.abs(t) < 1e-4 ? t.toExponential(2) : String(t);
}
function ticksOf(lo, hi, target){
  const span = Math.abs(hi - lo);
  if(!(span > 0)) return [lo];
  const raw = span / Math.max(2, target);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const out = [];
  const a = Math.min(lo, hi), b = Math.max(lo, hi);
  /* Stepped by MULTIPLYING, not by adding: adding accumulates and the last
     value drifts past the end of the range, which is how a tick ended up on
     the wrong side of the frame. */
  const first = Math.ceil(a/step - 1e-9);
  const last = Math.floor(b/step + 1e-9);
  for(let k = first; k <= last; k++){
    const v = k * step;
    out.push(Math.abs(v) < step*1e-9 ? 0 : v);
  }
  return out.length ? out : [lo, hi];
}
/* An axis caption is "name (unit)", which is what setLabel(text=, units=)
   renders, with the SI prefix folded into the unit as pyqtgraph folds it. */
/* A UNIT THAT ALREADY CARRIES A PREFIX IS NOT A BASE UNIT. Z stepper is
   recorded in µm, so an axis of it running to -1740 was being given a second
   prefix and captioned "kµm", which is not a unit anybody writes. The value
   is folded back to its base first (-1740 µm is -1.74e-3 m) and the prefix is
   then chosen once, which is how the panel's axes read: -1.74 mm.

   The remainder has to be a unit we KNOW, or "Torr" would be read as tera-orr
   and "sccm" as something with an s in front. */
const SI_FACTOR = {y:1e-24, z:1e-21, a:1e-18, f:1e-15, p:1e-12, n:1e-9,
                   "µ":1e-6, u:1e-6, m:1e-3, c:1e-2, k:1e3, M:1e6,
                   G:1e9, T:1e12, P:1e15};
const SI_BASE = ["m","V","A","Hz","s","T","W","F","J","K","N","Pa","g",
                 "bar","ohm","Ohm","Ω","eV","rad"];
function unitBase(unit){
  const u = String(unit || "");
  if(!u || u.includes("/") || u.includes("^")) return {f:1, base:u};
  if(SI_BASE.includes(u)) return {f:1, base:u};
  const head = u[0], rest = u.slice(1);
  if(rest && SI_BASE.includes(rest) && SI_FACTOR[head] !== undefined){
    return {f: SI_FACTOR[head], base: rest};
  }
  return {f:1, base:u};
}
/* A canvas draws a string, not markup: the panel's display names carry
   <i> and <sub> for the physics symbols, which the browser lays out in the
   page's own headings but a canvas would print as angle brackets. */
function plainText(html){
  return String(html == null ? "" : html)
    .replace(/<sub>(.*?)<\/sub>/gi, "$1")
    .replace(/<sup>(.*?)<\/sup>/gi, "$1")
    .replace(/<[^>]+>/g, "")
    .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
}
const axisText = (name, unit, pre) => {
  const u = unitBase(unit).base;
  return plainText(name) + ((u || pre) ? " (" + (pre||"") + u + ")" : "");
};

/* MARG.t carries the plot TITLE: the panel calls set_title(channel) on the
   colour map AND on the line plot, so each one is captioned in its own right,
   above the column header they share. */
/* The title and the y caption sit closer to the frame than they did: the top
   band is the title's line height plus a little, not twice it. */
const MARG = {l:56, r:94, t:26, b:34};
/* The colorbar group, measured off the panel and laid out from the canvas
   edge inwards: the z label, the gradient bar, a gap, the histogram's box. */
const CB = {zlab:24, bar:18, gap:3, hist:28, inset:0.13};
/* THE PAGE'S OWN FACE, for the canvas too. The body is set in this list; a
   plot that asked only for '"Segoe UI",sans-serif' fell through to the
   GENERIC sans on any machine without Segoe UI -- every phone -- and drew its
   axes in a different font from the text beside them. */
const FACE = '"Helvetica Neue",Helvetica,Arial,sans-serif';
const TICK_FONT  = '10.7px ' + FACE;                 /* AxisItem tick, 8 pt   */
const LABEL_FONT = '12px ' + FACE;                   /* LABEL_FONT_PT 9       */
const TICK_LEN = 4;                                  /* the marks on a spine  */

function lineColour(i){
  return getComputedStyle(document.documentElement)
           .getPropertyValue("--l" + (i % 6)).trim();
}

function setup(cv, title){
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  const css = getComputedStyle(document.documentElement);
  const well = css.getPropertyValue("--well").trim();
  if(well && well !== "transparent"){ g.fillStyle = well;
    g.fillRect(MARG.l, MARG.t, w-MARG.l-MARG.r, h-MARG.t-MARG.b); }
  if(title){
    g.font = LABEL_FONT; g.textAlign = "center"; g.textBaseline = "alphabetic";
    g.fillStyle = css.getPropertyValue("--ink").trim();
    g.fillText(plainText(title), MARG.l + (w-MARG.l-MARG.r)/2, 18);
  }
  g.font = TICK_FONT;
  return {g, w, h, css, iw: w-MARG.l-MARG.r, ih: h-MARG.t-MARG.b};
}

/* The data area, as a clip. Everything a plot DRAWS lives inside it; the
   axes and the colorbar are drawn after it is taken off. */
function clipData(g, w, h){
  g.save();
  g.beginPath();
  g.rect(MARG.l, MARG.t, w - MARG.l - MARG.r, h - MARG.t - MARG.b);
  g.clip();
}

function frame(g, w, h, css){
  g.strokeStyle = css.getPropertyValue("--frame").trim(); g.lineWidth = 1;
  g.strokeRect(MARG.l + 0.5, MARG.t + 0.5, w-MARG.l-MARG.r-1, h-MARG.t-MARG.b-1);
}

function xAxis(g, css, w, h, lo, hi, name, unit){
  const uf = unitBase(unit).f;
  lo *= uf; hi *= uf;
  const si = siScale(Math.max(Math.abs(lo), Math.abs(hi)));
  /* AXIS TYPE IS BLACK. Only the frame and the ticks are grey: the panel inks
     its tick labels and axis captions with the body colour (setTextPen takes
     the ink, setPen the frame), and grey type on a plot reads as disabled. */
  const ink = css.getPropertyValue("--ink").trim();
  const fr  = css.getPropertyValue("--frame").trim();
  const y0 = h - MARG.b;
  g.fillStyle = ink; g.strokeStyle = fr; g.lineWidth = 1;
  g.textAlign = "center"; g.textBaseline = "top";
  const iw = w - MARG.l - MARG.r;
  ticksOf(lo, hi, 5).forEach(v => {
    const x = MARG.l + (hi === lo ? iw/2 : (v-lo)/(hi-lo)*iw);
    if(x < MARG.l - 0.25 || x > w - MARG.r + 0.25) return;
    g.beginPath(); g.moveTo(Math.round(x)+0.5, y0-0.5);
    g.lineTo(Math.round(x)+0.5, y0-0.5-TICK_LEN); g.stroke();
    /* A label centred on a tick at the right edge hung half past the frame
       (the user, 2026-09-23); that one is pulled in to end on the frame. */
    const txt = trimNum(v*si.scale, 4), right = w - MARG.r;
    if(x + g.measureText(txt).width/2 > right){
      g.textAlign = "right"; g.fillText(txt, right, y0+3); g.textAlign = "center";
    } else {
      g.fillText(txt, x, y0+3);
    }
  });
  if(name){ g.font = LABEL_FONT;
    g.fillText(axisText(name, unit, si.pre), MARG.l + (w-MARG.l-MARG.r)/2, y0+15);
    g.font = TICK_FONT; }
}

function yAxis(g, css, w, h, lo, hi, name, unit){
  const uf = unitBase(unit).f;
  lo *= uf; hi *= uf;
  const si = siScale(Math.max(Math.abs(lo), Math.abs(hi)));
  const ink = css.getPropertyValue("--ink").trim();
  const fr  = css.getPropertyValue("--frame").trim();
  g.fillStyle = ink; g.strokeStyle = fr; g.lineWidth = 1;
  g.textAlign = "right"; g.textBaseline = "middle";
  const ih = h - MARG.t - MARG.b;
  ticksOf(lo, hi, 5).forEach(v => {
    const y = (h-MARG.b) - (hi === lo ? ih/2 : (v-lo)/(hi-lo)*ih);
    if(y < MARG.t - 0.25 || y > h - MARG.b + 0.25) return;
    g.beginPath(); g.moveTo(MARG.l+0.5, Math.round(y)+0.5);
    g.lineTo(MARG.l+0.5+TICK_LEN, Math.round(y)+0.5); g.stroke();
    g.fillText(trimNum(v*si.scale, 4), MARG.l-6, y);
  });
  if(name){
    g.save(); g.translate(9, MARG.t + (h-MARG.t-MARG.b)/2); g.rotate(-Math.PI/2);
    g.font = LABEL_FONT; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(axisText(name, unit, si.pre), 0, 0);
    g.restore();
  }
}

function drawMap(cv, ch, m){
  const {g, w, h, css, iw, ih} = setup(cv, ch.title || ch.label);
  /* A channel may carry its own palette: the I-V mapper colours each of its
     six maps differently (magma, viridis, inferno, cividis, plasma). */
  const L = ch.cmap ? lutOf(ch.cmap) : LUT;
  const bytes = b64(ch.z), cols = m.cols, rows = m.rows;
  const img = g.createImageData(cols, rows);
  for(let r=0;r<rows;r++){
    /* row 0 is the slow axis START, and an axis runs upward, so the first row
       measured is drawn at the BOTTOM. */
    /* A scanner frame is the other way up: its first line is the TOP of the
       scan, so it is drawn at the top. */
    const src = (m.geom ? r : rows-1-r)*cols;
    for(let c=0;c<cols;c++){
      const v = bytes[src+c], o = (r*cols+c)*4;
      if(v === m.missing){ img.data[o+3] = 0; continue; }
      img.data[o]   = L[v*3];
      img.data[o+1] = L[v*3+1];
      img.data[o+2] = L[v*3+2];
      img.data[o+3] = 255;
    }
  }
  const off = document.createElement("canvas");
  off.width = cols; off.height = rows;
  off.getContext("2d").putImageData(img, 0, 0);
  g.imageSmoothingEnabled = false;      /* a measured point is a square */
  if(m.geom){
    /* PHYSICAL FRAMES: the frame at its centre, its size and the scan
       controller's angle (clockwise), in the X / Y window the axes are drawn
       over. (No instrument is named in this file: its source is public.) */
    const G = m.geom;
    const kx = iw / (m.fast.end - m.fast.start), ky = ih / (m.slow.end - m.slow.start);
    g.save();
    clipData(g, w, h);
    g.translate(MARG.l + (G.cx - m.fast.start)*kx, MARG.t + (m.slow.end - G.cy)*ky);
    g.rotate(G.angle * Math.PI / 180);
    g.drawImage(off, -G.w*kx/2, -G.h*ky/2, G.w*kx, G.h*ky);
    g.restore();
    g.restore();
  } else {
    g.drawImage(off, MARG.l, MARG.t, iw, ih);
  }

  /* THE COLORBAR is a HistogramLUTItem: the gradient, the histogram of the
     data lying against it, the two level values in siFormat, and the z label
     on its side. */
  /* Laid out from the canvas edge inwards, as the panel has it: the z label,
     the gradient bar spanning the plot's height, a gap, then the histogram in
     a box of its own, inset top and bottom so the bar runs past it. */
  const bx = w - CB.zlab - CB.bar, bw = CB.bar;
  const bTop = MARG.t, bH = ih;
  const hx = bx - CB.gap - CB.hist, hw = CB.hist;
  const hTop = bTop + bH*CB.inset, hH = bH*(1 - 2*CB.inset);
  const fr = css.getPropertyValue("--frame").trim();

  /* the histogram's own box: a light ground on a hairline */
  g.fillStyle = css.getPropertyValue("--well2").trim();
  g.fillRect(hx, hTop, hw, hH);
  g.strokeStyle = css.getPropertyValue("--hist-edge").trim(); g.lineWidth = 1;
  g.strokeRect(hx+0.5, hTop+0.5, hw-1, hH-1);

  /* the histogram itself: a thin outline standing on the box's RIGHT edge,
     its spikes pointing left, which is how pyqtgraph draws it turned on its
     side beside the bar. */
  /* THE PROFILE IS BUILT ON THE LEVELS THAT ARE ACTUALLY THERE, one count per
     distinct level, so no bin can be empty. Binning the RANGE instead is what
     made a gate ramp come out striped: its 51 values scattered into 200 bins
     left most of them empty, and the outline dived back to the baseline at
     every gap. A ramp's profile is flat, and this draws it flat. */
  const count = new Int32Array(256);
  let most = 0, n = 0;
  for(let i=0;i<bytes.length;i++){
    if(bytes[i] === m.missing) continue;
    count[bytes[i]]++; n++;
  }
  const levels = [];
  for(let k=0;k<256;k++){
    if(count[k] > 0){ levels.push(k); if(count[k] > most) most = count[k]; }
  }
  if(most > 0 && levels.length > 1){
    const base = hx + hw - 1, span = hw - 3;
    const yOf = k => (hTop + hH) - k/255*hH;
    g.strokeStyle = css.getPropertyValue("--hist-ink").trim();
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(base, yOf(levels[0]));
    for(const k of levels) g.lineTo(base - count[k]/most*span, yOf(k));
    g.lineTo(base, yOf(levels[levels.length-1]));
    g.stroke();
  }

  const bar = g.createLinearGradient(0, bTop+bH, 0, bTop);
  for(let i=0;i<=16;i++){
    const k = Math.round(i/16*254);
    bar.addColorStop(i/16, `rgb(${L[k*3]},${L[k*3+1]},${L[k*3+2]})`);
  }
  g.fillStyle = bar; g.fillRect(bx, bTop, bw, bH);
  g.strokeStyle = fr; g.lineWidth = 1;
  g.strokeRect(bx+0.5, bTop+0.5, bw-1, bH-1);

  /* The two level values are TYPE, so they are the body ink like every other
     number on the plot. Inking them with the ends of the colormap made each
     one read as a swatch of its own rather than as a number. */
  const uf = unitBase(ch.unit).f;
  g.font = TICK_FONT; g.textAlign = "center";
  g.fillStyle = css.getPropertyValue("--ink").trim();
  g.textBaseline = "bottom";
  g.fillText(siFormat(ch.hi*uf, 4), bx + bw/2, bTop - 3);
  g.textBaseline = "top";
  g.fillText(siFormat(ch.lo*uf, 4), bx + bw/2, bTop + bH + 3);

  /* The z label, turned the other way from the y axis: a colorbar's caption
     reads DOWNWARDS in the panel, where an axis caption reads upwards. */
  g.save();
  g.fillStyle = css.getPropertyValue("--ink").trim();
  g.translate(w - 8, bTop + bH/2); g.rotate(Math.PI/2);
  g.font = LABEL_FONT; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(axisText(ch.zlabel || ch.label, ch.unit, ""), 0, 0);
  g.restore();

  frame(g, w, h, css);
  xAxis(g, css, w, h, m.fast.start, m.fast.end, m.fast.label, m.fast.unit);
  yAxis(g, css, w, h, m.slow.start, m.slow.end, m.slow.label, m.slow.unit);
}

function drawLine(cv, ch, m, idx){
  const {g, w, h, css, iw, ih} = setup(cv, ch.title || ch.label);
  const ys = ch.line || [];
  const good = ys.filter(v => typeof v === "number");
  if(good.length >= 2){
    let lo = Math.min(...good), hi = Math.max(...good);
    if(hi === lo){
      /* A gate recorded as a channel is constant along a fast line. A band
         around the value puts the flat curve in the middle, where it reads as
         the flat line it is, instead of on the frame. */
      const band = Math.abs(lo) > 0 ? Math.abs(lo)*0.05 : 0.5;
      lo -= band; hi += band;
    } else {
      const pad = (hi-lo)*0.08; lo -= pad; hi += pad;
    }
    const col = lineColour(idx);
    /* POSITIONED BY THE AXIS, NOT BY COUNT. The line's points belong to the
       fast axis's own ticks; spreading however many have arrived across the
       whole width would put a half-measured line under the wrong numbers. */
    const ticks = (m.fast && m.fast.ticks) || null;
    const fx = (m.fast && m.fast.start), fX = (m.fast && m.fast.end);
    const X = i => {
      if(ticks && ticks[i] !== undefined && fX !== fx)
        return MARG.l + (ticks[i]-fx)/(fX-fx)*iw;
      return MARG.l + (ys.length>1 ? i/(ys.length-1)*iw : iw/2);
    };
    const Y = v => (MARG.t+ih) - (v-lo)/(hi-lo)*ih;
    clipData(g, w, h);
    g.strokeStyle = col; g.lineWidth = 2; g.lineJoin = "round";
    g.beginPath();
    let started = false;
    ys.forEach((v,i) => {
      if(typeof v !== "number"){ started = false; return; }
      started ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)); started = true;
    });
    g.stroke();
    /* A dot on every point, however many, as the panel draws them:
       LinePlotWidget.SYMBOL_SIZE 5 px, SYMBOL_MAX_POINTS None (the user,
       2026-09-23: "line plots 没有点？"). */
    {
      g.fillStyle = col;
      ys.forEach((v,i) => {
        if(typeof v !== "number") return;
        g.beginPath(); g.arc(X(i), Y(v), 2.5, 0, Math.PI*2); g.fill();
      });
    }
    g.restore();                       // the clip comes off before the axes
    yAxis(g, css, w, h, lo, hi, ch.ylabel || ch.label, ch.unit);
  } else {
    g.fillStyle = css.getPropertyValue("--muted").trim();
    g.textAlign = "left"; g.textBaseline = "top";
    g.fillText(ch.note || "waiting for the first line", MARG.l+6, MARG.t+6);
  }
  frame(g, w, h, css);
  xAxis(g, css, w, h, m.fast.start, m.fast.end, m.fast.label, m.fast.unit);
}

/* HOW MANY COLUMNS FIT. PagedStrip shows three at a time on a desktop; a
   phone has room for one. The pager turns the rest, and the last page is
   PADDED to the same number of slots so the columns keep their width
   instead of stretching, which is what the strip's fixed pitch does. */
function perPage(width){ return width >= 860 ? 3 : width >= 580 ? 2 : 1; }

/* Which header sections the reader has opened. Kept out here so a refresh
   every twenty seconds does not shut them again under their hand. */
const cfgOpen = new Set();

/* ── a colorbar for values that are POINTS, not a grid ────────────────────
   The same gradient, the same two level values inked with the ends of the
   colormap, the same z label on its side. No histogram: the grid's has one
   because a grid has thousands of levels to count, and a path has a dozen. */
function colorbar(g, w, h, css, ih, lo, hi, label, unit){
  const bx = w - CB.zlab - CB.bar, bw = CB.bar, bTop = MARG.t, bH = ih;
  const bar = g.createLinearGradient(0, bTop+bH, 0, bTop);
  for(let i=0;i<=16;i++){
    const k = Math.round(i/16*254);
    bar.addColorStop(i/16, `rgb(${LUT[k*3]},${LUT[k*3+1]},${LUT[k*3+2]})`);
  }
  g.fillStyle = bar; g.fillRect(bx, bTop, bw, bH);
  g.strokeStyle = css.getPropertyValue("--frame").trim(); g.lineWidth = 1;
  g.strokeRect(bx+0.5, bTop+0.5, bw-1, bH-1);
  const uf = unitBase(unit).f;
  g.font = TICK_FONT; g.textAlign = "center";
  g.fillStyle = css.getPropertyValue("--ink").trim();
  g.textBaseline = "bottom";
  g.fillText(siFormat(hi*uf, 4), bx + bw/2, bTop - 3);
  g.textBaseline = "top";
  g.fillText(siFormat(lo*uf, 4), bx + bw/2, bTop + bH + 3);
  if(label){
    g.save();
    g.fillStyle = css.getPropertyValue("--ink").trim();
    g.translate(w - 8, bTop + bH/2); g.rotate(Math.PI/2);
    g.font = LABEL_FONT; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(axisText(label, unit, ""), 0, 0);
    g.restore();
  }
}

/* ── a run that is a LIST, not a grid ──────────────────────────────────────
   Poke on Path writes one row per path point: when its pokes started, how
   many took, and the Z touch average and spread over them. The panel shows
   that as a record table beside the stage position map; here the map is on
   top and the table under it (the user, 2026-09-23). Each point is a TILE,
   filled from the plots' own colormap and carrying the order it was visited,
   so a value reads the same way wherever it appears. */
function drawScatter(cv, m){
  const {g, w, h, css, iw, ih} = setup(cv, m.title || "");
  const xs = m.x || [], ys = m.y || [], vs = m.v || [];
  if(!xs.length){
    g.fillStyle = css.getPropertyValue("--muted").trim();
    g.textAlign = "left"; g.textBaseline = "top";
    g.fillText("no points yet", MARG.l+6, MARG.t+6);
    frame(g, w, h, css); return;
  }
  /* A path that has not moved yet has no extent; give the axes a little so
     its points land in the middle instead of on the frame. */
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const padX = (x1-x0) || Math.abs(x0)*0.1 || 1;
  const padY = (y1-y0) || Math.abs(y0)*0.1 || 1;
  x0 -= padX*0.08; x1 += padX*0.08; y0 -= padY*0.08; y1 += padY*0.08;
  const good = vs.filter(v => typeof v === "number");
  const vlo = good.length ? Math.min(...good) : 0;
  const vhi = good.length ? Math.max(...good) : 1;
  const span = (vhi - vlo) || 1;

  const X = v => MARG.l + (v-x0)/(x1-x0)*iw;
  const Y = v => (MARG.t+ih) - (v-y0)/(y1-y0)*ih;
  /* the path, in the order the points were visited */
  clipData(g, w, h);
  g.strokeStyle = css.getPropertyValue("--frame").trim();
  g.lineWidth = 1;
  g.beginPath();
  xs.forEach((x,i) => i ? g.lineTo(X(x), Y(ys[i])) : g.moveTo(X(x), Y(ys[i])));
  g.stroke();
  const frameInk = css.getPropertyValue("--frame").trim();
  /* A TILE PER POINT, as the panel's stage map draws them. Its side is the
     closest spacing between two points, so the tiles of a dense path meet
     and those of a sparse one do not swell to fill the frame. */
  let side = 14;
  if(xs.length > 1){
    let near = Infinity;
    for(let i = 1; i < xs.length; i++){
      const d = Math.hypot(X(xs[i]) - X(xs[i-1]), Y(ys[i]) - Y(ys[i-1]));
      if(d > 0.5) near = Math.min(near, d);
    }
    if(near !== Infinity) side = Math.max(8, Math.min(34, near));
  }
  const half = side / 2;
  xs.forEach((x,i) => {
    const v = vs[i];
    const k = typeof v === "number" ? Math.round((v-vlo)/span*254) : null;
    const fill = k === null ? css.getPropertyValue("--muted").trim()
               : `rgb(${LUT[k*3]},${LUT[k*3+1]},${LUT[k*3+2]})`;
    const cx = X(x), cy = Y(ys[i]);
    g.fillStyle = fill;
    g.fillRect(cx - half, cy - half, side, side);
    g.strokeStyle = frameInk; g.lineWidth = 1;
    g.strokeRect(cx - half + 0.5, cy - half + 0.5, side - 1, side - 1);
    /* THE ORDER THEY WERE VISITED, written on the tile, and only when the
       tile can hold it: the panel leaves the number off a tile too small for
       it rather than letting it run over the edge. */
    if(side >= 17){
      const label = String(i + 1);
      g.font = "10px " + FACE;
      g.textAlign = "center";
      g.textBaseline = "middle";
      /* Dark ink on a pale tile, pale on a dark one, judged from the fill
         actually used rather than from where it sits in the range. */
      let lum = 1;
      if(k !== null){
        lum = (0.299*LUT[k*3] + 0.587*LUT[k*3+1] + 0.114*LUT[k*3+2]) / 255;
      }
      g.fillStyle = lum > 0.55 ? "rgba(0,0,0,.72)" : "rgba(255,255,255,.92)";
      g.fillText(label, cx, cy + 0.5);
    }
  });
  g.restore();                         // the clip comes off before the axes
  if(good.length) colorbar(g, w, h, css, ih, vlo, vhi, m.vlabel, m.vunit);
  frame(g, w, h, css);
  xAxis(g, css, w, h, x0, x1, m.xlabel, m.xunit);
  yAxis(g, css, w, h, y0, y1, m.ylabel, m.yunit);
}

/* ── Poke on Path, as its panel draws it ───────────────────────────────────
   The XY Scanner Position Map with the progress bar and ETA over it, the Z
   touch scale beside it, and the run's records beside that; no traces (the
   user, 2026-09-23). Read off the panel: every path point a navy dot on a
   square of its Z touch (the square only once the point is poked), the
   number above the square's top-left corner, black once poked and navy
   before, the point being poked red, the tip a blue cross, no route line. */
function popFmt(v){
  if(typeof v !== "number") return "";
  return Math.abs(v) >= 1 ? v.toFixed(1) : String(parseFloat(v.toPrecision(2)));
}
function drawPopMap(cv, m){
  const {g, w, h, css, iw, ih} = setup(cv, "");
  const mp = m.map || {}, P = m.path;
  const L = lutOf(mp.cmap || "RdBu_r");
  /* The whole path when the panel sent it, else the points the file has. */
  let xs, ys, zs;
  if(P && P.x_nm && P.x_nm.length){
    xs = P.x_nm; ys = P.y_nm;
    zs = xs.map((_, i) => { const z = (P.z_um || {})[String(i)];
                            return typeof z === "number" ? z : null; });
  } else {
    xs = mp.x || []; ys = mp.y || []; zs = (mp.v || []).map(v => typeof v === "number" ? v : null);
  }
  const done = (m.rows || []).length;
  if(!xs.length){
    g.fillStyle = css.getPropertyValue("--muted").trim();
    g.textAlign = "left"; g.textBaseline = "top"; g.font = TICK_FONT;
    g.fillText("no points yet", MARG.l+6, MARG.t+6);
    frame(g, w, h, css); return;
  }
  /* EQUAL SCALES, as the panel's map: a square window round the path. */
  const pts = xs.map((x, i) => [x, ys[i]]);
  if(P && P.tip_nm) pts.push(P.tip_nm);
  let x0 = Math.min(...pts.map(p => p[0])), x1 = Math.max(...pts.map(p => p[0]));
  let y0 = Math.min(...pts.map(p => p[1])), y1 = Math.max(...pts.map(p => p[1]));
  let span = Math.max(x1 - x0, y1 - y0, 1e-3) * 1.2;
  let cx0 = (x0 + x1)/2, cy0 = (y0 + y1)/2;
  /* ZOOMED OR MOVED BY THE READER: their window, kept across refreshes, until
     they ask for the fit back (double click, or the fit button). */
  const V = mapViews.pop;
  if(V){ span = V.span; cx0 = V.cx; cy0 = V.cy; }
  x0 = cx0 - span/2; x1 = cx0 + span/2; y0 = cy0 - span/2; y1 = cy0 + span/2;
  const k = iw / span;
  /* what the gestures need to turn pixels back into nm */
  cv._pv = {cx: cx0, cy: cy0, span, iw, ih};
  const X = v => MARG.l + (v - x0) * k, Y = v => MARG.t + ih - (v - y0) * k;

  /* The square is the poke's footprint: 0.6 of the median spacing to the
     nearest neighbour, 3 to 26 px; the dot 0.45 of it, 3 to 9 px. */
  let near = [];
  for(let i = 0; i < xs.length; i++){
    let d = Infinity;
    for(let j = 0; j < xs.length; j++) if(j !== i)
      d = Math.min(d, Math.hypot(xs[i]-xs[j], ys[i]-ys[j]));
    if(d !== Infinity && d > 0) near.push(d);
  }
  near.sort((a, b) => a - b);
  const med = near.length ? near[Math.floor(near.length/2)] : 50;
  const sq = Math.round(Math.max(3, Math.min(26, med * 0.6 * k)));
  const dot = Math.round(Math.max(3, Math.min(9, sq * 0.45)));
  const good = zs.filter(z => z !== null);
  const zlo = good.length ? Math.min(...good) : 0, zhi = good.length ? Math.max(...good) : 0;
  const frameInk = css.getPropertyValue("--frame").trim();

  clipData(g, w, h);
  /* squares first, under the dots and the numbers */
  xs.forEach((x, i) => {
    const z = zs[i];
    if(z === null) return;
    const t = zhi > zlo ? (z - zlo)/(zhi - zlo) : 0.5;
    const c = Math.round(Math.max(0, Math.min(1, t)) * 255);
    g.fillStyle = `rgb(${L[c*3]},${L[c*3+1]},${L[c*3+2]})`;
    const px = Math.round(X(x) - sq/2), py = Math.round(Y(ys[i]) - sq/2);
    g.fillRect(px, py, sq, sq);
    if(sq >= 9){ g.strokeStyle = frameInk; g.lineWidth = 1;
                 g.strokeRect(px + 0.5, py + 0.5, sq - 1, sq - 1); }
  });
  /* the point being poked now: the first one without a row, while running */
  const cur = (m.live && done < xs.length) ? done : -1;
  xs.forEach((x, i) => {
    const r = (i === cur ? 10 : dot) / 2;
    g.beginPath(); g.arc(X(x), Y(ys[i]), r, 0, Math.PI*2);
    if(zs[i] !== null){ g.strokeStyle = "#ffffff"; g.lineWidth = 2; g.stroke(); }
    g.fillStyle = i === cur ? "#ff0000" : "#003366"; g.fill();
  });
  /* each number above its square's top-left corner, when there is room */
  const minGap = (near.length ? near[0] : Infinity) * k;
  if(minGap > 16){
    g.font = "11px " + FACE; g.textAlign = "center"; g.textBaseline = "bottom";
    xs.forEach((x, i) => {
      g.fillStyle = zs[i] !== null ? css.getPropertyValue("--ink").trim() : "#003366";
      g.fillText(String(i + 1), X(x) - sq/2, Y(ys[i]) - sq/2 - 1);
    });
  }
  /* the tip: the panel's hollow blue cross */
  if(P && P.tip_nm){
    const tx = X(P.tip_nm[0]), ty = Y(P.tip_nm[1]);
    g.strokeStyle = "#4F86F7"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(tx - 7, ty); g.lineTo(tx + 7, ty);
    g.moveTo(tx, ty - 7); g.lineTo(tx, ty + 7); g.stroke();
  }
  g.restore();

  /* THE Z TOUCH SCALE, StageColorBar: its caption over a slim ramp standing
     on the map's bottom frame line, the two end values beside the ramp. */
  if(good.length){
    const bx = w - MARG.r + 10, bw = 16, bH = Math.round(ih * 0.4);
    const bTop = MARG.t + ih - bH;
    const grad = g.createLinearGradient(0, bTop + bH, 0, bTop);
    for(let i = 0; i <= 16; i++){
      const c = Math.round(i/16*255);
      grad.addColorStop(i/16, `rgb(${L[c*3]},${L[c*3+1]},${L[c*3+2]})`);
    }
    g.fillStyle = grad; g.fillRect(bx, bTop, bw, bH);
    g.strokeStyle = frameInk; g.lineWidth = 1;
    g.strokeRect(bx + 0.5, bTop + 0.5, bw - 1, bH - 1);
    g.fillStyle = css.getPropertyValue("--ink").trim();
    g.font = TICK_FONT; g.textAlign = "left";
    g.textBaseline = "top"; g.fillText(popFmt(zhi), bx + bw + 5, bTop);
    g.textBaseline = "bottom"; g.fillText(popFmt(zlo), bx + bw + 5, bTop + bH);
    g.textBaseline = "bottom";
    g.fillText("Z touch", bx, bTop - 6);
    const tw = g.measureText("Z touch ").width;
    g.fillStyle = css.getPropertyValue("--unit").trim();
    /* the micro sign, as the records beside it write it */
    g.fillText("(" + String(mp.vunit || "um").replace(/^u(?=m$)/, "µ") + ")",
               bx + tw, bTop - 6);
  }
  frame(g, w, h, css);
  xAxis(g, css, w, h, x0, x1, "X", "nm");
  yAxis(g, css, w, h, y0, y1, "Y", "nm");
}
function renderPop(m){
  const host = $("#plots");
  const rows = m.rows || [], cols = m.columns || [];
  const head = cols.map(c => {
    const parts = String(c.cap).split("\n");
    const isUnit = parts[1] && /^\(.*\)$/.test(parts[1]);
    return '<th>' + esc(parts[0]) +
      (parts[1] ? '\n<span class="' + (isUnit ? "u" : "") + '">' +
                  esc(parts[1]) + '</span>' : '') + '</th>';
  }).join("");
  const R = m.run || {};
  /* The run's own line first, as the top level of the panel's list, then its
     points under it. */
  const runRow = '<tr class="runrow"><td class="two">' + SEC_CHEV_OPEN + '</td>' +
    '<td class="two">' + esc(R.start || "") + '</td><td>' + esc(R.points || "") +
    '</td><td>' + esc(R.mode || "") + '</td><td>' + esc(R.avg || "") + '</td></tr>';
  const body = rows.map(r =>
    '<tr>' + r.map(c => '<td class="two">' + esc(c) + '</td>').join("") + '</tr>').join("");
  const B = m.bar;
  host.style.flexWrap = "wrap";
  host.style.flexDirection = "row";
  host.style.alignItems = "flex-start";
  /* THE SKELETON ONCE, then only its contents: a refresh every second or two
     must not rebuild the canvas under a hand that is dragging it. */
  plotKey = "";                        // the other renderers rebuild after this one
  if(!host.querySelector(".popmap")){
    host.innerHTML =
      '<div class="popmap">' +
        '<div class="pophead"><span class="poptitle">XY Scanner Position Map</span>' +
          '<span class="popstate"></span>' +
          '<button class="popfit" title="Auto scale on all points (or double-click the map)">' +
          POP_FIT_ICON + '</button></div>' +
        '<div class="popbar"></div>' +
        '<canvas class="map"></canvas></div>' +
      '<div class="poprec">' +
        '<div class="reccap"></div>' +
        '<table class="rec"><thead><tr></tr></thead><tbody></tbody></table></div>';
    wireMapGestures(host.querySelector("canvas.map"),
                    host.querySelector(".popfit"), "pop", popRedraw);
  }
  /* in place: the bar glides, and a row being read is not rebuilt under it */
  morph(host.querySelector(".popstate"),
    m.state ? '<span class="pill blue">' + esc(m.state) + '</span>' : '');
  morph(host.querySelector(".popbar"),
    (B ? barHTML(B[1] ? B[0]/B[1] : 0, B[0] + ' / ' + B[1]) : '') +
    '<span class="eta">' + esc(m.eta || "") + '</span>');
  host.querySelector(".reccap").textContent = m.title || "Poke on Path records";
  morph(host.querySelector(".rec thead tr"), head);
  morph(host.querySelector(".rec tbody"), runRow + body);
  const cv = host.querySelector("canvas.map");
  const inner = Math.max(60, cv.clientWidth - MARG.l - MARG.r);
  cv.style.height = Math.round(inner + MARG.t + MARG.b) + "px";
  drawPopMap(cv, m);
  $("#pager").classList.add("hidden");
}

/* ── zoom and move on the position map ─────────────────────────────────────
   The wheel zooms about the pointer, a drag moves the view, two fingers
   pinch; a double click (or the fit button, the panel's "Auto scale on all
   points") gives the whole path back. */
/* Each map's own window, {cx, cy, span} in its units, or null = fit. */
const mapViews = {pop: null, xy: null};
const POP_FIT_ICON = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
function popRedraw(){ if(lastMap && lastMap.pop) drawPopMap($("#plots canvas.map"), lastMap); }
function wireMapGestures(cv, fitBtn, key, redraw){
  const pv = () => cv._pv;
  /* a canvas pixel -> nm, from the window the last draw used */
  const toNm = (px, py) => {
    const v = pv(), r = cv.getBoundingClientRect();
    const k = v.iw / v.span;
    return [v.cx - v.span/2 + (px - r.left - MARG.l) / k,
            v.cy - v.span/2 + (MARG.t + v.ih - (py - r.top)) / k];
  };
  const zoomAt = (px, py, f) => {
    const v = pv(); if(!v) return;
    const [ax, ay] = toNm(px, py);
    const span = Math.max(1e-4, v.span * f);
    /* the point under the pointer stays under it */
    mapViews[key] = {span, cx: ax + (v.cx - ax) * f, cy: ay + (v.cy - ay) * f};
    redraw();
  };
  const panBy = (dx, dy) => {
    const v = pv(); if(!v) return;
    const k = v.iw / v.span;
    mapViews[key] = {span: v.span, cx: v.cx - dx / k, cy: v.cy + dy / k};
    redraw();
  };
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, Math.pow(1.0015, e.deltaY));
  }, {passive: false});
  cv.addEventListener("dblclick", () => { mapViews[key] = null; redraw(); });
  fitBtn.addEventListener("click", () => { mapViews[key] = null; redraw(); });
  /* one pointer drags, two pinch */
  const pts = new Map();
  let last = null;
  cv.addEventListener("pointerdown", e => {
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    last = null;
  });
  cv.addEventListener("pointermove", e => {
    if(!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if(pts.size === 1){
      panBy(e.clientX - prev[0], e.clientY - prev[1]);
    } else if(pts.size === 2){
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a[0]-b[0], a[1]-b[1]);
      const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];
      if(last && d > 0) zoomAt(mid[0], mid[1], last / d);
      last = d;
    }
  });
  const up = e => { pts.delete(e.pointerId); last = null; };
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);
}

/* ── THE APPROACH PANEL, both halves ───────────────────────────────────────
   Z Approach on the left, Locating Sample XY on the right, each with its
   state pill and its lamps as the panel lays them out, the Approach Records
   and the XY Scanning Records one row per run, and the XY Steppers Position
   Map of the survey on show: the whole plan as outlines with the route's
   arrows, each stop reached filled in the shown channel's colour. No traces
   (as Poke on Path, 2026-09-23). */
const APPR_LEDS = [["ac_in_range", "AC 2nd in range"], ["relock", "Feedback re-locks"],
                   ["stepper_moving", "Stepper Moving"], ["scanner_moving", "Scanner Moving"],
                   ["scanner_safetip", "Scanner SafeTip"], ["scanner_low_lim", "Scanner Reach Low Limit"]];
const XY_LEDS = [["xy_stepper_moving", "XY Steppers Moving"], ["xy_scanner_moving", "XY Scanners Moving"],
                 ["survey_safetip", "Scanner SafeTip"]];
function ledGrid(set, leds){
  return '<div class="aleds">' + set.map(([k, cap]) =>
    '<span class="grp"><span class="led ' + esc(leds[k] || "off") + '"></span>' +
    '<span>' + esc(cap) + '</span></span>').join("") + '</div>';
}
/* The section's state pill in whatever tone the panel has it in right now;
   "Idle" in the panel's blue when the panel is not open to say. */
function apill(p){
  const t = (p && p.text) || "Idle";
  const st = (p && p.bg) ? ' style="background:' + p.bg + ';border-color:' + p.edge +
                           ';color:' + p.ink + '"' : '';
  return '<span class="apill"' + st + '>' + esc(t) + '</span>';
}
function recTable(caps, rows){
  const head = caps.map(c => '<th>' + esc(c) + '</th>').join("");
  const n0 = 0;
  const body = rows.map((r, i) =>
    '<tr class="' + (r.here ? "here" : "") + '"><td class="two">' + (n0 + i + 1) + '</td>' +
    r.cells.map(c => '<td class="two">' + esc(c) + '</td>').join("") + '</tr>').join("");
  return '<table class="rec"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table>';
}
function drawXYMap(cv, M){
  const {g, w, h, css, iw, ih} = setup(cv, "");
  const L = lutOf("RdBu_r");
  const stops = M.stops || [], outs = M.outlines || [], done = M.done || [];
  const all = stops.concat(done.map(d => [d[0], d[1]]));
  if(!all.length){
    g.fillStyle = css.getPropertyValue("--muted").trim();
    g.textAlign = "left"; g.textBaseline = "top"; g.font = TICK_FONT;
    g.fillText("no survey yet", MARG.l + 6, MARG.t + 6);
    frame(g, w, h, css); return;
  }
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  let span = Math.max(x1 - x0, y1 - y0, (M.w || 20) * 3) * 1.25;
  let cx0 = (x0 + x1)/2, cy0 = (y0 + y1)/2;
  const V = mapViews.xy;
  if(V){ span = V.span; cx0 = V.cx; cy0 = V.cy; }
  x0 = cx0 - span/2; x1 = cx0 + span/2; y0 = cy0 - span/2; y1 = cy0 + span/2;
  const k = iw / span;
  cv._pv = {cx: cx0, cy: cy0, span, iw, ih};
  const X = v => MARG.l + (v - x0) * k, Y = v => MARG.t + ih - (v - y0) * k;
  const frameInk = css.getPropertyValue("--frame").trim();
  const vals = done.map(d => d[2]).filter(v => typeof v === "number");
  const lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 0;
  clipData(g, w, h);
  /* the plan: every cell the survey was going to visit, as its outline */
  const minPx = 6;
  const cell = (o, fill) => {
    const pts = o.map(p => [X(p[0]), Y(p[1])]);
    const cxp = pts.reduce((a, p) => a + p[0], 0) / pts.length;
    const cyp = pts.reduce((a, p) => a + p[1], 0) / pts.length;
    const size = Math.max(...pts.map(p => Math.abs(p[0] - cxp))) * 2;
    g.beginPath();
    if(size < minPx){ g.rect(Math.round(cxp - minPx/2) + 0.5, Math.round(cyp - minPx/2) + 0.5, minPx - 1, minPx - 1); }
    else { pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
    if(fill){ g.fillStyle = fill; g.fill(); }
    g.strokeStyle = frameInk; g.lineWidth = 1; g.stroke();
  };
  outs.forEach(o => cell(o, null));
  /* the route, one small arrow between each stop and the next */
  g.strokeStyle = frameInk; g.fillStyle = frameInk; g.lineWidth = 1;
  for(let i = 1; i < stops.length; i++){
    const ax = X(stops[i-1][0]), ay = Y(stops[i-1][1]), bx = X(stops[i][0]), by = Y(stops[i][1]);
    const d = Math.hypot(bx - ax, by - ay);
    if(d < 24) continue;
    const ux = (bx - ax)/d, uy = (by - ay)/d, mx = (ax + bx)/2, my = (ay + by)/2;
    g.beginPath(); g.moveTo(mx - ux*9, my - uy*9); g.lineTo(mx + ux*5, my + uy*5); g.stroke();
    g.beginPath(); g.moveTo(mx + ux*9, my + uy*9);
    g.lineTo(mx + ux*3 - uy*3.5, my + uy*3 + ux*3.5); g.lineTo(mx + ux*3 + uy*3.5, my + uy*3 - ux*3.5);
    g.closePath(); g.fill();
  }
  /* the stops reached, filled in the shown channel's colour */
  const hw = (M.w || 20)/2, hh = (M.h || 20)/2;
  done.forEach(d => {
    const v = d[2];
    let fill = css.getPropertyValue("--muted").trim();
    if(typeof v === "number"){
      const t = hi > lo ? (v - lo)/(hi - lo) : 0.5;
      const c = Math.round(Math.max(0, Math.min(1, t)) * 255);
      fill = `rgb(${L[c*3]},${L[c*3+1]},${L[c*3+2]})`;
    }
    cell([[d[0]-hw, d[1]-hh], [d[0]+hw, d[1]-hh], [d[0]+hw, d[1]+hh], [d[0]-hw, d[1]+hh]], fill);
  });
  g.restore();
  /* the channel's scale, the StageColorBar beside the map */
  if(vals.length){
    const bx = w - MARG.r + 10, bw = 16, bH = Math.round(ih * 0.4), bTop = MARG.t + ih - bH;
    const grad = g.createLinearGradient(0, bTop + bH, 0, bTop);
    for(let i = 0; i <= 16; i++){
      const c = Math.round(i/16*255);
      grad.addColorStop(i/16, `rgb(${L[c*3]},${L[c*3+1]},${L[c*3+2]})`);
    }
    g.fillStyle = grad; g.fillRect(bx, bTop, bw, bH);
    g.strokeStyle = frameInk; g.lineWidth = 1; g.strokeRect(bx + 0.5, bTop + 0.5, bw - 1, bH - 1);
    const uf = unitBase(M.unit).f;
    g.fillStyle = css.getPropertyValue("--ink").trim(); g.font = TICK_FONT; g.textAlign = "left";
    g.textBaseline = "top"; g.fillText(siFormat(hi*uf, 3) + (unitBase(M.unit).base || ""), bx + bw + 5, bTop);
    g.textBaseline = "bottom"; g.fillText(siFormat(lo*uf, 3) + (unitBase(M.unit).base || ""), bx + bw + 5, bTop + bH);
    g.fillText(M.signal || "", bx, bTop - 6);
    const tw = g.measureText((M.signal || "") + " ").width;
    g.fillStyle = css.getPropertyValue("--unit").trim();
    if(M.unit) g.fillText("(" + String(M.unit).replace(/^u(?=m$)/, "µ") + ")",
                          bx + tw, bTop - 6);
  }
  frame(g, w, h, css);
  xAxis(g, css, w, h, x0, x1, "X", "um");
  yAxis(g, css, w, h, y0, y1, "Y", "um");
}

/* ── curves against one axis ───────────────────────────────────────────────
   A 1D sweep, a descent, a poke's own trace: one plot per channel, the run's
   swept parameter or its clock along the bottom. */
function lighten(rgbish, amount){
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(rgbish.trim());
  if(!m) return rgbish;
  const mix = v => Math.round(parseInt(v,16) + (255 - parseInt(v,16))*amount);
  return `rgb(${mix(m[1])},${mix(m[2])},${mix(m[3])})`;
}

function drawCurves(cv, ch, X, idx){
  const {g, w, h, css, iw, ih} = setup(cv, ch.label);
  const xs = X.values || [];
  const sets = [["fwd", ch.fwd, lineColour(idx)],
                ["bwd", ch.bwd, lighten(lineColour(idx), 0.45)]]
               .filter(([, ser]) => ser && ser.some(v => typeof v === "number"));
  if(!sets.length){
    g.fillStyle = css.getPropertyValue("--muted").trim();
    g.textAlign = "left"; g.textBaseline = "top";
    g.fillText("waiting for data", MARG.l+6, MARG.t+6);
    frame(g, w, h, css);
    xAxis(g, css, w, h, X.lo, X.hi, X.label, X.unit);
    return;
  }
  const all = [];
  sets.forEach(([, ser]) => ser.forEach(v => { if(typeof v === "number") all.push(v); }));
  let lo = Math.min(...all), hi = Math.max(...all);
  if(hi === lo){
    const band = Math.abs(lo) > 0 ? Math.abs(lo)*0.05 : 0.5;
    lo -= band; hi += band;
  } else { const pad = (hi-lo)*0.08; lo -= pad; hi += pad; }

  const xlo = X.lo, xhi = (X.hi === X.lo) ? X.lo + 1 : X.hi;
  const PX = v => MARG.l + (v-xlo)/(xhi-xlo)*iw;
  const PY = v => (MARG.t+ih) - (v-lo)/(hi-lo)*ih;
  clipData(g, w, h);
  sets.forEach(([, ser, colour]) => {
    g.strokeStyle = colour; g.lineWidth = 2; g.lineJoin = "round";
    g.beginPath();
    let started = false;
    ser.forEach((v, i) => {
      const x = xs[i];
      if(typeof v !== "number" || typeof x !== "number"){ started = false; return; }
      started ? g.lineTo(PX(x), PY(v)) : g.moveTo(PX(x), PY(v));
      started = true;
    });
    g.stroke();
  });
  g.restore();                         // the clip comes off before the axes
  /* Which pass is which, only when there are two of them, and in the band
     the title sits in rather than on the frame's corner. */
  if(sets.length > 1){
    g.font = TICK_FONT; g.textAlign = "right"; g.textBaseline = "alphabetic";
    let x = w - MARG.r;
    for(let i = sets.length - 1; i >= 0; i--){
      const [tag, , colour] = sets[i];
      const word = tag === "bwd" ? "Bwd" : "Fwd";
      g.fillStyle = colour;
      g.fillText(word, x, MARG.t - 5);
      x -= g.measureText(word).width + 7;
    }
  }
  frame(g, w, h, css);
  yAxis(g, css, w, h, lo, hi, ch.label, ch.unit);
  xAxis(g, css, w, h, X.lo, X.hi, X.label, X.unit);
}

let plotKey = "", page = 0;
let lastRunFile;             // the run file the toggles and page belong to
/* Which pass each channel is showing, by channel name, because the column a
   channel sits in changes as the pager turns. The panel's toggle is per
   display column too. */
const dirOf = {};
/* A channel as it should be drawn: the backward pass swapped in when that is
   what the column is showing. Everything downstream then needs no idea that
   there are two. */
function passOf(c){
  if(!c || dirOf[c.name] !== "bwd" || c.z_b === undefined) return c;
  return Object.assign({}, c, {z: c.z_b, lo: c.lo_b, hi: c.hi_b,
                               line: c.line_b || c.line});
}
/* Lay the pill over the selected segment, from that segment's own box, as
   _seg_attach_thumb does. Only a click animates; a fresh control is placed
   where it belongs without sliding in from the left. */
function placeSegThumb(seg, animated){
  const thumb = seg.querySelector(".thumb"), on = seg.querySelector("span[data-d].on");
  if(!thumb || !on) return;
  if(animated) seg.classList.add("anim");
  thumb.style.left = on.offsetLeft + "px";
  thumb.style.width = on.offsetWidth + "px";
}
/* Clicking a segment redraws that column from the other pass. Bound on the
   host once, so it survives the markup being rebuilt by the pager, and shared
   by every renderer that has the toggle. */
function wireDirs(host){
  if(host.dataset.dirWired) return;
  host.dataset.dirWired = "1";
  host.addEventListener("click", ev => {
    const seg = ev.target.closest(".seg[data-ch]");
    if(!seg || seg.classList.contains("off")) return;
    const want = ev.target.dataset.d;
    if(!want || dirOf[seg.dataset.ch] === want) return;
    dirOf[seg.dataset.ch] = want;
    /* Slide the pill and recolour the words NOW, so the control answers at
       once; the plot is redrawn under it. */
    seg.querySelectorAll("span[data-d]").forEach(sp =>
      sp.classList.toggle("on", sp.dataset.d === want));
    placeSegThumb(seg, true);
    if(lastMap) renderAny(lastMap);
  });
}
function renderAny(m){
  m.kind === "approach" ? renderApproach(m)
    : m.kind === "records" ? renderRecords(m)
    : m.kind === "curves" ? renderCurves(m)
    : m.kind === "frames" ? renderFrames(m)
    : renderPlots(m);
}
/* The direction toggle's markup, direction_toggle as the panels build it. */
function segHTML(c, m, two){
  const bwd = two && dirOf[c.name] === "bwd";
  const [wf, wb] = m.dirs || ["Fwd", "Bwd"];
  return '<span class="seg' + (two ? '' : ' off') + '" data-ch="' + esc(c.name) +
    '" title="' + (two ? esc(wf + ' / ' + wb) : 'this channel has no backward pass') + '">' +
    '<span class="thumb"></span>' +
    '<span class="' + (bwd ? '' : 'on') + '" data-d="fwd" data-w="' + esc(wf) + '">' +
      esc(wf) + '</span>' +
    '<span class="' + (bwd ? 'on' : '') + '" data-d="bwd" data-w="' + esc(wb) + '">' +
      esc(wb) + '</span></span>';
}

/* ── Frame 2D: the panel's history viewer ─────────────────────────────────
   Each column picks its own (Slow, Fast) frame from two drop-downs, as the
   panel's second row does, and nothing on it moves by itself (the user,
   2026-09-23). A frame's image is its own sealed file, fetched the first
   time it is picked and kept. Drawn in physical frames: X / Y in metres,
   the frame at the scan controller's centre and angle, the panel's default. */
/* ONE pick for the whole page: every channel shows the same frame (the user,
   2026-09-23: pick Slow / Fast once, not per column). */
const selFrame = {};              // {s, f}, the picked frame
const frameCache = {};            // frame id -> Promise of the opened frame
function fetchFrame(id){
  if(!frameCache[id]){
    frameCache[id] = (async () => {
      const url = RAW.replace(/status\.json$/, "f/" + id + ".json");
      const r = await fetch(url, {cache:"no-store"});
      if(!r.ok) throw new Error("http " + r.status);
      return open_(await r.json(), key);
    })();
    frameCache[id].catch(() => { delete frameCache[id]; });
  }
  return frameCache[id];
}
/* The square window the panel's aspect-locked view shows: the rotated
   frame's bounding box, widened on its short side to a square. */
function frameView(g){
  const t = g.angle * Math.PI / 180, c = Math.abs(Math.cos(t)), s = Math.abs(Math.sin(t));
  const bw = g.w*c + g.h*s, bh = g.w*s + g.h*c, span = Math.max(bw, bh);
  return {x0: g.cx - span/2, x1: g.cx + span/2, y0: g.cy - span/2, y1: g.cy + span/2};
}
function renderFrames(m){
  LUT = lutOf(m.cmap);
  const host = $("#plots");
  const pp = perPage(host.clientWidth || document.body.clientWidth);
  const pages = Math.max(1, Math.ceil(m.channels.length / pp));
  page = Math.min(Math.max(0, page), pages - 1);
  const shown = m.channels.slice(page*pp, page*pp + pp);
  $("#pager").classList.toggle("hidden", pages < 2);
  $("#ppage").textContent = (page + 1) + " / " + pages;
  $("#pprev").disabled = page === 0;
  $("#pnext").disabled = page >= pages - 1;

  const have = {};
  for(const fr of m.frames || []) have[fr.s + "," + fr.f] = fr.id;
  const doneS = new Set((m.frames || []).map(fr => fr.s));
  const doneF = new Set((m.frames || []).map(fr => fr.f));

  /* The picker: built once per run, its greyed values brought up to date on
     every refresh. */
  const fp = $("#fpick");
  fp.classList.remove("hidden");
  const pickKey = JSON.stringify([m.slow.values, m.fast.values, m.slow.label, m.fast.label]);
  if(fp.dataset.k !== pickKey){
    fp.dataset.k = pickKey;
    const opts = vals => '<option value="" selected disabled hidden></option>' +
      vals.map((v, i) => '<option value="' + i + '">' + esc(String(v)) + '</option>').join("");
    fp.innerHTML = '<label>Slow</label><select data-w="s">' + opts(m.slow.values) +
      '</select><label>Fast</label><select data-w="f">' + opts(m.fast.values) + '</select>';
    fp.querySelectorAll("select").forEach(sel => {
      const cur = selFrame[sel.dataset.w];
      if(cur !== undefined) sel.value = String(cur);
      sel.addEventListener("change", () => {
        selFrame[sel.dataset.w] = +sel.value;
        if(lastMap) renderFrames(lastMap);
      });
    });
  }
  /* A value with no finished frame yet is listed but cannot be picked, so
     the reader sees where the run is going (_populate_history_combos). */
  fp.querySelectorAll("select").forEach(sel => {
    const done = sel.dataset.w === "s" ? doneS : doneF;
    [...sel.options].forEach((o, j) => { if(j > 0) o.disabled = !done.has(j - 1); });
  });

  const key_ = "frames@" + pp + "@" + page + ":" + shown.map(c => c.name).join(",");
  if(key_ !== plotKey){
    plotKey = key_;
    let html = shown.map((c, k) =>
      '<div class="chan" data-ch="' + esc(c.name) + '"><div class="chead">' +
      '<span class="cap">Display channel ' + (page*pp + k + 1) + '</span>' +
      '<span>' + c.label + '</span>' +
      (c.unit ? '<span class="u">(' + esc(c.unit) + ')</span>' : '') +
      segHTML(c, m, true) + '</div>' +
      '<canvas class="map"></canvas></div>').join("");
    for(let k = shown.length; k < pp; k++) html += '<div class="chan empty"></div>';
    host.innerHTML = html;
  }
  wireDirs(host);
  host.querySelectorAll(".seg").forEach(s => placeSegThumb(s, false));
  host.querySelectorAll(".chan[data-ch]").forEach((el, i) => {
    const c = shown[i];
    const cv = el.querySelector("canvas.map");
    const cw = cv.clientWidth;
    const inner = Math.max(60, cw - MARG.l - MARG.r);
    cv.style.height = Math.round(inner + MARG.t + MARG.b) + "px";
    const pick = selFrame;
    const id = have[pick.s + "," + pick.f];
    const v = frameView(m.geom);
    const view = {geom: m.geom, missing: 255,
                  fast: {start: v.x0, end: v.x1, label: "X", unit: "m"},
                  slow: {start: v.y0, end: v.y1, label: "Y", unit: "m"}};
    const blank = note => drawFrameBlank(cv, c, view, note);
    if(!id){
      blank(pick.s === undefined || pick.f === undefined ? "pick Slow and Fast"
                                                         : "that frame is not finished yet");
      return;
    }
    const want = id + (dirOf[c.name] || "fwd");
    cv.dataset.want = want;
    fetchFrame(id).then(fr => {
      if(cv.dataset.want !== want) return;        // picked something else since
      const d = (fr.channels || []).find(x => x.name === c.name);
      if(!d){ blank("not recorded in that frame"); return; }
      const pass = passOf(Object.assign({}, c, d));
      Object.assign(view, {rows: fr.rows, cols: fr.cols, missing: fr.missing});
      drawMap(cv, pass, view);
    }).catch(() => { if(cv.dataset.want === want) blank("could not fetch that frame"); });
  });
}
/* An empty frame view: the axes and the colour bar's place, and a word on why. */
function drawFrameBlank(cv, c, view, note){
  const {g, w, h, css} = setup(cv, c.label);
  g.fillStyle = css.getPropertyValue("--muted").trim();
  g.textAlign = "left"; g.textBaseline = "top"; g.font = TICK_FONT;
  g.fillText(note, MARG.l + 6, MARG.t + 6);
  frame(g, w, h, css);
  xAxis(g, css, w, h, view.fast.start, view.fast.end, "X", "m");
  yAxis(g, css, w, h, view.slow.start, view.slow.end, "Y", "m");
}
function renderPlots(m){
  LUT = lutOf(m.cmap);
  const host = $("#plots");
  const pp = perPage(host.clientWidth || document.body.clientWidth);
  const pages = Math.max(1, Math.ceil(m.channels.length / pp));
  page = Math.min(Math.max(0, page), pages - 1);
  const shown = m.channels.slice(page*pp, page*pp + pp);

  $("#pager").classList.toggle("hidden", pages < 2);
  $("#ppage").textContent = (page + 1) + " / " + pages;
  $("#pprev").disabled = page === 0;
  $("#pnext").disabled = page >= pages - 1;

  /* The pass shown is NOT part of the key: a click updates the toggle in
     place, so its pill can slide instead of the markup being rebuilt under
     it; every rebuild reads dirOf anyway. */
  const key = pp + "@" + page + (m.maponly ? "@map" : "") + ":" +
              shown.map(c => c.name + "|" + c.unit).join(",");
  if(key !== plotKey){
    plotKey = key;
    let html = shown.map((c, k) =>
      '<div class="chan"><div class="chead">' +
      '<span class="cap">Display channel ' + (page*pp + k + 1) + '</span>' +
      '<span>' + c.label + '</span>' +
      (c.unit ? '<span class="u">(' + esc(c.unit) + ')</span>' : '') +
      /* The direction toggle stays: the Frame 2D panel has one too, and its
         sub-files carry "<ch> Fwd" and "<ch> Bwd" columns. What a frame has
         no room for is a line plot under the image, which its panel does not
         have either. */
      (function(){
        /* Switchable only if THIS channel recorded a backward pass. */
        const two = c.z_b !== undefined;
        const bwd = two && dirOf[c.name] === "bwd";
        /* The words are the run's: an I-V map sweeps its bias Up then Down. */
        const [wf, wb] = m.dirs || ["Fwd", "Bwd"];
        return '<span class="seg' + (two ? '' : ' off') + '" data-ch="' +
          esc(c.name) + '" title="' +
          (two ? esc(wf + ' / ' + wb) :
                 'this channel has no backward pass') + '">' +
          '<span class="thumb"></span>' +
          '<span class="' + (bwd ? '' : 'on') + '" data-d="fwd" data-w="' + esc(wf) + '">' +
            esc(wf) + '</span>' +
          '<span class="' + (bwd ? 'on' : '') + '" data-d="bwd" data-w="' + esc(wb) + '">' +
            esc(wb) + '</span></span>';
      })() + '</div>' +
      '<canvas class="map"></canvas>' +
      (m.maponly || c.maponly ? '' : '<canvas class="lp"></canvas>') + '</div>').join("");
    for(let k = shown.length; k < pp; k++) html += '<div class="chan empty"></div>';
    host.innerHTML = html;
  }
  /* Clicking a segment redraws that column from the other pass. Bound on
     the host so it survives the markup being rebuilt by the pager. */
  wireDirs(host);
  host.querySelectorAll(".seg").forEach(s => placeSegThumb(s, false));
  host.querySelectorAll(".chan").forEach((el, i) => {
    const c = shown[i];
    const cmap = el.querySelector("canvas.map"), lp = el.querySelector("canvas.lp");
    if(!cmap) return;
    /* A SQUARE DATA AREA. At the panel's own column width this is within a
       few px of its 640 x 576 map; on a phone, where the margins are a much
       bigger share of a narrow column, keeping the panel's ratio made the map
       far taller than it is wide. The line plot stays two thirds of it, which
       is the panel's 3:2. */
    /* MEASURED TWICE ON PURPOSE. Giving these a height can make the page
       long enough for a scrollbar to appear, which narrows the column by
       the width of the bar AFTER the height was computed from the old
       width; the map then came out ten pixels taller than it is wide. If
       setting the height changed the width, do it again with the width
       that is now true. */
    const fit = () => {
      const cw = cmap.clientWidth;
      const inner = Math.max(60, cw - MARG.l - MARG.r);
      cmap.style.height = Math.round(inner + MARG.t + MARG.b) + "px";
      if(lp) lp.style.height = Math.round(inner*2/3 + MARG.t + MARG.b) + "px";
      return cw;
    };
    const first = fit();
    if(cmap.clientWidth !== first) fit();
    if(!c) return;
    const shownPass = passOf(c);
    /* The panel titles each plot with the pass it shows ("FB Mon - Up"). */
    if(m.dirs && m.dir_titles) shownPass.title = plainText(c.label) + " - " +
      m.dirs[dirOf[c.name] === "bwd" ? 1 : 0];
    drawMap(cmap, shownPass, m);
    if(lp) drawLine(lp, shownPass, m, page*pp + i);
  });
}

/* One timer, re-armed after each answer at the rate the answer deserves: a
   fixed interval would either poll a finished run every two seconds or make a
   running one wait twenty. */
function rearm(live){
  clearTimeout(timer);
  /* NOT WHILE NOBODY IS LOOKING. A tab left open behind others kept asking
     every second and a half, a whole snapshot each time: forty megabytes an
     hour for a page nobody was reading. Coming back asks at once
     (visibilitychange). */
  if(document.hidden){ timer = null; return; }
  timer = setTimeout(tick, live ? paceLive() : paceIdle());
}

/* The log's word for a state -> the lamp class and the word to print.
   "unknown" is NOT "off": the log has said nothing about that instrument, and
   claiming it is off would be a reading nobody took. */
const INST_STATE = {
  on:         ["on",         "Connected"],
  error:      ["error",      "Not Connected"],
  connecting: ["connecting", "Connecting"],
  unknown:    ["off",        "Not Seen"],

  el.innerHTML = [

/* What this device is, from the browser's own description of itself. */
const DEV_PHONE = '<svg viewBox="0 0 24 24"><path d="M17 1H7C5.9 1 5 1.9 5 3v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm-5 20.2a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zM17 18H7V4h10v14z"/></svg>';

function deviceInfo(){

           : /Android/.test(ua) ? "Android" : /Mac OS X/.test(ua) ? "Mac"

/* The chevron of a collapsible section, ui_style.draw_chevron's geometry. */
const SEC_CHEV = '<svg viewBox="0 0 24 24"><path d="M8.3 4.8 L15.7 12 L8.3 19.2"/></svg>';
/* The Approach panel's section mark: a small filled navy triangle. */
const SEC_TRI = '<svg class="tri" viewBox="0 0 10 10"><path d="M2 1 L8 5 L2 9 Z"/></svg>';
/* The same chevron turned down: an open run row in the records list. */

/* Which entries the reader has opened, kept across refreshes the way the
   run's own sections are: a list that collapsed itself every few seconds

const xlogOpen = new Set();

function renderXlog(x){

  }

    const open = xlogOpen.has(id);

    /* The section NAMES used to be listed here. The page does not show the
